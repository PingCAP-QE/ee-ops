---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-post # setup after deployment
  namespace: infra
spec:
  dependsOn:
    - name: cert-manager-release
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/gcp/cert-manager/post
  prune: true
