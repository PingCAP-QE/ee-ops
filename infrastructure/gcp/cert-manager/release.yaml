---
# Two-stage rollout, the same shape as `infrastructure/*/external-secrets`.
#
# The HelmReleases install cert-manager's CRDs, while the CA, the issuers and the
# Bundle are custom resources of those CRDs. Keeping both in one kustomization
# deadlocks: kustomize-controller server-side dry-runs the whole set before
# applying anything, so the Certificate fails with
# `no matches for kind "Certificate" in version "cert-manager.io/v1"` and the
# HelmRelease that would install the CRD is never reached.
#
# `release` applies the HelmReleases and waits for them through healthChecks,
# `post` depends on that and only then applies the custom resources.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-release # setup components
  namespace: infra
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/gcp/cert-manager/release
  prune: true
  timeout: 15m0s
  # Without these the parent goes Ready as soon as the HelmRelease objects are
  # applied, and `cert-manager-post` could race the CRD/webhook installation.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager
      namespace: cert-manager
