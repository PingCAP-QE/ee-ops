# Reference: https://flux-iac.github.io/tofu-controller/
# This Terraform CR creates a GCS bucket using the module in the same directory.
# Prerequisites:
#   1. GCP Workload Identity is configured (see tofu-controller/post/runner-workload-identity.yaml)
#   2. The GCP SA has roles/storage.admin permission
#   3. Update the spec.approvePlan when you're ready to apply
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: gcp-pingcap-testing-account
spec:
  # Left unset on purpose: the controller plans and then waits, so no change
  # reaches the project without a human reading the plan.
  #
  # This CR reconciles the identity that holds compute.admin, container.admin,
  # artifactregistry.admin and storage.admin, and the controller reconciles on an
  # interval, so `auto` made "merge to main" the only control between a PR and a
  # project-wide cloud change.
  #
  # To apply a plan, copy the id the controller reports ("set approvePlan:
  # plan-main-123 to apply this plan") into `.spec.approvePlan` below, commit and
  # push. GitOps stays the approval channel.
  #
  # approvePlan: plan-<id>
  interval: 1h
  retryInterval: 5m
  destroyResourcesOnDeletion: true
  sourceRef:
    kind: GitRepository
    name: ee-infra
    namespace: flux-system
  path: ./terraform/gcp/pingcap-testing-account
  vars:
    - name: project
      value: "pingcap-testing-account"
