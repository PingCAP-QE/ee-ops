apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-internal
  listeners:
    - name: wildcard-pingcap-net-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-to-envoy-route
spec:
  parentRefs:
    - name: external-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /debug
      backendRefs:
        # The Envoy data plane Service managed by Envoy Gateway, named via the
        # envoy-internal EnvoyProxy (envoyService.name).
        - name: envoy-infra-envoy-internal
          port: 80
