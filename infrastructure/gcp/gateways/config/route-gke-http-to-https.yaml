# GKE provisions the HTTP and HTTPS load balancers for this Gateway on the
# same address. Redirect the scoped HTTP listener before any backend routing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-http-to-https-prow
spec:
  parentRefs:
    - name: external-https
      sectionName: prow-tidb-net-http
  hostnames:
    - prow.tidb.net
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
