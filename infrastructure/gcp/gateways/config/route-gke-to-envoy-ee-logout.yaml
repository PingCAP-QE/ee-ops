# Envoy Gateway receives plain HTTP from this GKE HTTPS frontend and its OIDC
# logout handler otherwise derives an http:// post-logout Location for the
# site root. Keep the request on the Envoy path so its cookies are cleared,
# then send the Portal path through the Gateway's HTTP-to-HTTPS redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-to-envoy-ee-logout
spec:
  parentRefs:
    - name: external-https
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: Exact
            value: /ee/logout
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Location
                value: http://prow.tidb.net/ee
      backendRefs:
        - name: eg-internal
          port: 80
