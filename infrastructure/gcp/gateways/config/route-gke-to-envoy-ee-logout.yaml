# Envoy Gateway receives plain HTTP from this GKE HTTPS frontend and its OIDC
# logout handler otherwise derives an http:// post-logout Location. Keep the
# request on the Envoy path so its cookies are cleared, but canonicalize this
# response for the Portal at the HTTPS edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-to-envoy-ee-logout
spec:
  parentRefs:
    - name: external-https
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: Exact
            value: /ee/logout
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Location
                value: https://prow.tidb.net/ee
      backendRefs:
        - name: eg-internal
          port: 80
