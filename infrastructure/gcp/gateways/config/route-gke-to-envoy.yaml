apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gke-to-envoy-route
spec:
  parentRefs:
    - name: external-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /debug
      backendRefs:
        # The Envoy data plane Service managed by Envoy Gateway, named via the
        # `internal` EnvoyProxy (envoyService.name).
        - name: eg-internal
          port: 80
