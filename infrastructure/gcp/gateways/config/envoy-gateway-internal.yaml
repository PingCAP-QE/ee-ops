# This EnvoyProxy is referenced by the envoy-internal Gateway
# (Gateway.spec.infrastructure.parametersRef), NOT by the GatewayClass.
# Every Gateway of the envoy-gateway class MUST have its own EnvoyProxy with a
# unique envoyService.name, otherwise the fixed service name below will
# collide with another Gateway's data plane:
#
#   apiVersion: gateway.networking.k8s.io/v1
#   kind: Gateway
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: <envoy-proxy-name>   # per-Gateway EnvoyProxy
#
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: infra
spec:
  # External authorization must run after the authentication filters, so an OIDC
  # or JWT filter can attach a verified identity first: the OAuth2 forwardIDToken
  # header exists only if ext_authz runs after that filter. Verified on an
  # isolated Gateway with the same controller version; the resulting chain is
  # csrf -> oauth2 -> jwt_authn -> ext_authz -> rbac -> local_ratelimit ->
  # credential_injector -> router.
  #
  # Envoy regenerates x-request-id, and a request the authentication filters
  # reject no longer reaches ext_authz (so it produces no decision). Both are
  # recorded in docs/authz/shadow-rollout.md; shadow counts taken before this
  # change are not comparable with counts taken after it.
  #
  # filterOrder is EnvoyProxy-scoped, so it applies to every route on this
  # Gateway, including routes without extAuth.
  filterOrder:
    - name: envoy.filters.http.ext_authz
      after: envoy.filters.http.jwt_authn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Use a fixed-name ClusterIP service instead of the default
        # LoadBalancer with an autogenerated hash-suffixed name: traffic is
        # routed to this Envoy data plane via the GKE gateway (external-https)
        # HTTPRoute, so no external LB is needed.
        name: eg-internal
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-internal
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: wildcard-pingcap-net-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    # In-cluster HTTPS for callers that carry a credential. The data plane is a
    # ClusterIP service (see the EnvoyProxy above), so this listener is reachable
    # from pods only -- never from the internet. The certificate is the public
    # `*.pingcap.net` wildcard, so callers verify it with the roots their images
    # already ship; a route that needs a cluster-internal backend certificate
    # re-encrypts on top with a BackendTLSPolicy.
    - name: wildcard-pingcap-net-https
      protocol: HTTPS
      port: 443
      hostname: "*.pingcap.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-pingcap-net-cert
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
