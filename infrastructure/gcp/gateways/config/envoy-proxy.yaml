# This EnvoyProxy is referenced by the envoy-internal Gateway
# (Gateway.spec.infrastructure.parametersRef), NOT by the GatewayClass.
# Every Gateway of the envoy-gateway class MUST have its own EnvoyProxy with a
# unique envoyService.name, otherwise the fixed service name below will
# collide with another Gateway's data plane:
#
#   apiVersion: gateway.networking.k8s.io/v1
#   kind: Gateway
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: <envoy-proxy-name>   # per-Gateway EnvoyProxy
#
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal
  namespace: infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Use a fixed-name ClusterIP service instead of the default
        # LoadBalancer with an autogenerated hash-suffixed name: traffic is
        # routed to this Envoy data plane via the GKE gateway (external-https)
        # HTTPRoute, so no external LB is needed.
        name: envoy-infra-envoy-internal
        type: ClusterIP
