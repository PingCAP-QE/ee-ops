# This EnvoyProxy is referenced by the envoy-gateway GatewayClass
# (spec.parametersRef), so it applies to ALL Gateways of that class, including
# envoyService.name. DO NOT create a second Gateway on the envoy-gateway class
# without giving it its own Gateway-level EnvoyProxy:
#
#   apiVersion: gateway.networking.k8s.io/v1
#   kind: Gateway
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: <envoy-proxy-name>   # per-Gateway EnvoyProxy with a unique
#                                    # envoyService.name, or the fixed service
#                                    # name below will collide
#
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal
  namespace: infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Use a fixed-name ClusterIP service instead of the default
        # LoadBalancer with an autogenerated hash-suffixed name: traffic is
        # routed to this Envoy data plane via the GKE gateway (external-https)
        # HTTPRoute, so no external LB is needed.
        name: envoy-infra-envoy-internal
        type: ClusterIP
