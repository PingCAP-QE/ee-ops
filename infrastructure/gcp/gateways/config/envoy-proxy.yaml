apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal
  namespace: infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Use a fixed-name ClusterIP service instead of the default
        # LoadBalancer with an autogenerated hash-suffixed name: traffic is
        # routed to this Envoy data plane via the GKE gateway (external-https)
        # HTTPRoute, so no external LB is needed.
        name: envoy-infra-envoy-internal
        type: ClusterIP
