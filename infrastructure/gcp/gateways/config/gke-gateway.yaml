apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-https
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    # Keep the HTTP listener scoped to prow.tidb.net. It is used only for the
    # gateway-level HTTP-to-HTTPS redirect after Portal logout.
    - name: prow-tidb-net-http
      protocol: HTTP
      port: 80
      hostname: prow.tidb.net
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
    - name: wildcard-tidb-net-https
      protocol: HTTPS
      port: 443
      hostname: "*.tidb.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tidb-net-cert
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
    - name: wildcard-pingcap-net-https
      protocol: HTTPS
      port: 443
      hostname: "*.pingcap.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-pingcap-net-cert
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
  addresses:
    - type: NamedAddress
      value: gw-apps-ip
