---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-config
  namespace: infra
spec:
  targetNamespace: infra
  dependsOn:
    - name: envoy-gateway-release
    - name: envoy-gateway-crds
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/gcp/gateways/config
  prune: true
