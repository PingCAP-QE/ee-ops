#yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-crds-helm
      version: v1.9.0-rc.1
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: infra
  values:
    crds:
      gatewayAPI:
        # Gateway API CRDs are managed by the GKE addon (standard channel).
        enabled: false
      envoyGateway:
        enabled: true
