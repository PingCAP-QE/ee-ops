apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source-envoyproxy.yaml
  - release-envoy-gateway.yaml
  # Envoy Gateway CRDs, applied directly from the upstream release asset (pure
  # YAML, no Helm involved - the gateway-crds-helm chart exceeds Helm's 1MB
  # release secret limit, see envoyproxy/gateway#6105). Bump the tag to upgrade.
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.0-rc.1/envoy-gateway-crds.yaml
