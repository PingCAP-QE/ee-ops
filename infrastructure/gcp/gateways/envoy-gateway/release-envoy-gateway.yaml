#yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.0-rc.1
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: infra
  install:
    crds: Skip
  values:
    crds:
      # Gateway API CRDs are managed by the GKE addon (standard channel).
      # The chart's crds subchart ships experimental-channel CRDs, which are
      # rejected by the gateway-api safe-upgrades ValidatingAdmissionPolicy.
      enabled: false
