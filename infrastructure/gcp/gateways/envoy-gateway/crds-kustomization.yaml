# Envoy Gateway CRDs, applied directly from the upstream repo (pure YAML,
# no Helm involved — the gateway-crds-helm chart exceeds Helm's 1MB release
# secret limit, see envoyproxy/gateway#6105).
# Path: the gateway-helm chart's crds subchart contains the same CRDs as
# gateway-crds-helm but as plain YAML (no Helm template guards).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: infra
spec:
  interval: 10m0s
  prune: true
  sourceRef:
    kind: GitRepository
    name: envoy-gateway-upstream
    namespace: infra
  path: ./charts/gateway-helm/charts/crds/crds/generated
