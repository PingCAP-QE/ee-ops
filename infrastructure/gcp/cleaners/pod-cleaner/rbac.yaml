apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleaner
---
# Cluster-wide but READ-ONLY: both CronJobs run `kubectl get pods -A` to find
# stale pods across the cluster, which needs a cluster-wide `get`/`list`.
# The `delete` verb is deliberately NOT here -- it is granted per CI namespace
# by infrastructure/gcp/pod-cleaner-rbac (Role + RoleBinding), so this
# ClusterRole on its own cannot remove a pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleaner-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleaner-binding
subjects:
  - kind: ServiceAccount
    name: pod-cleaner
roleRef:
  kind: ClusterRole
  name: pod-cleaner-role
  apiGroup: rbac.authorization.k8s.io
