# Namespace-scoped `delete pods` for the pod-cleaner ServiceAccount
# (infra/pod-cleaner): one Role + RoleBinding per CI workload namespace.
#
# Why this directory exists: the cleaners' ClusterRole is read-only on purpose
# (`get`/`list` only -- both CronJobs run `kubectl get pods -A` to find stale
# pods cluster-wide), and the `delete` verb lives here instead, so pod-cleaner
# can only remove pods in the namespaces listed below. Do NOT move `delete`
# back into a ClusterRole.
#
# The list is explicit, never a wildcard. A new CI/build namespace needs a Role
# + RoleBinding added here; otherwise its OOMKilled / NotReady leftovers are
# never cleaned. The CronJob scripts run under `set -eo pipefail`, so a refused
# delete fails the Job visibly (red Job) rather than silently skipping.
#
# Every binding points at the ServiceAccount created by
# infrastructure/<cluster>/cleaners (its kustomization pins namespace: infra).

---
# apps: Prow workload namespace (apps/gcp/prow/namespace.yaml); live 2026-11-05: ~160 pods, 128 of them owned by Jobs (prow / ci-dashboard jobs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-cleaner-pod-delete
  namespace: apps
  labels:
    app.kubernetes.io/name: pod-cleaner
    app.kubernetes.io/component: pod-delete
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-cleaner-pod-delete
  namespace: apps
  labels:
    app.kubernetes.io/name: pod-cleaner
    app.kubernetes.io/component: pod-delete
roleRef:
  kind: Role
  name: pod-cleaner-pod-delete
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: pod-cleaner
    namespace: infra

