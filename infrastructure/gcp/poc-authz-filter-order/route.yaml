# A route that reuses the TiBuild machine identity contract so the PoC exercises
# the same JWT provider and allowlist as the real pilot. It lives in the tibuild
# namespace to reuse the existing Service without another ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-poc
  namespace: tibuild
spec:
  parentRefs:
    - kind: Gateway
      name: eg-authz-poc
      namespace: infra
  hostnames:
    - authz-poc.prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /probe
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-poc
  namespace: tibuild
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-poc
  jwt:
    optional: false
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - prow.tidb.net
        claimToHeaders:
          - claim: sub
            header: X-User-Id
  extAuth:
    failOpen: false
    timeout: 1s
    statusOnError: 503
    contextExtensions:
      - name: identity_mode
        value: machine
      - name: route_id
        value: authz-poc
    grpc:
      backendRefs:
        - name: authzd
          namespace: ee-authz
          port: 9002
