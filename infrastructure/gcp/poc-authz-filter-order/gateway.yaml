apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-authz-poc
  namespace: infra
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: authz-filter-order-poc
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    # HTTPS listener for the Phase B browser test. Envoy marks OIDC cookies
    # `Secure` unconditionally, and WebKit browsers drop them over plain
    # http://localhost, so the callback cannot validate its nonce without TLS.
    # Self-signed, localhost-only, exists only on this isolated Gateway.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: authz-poc-localhost-tls
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
