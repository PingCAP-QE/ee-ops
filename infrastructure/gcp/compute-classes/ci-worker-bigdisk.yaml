apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: ci-worker-bigdisk
spec:
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
  priorityDefaults:
    location:
      locationPolicy: ANY
      zoneTypes: [STANDARD]
  priorities:
    # --------- spot types -----------
    # NOTE: spot nodes are preempted with a 30s notice, which kills a long
    # compile job mid-flight. Anything scheduled here must tolerate being
    # restarted (prow retries the pod). Switch to on-demand first if these jobs
    # need to be deterministic.
    - machineFamily: c4d
      priorityScore: 100
      spot: true
      # Cluster-neutral selector: the same `compute-class` label is applied to
      # the `ci-worker-bigdisk` NodePool on the Tencent Cloud cluster, so a Prow
      # job keeps one nodeSelector when it migrates between clusters.
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c4
      priorityScore: 90
      spot: true
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c4a
      priorityScore: 85
      spot: true
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c3
      priorityScore: 60
      spot: true
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c3d
      priorityScore: 55
      spot: true
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500

    # --------- on-demand types -----------
    - machineFamily: c4d
      priorityScore: 50
      spot: false
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c4
      priorityScore: 40
      spot: false
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c4a
      priorityScore: 40
      spot: false
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c3
      priorityScore: 25
      spot: false
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
    - machineFamily: c3d
      priorityScore: 20
      spot: false
      nodeLabels:
        compute-class: ci-worker-bigdisk
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 500
