---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-post # setup after deployment
  namespace: infra
spec:
  dependsOn:
    - name: cert-manager-release
  # The Bundle CRD only exists once trust-manager is installed, so wait for its
  # HelmRelease instead of failing until the CRD shows up.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager
      namespace: cert-manager
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/tencentcloud/cert-manager/post
  prune: true
