---
# Two-stage rollout, the same shape as `infrastructure/*/external-secrets` and the
# GCP cluster: the HelmRelease installs cert-manager's CRDs, `cert-manager-post`
# then applies the CA and the issuers. See the GCP directory for the full
# explanation of the dry-run deadlock this avoids.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-release # setup components
  namespace: infra
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/tencentcloud/cert-manager/release
  prune: true
  timeout: 15m0s
  # Without these the parent goes Ready as soon as the HelmRelease objects are
  # applied, and `cert-manager-post` could race the CRD/webhook installation of
  # either chart (the Bundle is a trust-manager CRD).
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager
      namespace: cert-manager
