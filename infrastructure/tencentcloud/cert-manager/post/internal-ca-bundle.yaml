---
# Publishes the cluster-internal CA certificate to the namespaces that have to
# verify an internal service certificate. The CA *key* never leaves
# `cert-manager`; only the public certificate is copied.
#
# Consumers: `cache/internal-ca` for the git-cdn BackendTLSPolicy and
# `github-token-broker/internal-ca` for the token broker's, so Envoy Gateway can
# verify the pod certificate of each (apps/tencentcloud/cache/git-cdn/ and
# apps/tencentcloud/github-token-broker/).
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-ca
spec:
  sources:
    - secret:
        name: internal-ca
        key: tls.crt
  target:
    # ConfigMap `internal-ca` with key `ca.crt` in every selected namespace.
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - cache
            - github-token-broker
