apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here either: the namespaced custom resources carry it
# explicitly, and a transformer would stamp one onto the ClusterIssuers and the
# cluster-scoped Bundle.
resources:
  - internal-ca.yaml
  - cluster-issuers.yaml
  - internal-ca-bundle.yaml
