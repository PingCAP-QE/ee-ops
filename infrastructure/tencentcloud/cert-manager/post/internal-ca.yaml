---
# The cluster-internal CA is a trust anchor, not a credential: its *certificate*
# is distributed to consumers that need it, while the private key stays in this
# namespace and is never mounted into workloads or committed to Git.
#
# Rotation policy: the key is never rotated implicitly. Re-keying the CA changes
# every consumer's trust anchor, so it is done as a reviewed change that first
# distributes an overlapping bundle and only then re-issues the leaves.
#
# The Jenkins agents are the first HTTPS consumer on this cluster, so the trust
# anchor is distributed to their namespace only. A second consumer means adding
# its namespace here and to trust-manager's targetNamespaces in the same change;
# the anchor is never pushed to a namespace that has no client yet.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: pingcap-internal-services-ca
  secretName: internal-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Never
  issuerRef:
    name: internal-ca-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# Public trust material for the consumers that must verify the broker's leaf.
# The Bundle reads the CA certificate from the trust namespace and writes a
# ConfigMap the Jenkins agents mount; the CA private key never leaves
# `cert-manager`.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: github-token-broker-ca
  namespace: cert-manager
spec:
  sources:
    - secret:
        name: internal-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: jenkins-tidb
