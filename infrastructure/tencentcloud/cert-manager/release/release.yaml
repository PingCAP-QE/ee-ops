#yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # No issuer is installed by this chart: the cluster-internal CA is applied by
    # the `cert-manager-post` Kustomization after this release is healthy, and is
    # only reachable through reviewed GitOps changes.
    crds:
      enabled: true
    replicaCount: 2
    webhook:
      replicaCount: 2
    cainjector:
      replicaCount: 2
