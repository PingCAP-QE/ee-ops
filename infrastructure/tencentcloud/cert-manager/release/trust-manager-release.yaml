#yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 5m
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: trust-manager
      # renovate: datasource=helm depName=trust-manager registryUrl=https://charts.jetstack.io
      version: v0.26.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 2
    # Bundles here only assemble a private CA certificate, so the system trust
    # package and its extra image are not needed.
    defaultPackage:
      enabled: false
    # A Bundle source may only reference the trust namespace, and the internal
    # CA Secret is written there by cert-manager. Enabling Secret sources is
    # what grants trust-manager read access, so it is scoped as narrowly as the
    # chart allows: only this one Secret name, and only the namespaces listed in
    # app.targetNamespaces plus the trust namespace itself.
    secretTargets:
      enabled: true
      authorizedSecrets:
        - internal-ca
    app:
      trust:
        namespace: cert-manager
      # Keep trust-manager from writing targets outside the namespace that holds
      # the first HTTPS consumer (the Jenkins agents).
      targetNamespaces:
        - jenkins-tidb
