apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No kustomize `namespace:` here: it would rename the `Namespace/cert-manager`
# object to that namespace (kustomize treats a Namespace resource as the
# namespace itself), and it would also stamp a namespace onto cluster-scoped
# custom resources. The Flux Kustomizations carry `metadata.namespace: infra`
# explicitly instead.
resources:
  - namespace.yaml
  - release.yaml
  - post.yaml
