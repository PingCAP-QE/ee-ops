#yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/refs/heads/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 5m
  chart:
    spec:
      chart: external-secrets
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  # This controller holds the GCP Secret Manager credential and can read every
  # secret in `pingcap-testing-account`, so its images are pinned by digest:
  # the chart has no `digest` value, and a tag-only reference would let whoever
  # controls the registry swap the image under an existing tag.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: external-secrets
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/external-secrets/external-secrets:v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: external-secrets-webhook
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/external-secrets/external-secrets:v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: external-secrets-cert-controller
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/external-secrets/external-secrets:v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
  values:
    global:
      repository: ghcr.io/external-secrets/external-secrets
    replicaCount: 2
    webhook:
      replicaCount: 2
    certController:
      replicaCount: 2
    serviceAccount:
      create: true
    crds:
      enabled: true
    installCRDs: true
