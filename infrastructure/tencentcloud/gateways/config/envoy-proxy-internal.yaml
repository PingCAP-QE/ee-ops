apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-https-proxy
  namespace: infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          # ref: https://cloud.tencent.com/document/product/457/51258
          service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: "${internal_lb_subnet_id}" # should update to your own subnet id
          service.cloud.tencent.com/security-groups: "${security_group_id}"
          service.cloud.tencent.com/pass-to-target: "true"
          service.cloud.tencent.com/direct-access: 'true'
      # This data plane is the only backend of the internal CLB. With a single
      # replica the load balancer has nothing to fail over to, so moving the pod
      # (node recycle, eviction, rolling update) becomes a total outage: clients
      # get `dial tcp <vip>:443: i/o timeout` while the CLB silently drops the
      # SYNs pointed at the dead pod IP.
      #
      # Two replicas on the fixed `system` node pool, spread across zones, let the
      # CLB health check route around one bad pod instead of blackholing the VIP.
      envoyDeployment:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        pod:
          # `compute-class=system` is the fixed native node pool (one node per
          # zone, not managed by karpenter). The `ci-worker` and
          # `ee-application` pools are karpenter-managed and get consolidated, which
          # changes the pod IP behind the load balancer.
          nodeSelector:
            compute-class: system
          priorityClassName: system-cluster-critical
          annotations:
            # If the pool is ever brought under karpenter management, keep these
            # pods (and their node) out of voluntary disruption.
            karpenter.sh/do-not-disrupt: "true"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: internal-https
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: internal-https
        container:
          # Measured 324m CPU / ~100Mi under current traffic while the pod only
          # requested 100m on a node that was 109% committed on limits. Keep the
          # request high enough that the proxy is not starved by CI workloads.
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 1Gi
  # Stop accepting new connections and drain in-flight ones before the pod
  # disappears, so the CLB can retire the backend first.
  #
  # TKE took ~35s to actually deregister a backend after the pod went away
  # (2026-11-12: pod gone 15:28:55, BatchDeregisterTargets 15:29:30), so keep the
  # process alive well past the Envoy Gateway default of 10s while it is already
  # failing readiness — planned moves (rolling update, node drain) then never
  # leave the load balancer pointing at a socket that no longer listens.
  shutdown:
    minDrainDuration: 45s
    drainTimeout: 60s
