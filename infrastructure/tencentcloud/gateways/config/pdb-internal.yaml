---
# Keep at least one internal gateway data plane pod serving while nodes are
# drained (maintenance, node pool rotation). Without it a drain can take the only
# backend of the internal CLB away and clients see connection timeouts on the VIP.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-infra-internal-https
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: internal-https
      gateway.envoyproxy.io/owning-gateway-namespace: infra
