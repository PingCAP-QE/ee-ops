apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci-worker
spec:
  template:
    metadata:
      labels:
        compute-class: ci-worker
    spec:
      expireAfter: 168h
      nodeClassRef:
        group: karpenter.k8s.tke
        kind: TKEMachineNodeClass
        name: ci-worker
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
            - arm64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.k8s.tke/instance-family
          operator: In
          values:
            - SA9e # AMD Turin C, comparable to GCP C4D
            - SA9 # AMD Turin D, comparable to GCP N4D
            - S9pro # Intel latest gen high-performance
            - S9e # Intel latest gen standard
            - SK1 # ARM
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
