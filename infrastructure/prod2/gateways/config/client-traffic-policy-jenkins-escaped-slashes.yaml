# Keep encoded path slashes (%2F) for Jenkins Blue Ocean folder URLs.
# Scoped ONLY to Jenkins-dedicated listener (not wildcard-pingcap-cn-https).
# HTTPRoute jenkins-cbg must parentRef sectionName: cicd-pingcap-cn-https.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: jenkins-keep-escaped-slashes
  labels:
    app.kubernetes.io/part-of: jenkins-cbg-migrate
    purpose: blueocean-encoded-slash-jenkins-only
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      sectionName: cicd-pingcap-cn-https
  path:
    escapedSlashesAction: KeepUnchanged
