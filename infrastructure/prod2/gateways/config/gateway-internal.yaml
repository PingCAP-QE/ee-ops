apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ksc-gateway-config-internal
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # More replicas under concurrent registry blob uploads (hub.pingcap.net).
        replicas: 5
      envoyService:
        # Avoid Local+health-check path issues with classic LB under large PUTs.
        externalTrafficPolicy: Cluster
        annotations:
          service.beta.kubernetes.io/ksc-loadbalancer-subnet-id: f1f58229-7b99-4b44-bd24-c419bb3ca581 # should update to your own subnet id
          service.beta.kubernetes.io/ksc-loadbalancer-type: internal
          # Listener idle timeout (seconds). CCM applies this — do not edit LB in console.
          service.beta.kubernetes.io/ksc-loadbalancer-idle-timeout: "600"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ksc-gateway-config-internal
  listeners:
    - name: wildcard-pingcap-net-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    - name: wildcard-pingcap-net-https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-pingcap-net-cert
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    - name: wildcard-pingcap-cn-https
      protocol: HTTPS
      port: 443
      hostname: "*.pingcap.cn"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-pingcap-cn-cert
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    # Jenkins cbg (prod2): cicd.pingcap.cn — dedicated listener for Blue Ocean %2F.
    # ClientTrafficPolicy jenkins-keep-escaped-slashes binds only to this section.
    # Do NOT set KeepUnchanged on wildcard-pingcap-cn-https (would affect hub-cbg etc.).
    - name: cicd-pingcap-cn-https
      protocol: HTTPS
      port: 443
      hostname: cicd.pingcap.cn
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-pingcap-cn-cert
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
