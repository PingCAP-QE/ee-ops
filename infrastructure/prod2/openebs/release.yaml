---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: openebs-release # setup openebs components
  namespace: openebs
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./infrastructure/prod2/openebs/release
  prune: true
  postBuild:
    substitute:
      KUBELET_DIR: /data/kubelet
      OPENEBS_LOCAL_DIR: /data/openebs/local
