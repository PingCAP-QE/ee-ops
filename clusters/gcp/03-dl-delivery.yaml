# Delivery server modes need an explicit schema bootstrap: TiDB DDL is not
# transactional, and the runtime identities are not granted DDL. Two Flux
# Kustomizations keep the ordering while staying fully GitOps:
#
#   apps                 -> ExternalSecrets (DSN, policy) and the internal dl release
#   dl-delivery-migrate   -> one-shot Job; `wait: true` waits for Job completion
#   dl-delivery           -> management/public HelmReleases; dependsOn the Job
#
# If the Job fails, `dl-delivery-migrate` stays not-Ready and the Deployments are
# never created (fail closed). Re-run a migration by bumping the Job name or the
# image tag in the `migrate` directory.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dl-delivery-migrate
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/gcp/dl/migrate
  prune: true
  # Wait for the Job to complete before the dependent Kustomization runs.
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dl-delivery
  namespace: flux-system
spec:
  dependsOn:
    - name: dl-delivery-migrate
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/gcp/dl/delivery
  prune: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dl-management
      namespace: dl
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dl-public
      namespace: dl
