apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authzd-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: authzd-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ee-authzd-config
