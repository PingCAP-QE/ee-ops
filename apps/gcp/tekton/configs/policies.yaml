apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: set-node-selector-tekton-taskrun-pods
spec:
  rules:
    - name: add-compute-class-and-annotations
      match:
        resources:
          kinds:
            - Pod
          selector:
            matchExpressions:
              - key: tekton.dev/taskRun
                operator: Exists
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker

    # Override compute class for retried Tekton TaskRun pods to ensure they
    # run on on-demand CI workers instead of spot nodes.
    - name: override-compute-class-for-retried-pods
      match:
        resources:
          kinds:
            - Pod
          selector:
            matchExpressions:
              - key: tekton.dev/taskRun
                operator: Exists
      context:
        - name: is_retried_pod
          variable:
            default: false
            jmesPath: "regex_match('-retry[0-9]+$', request.object.metadata.name)"
      preconditions:
        all:
          - key: "{{ is_retried_pod }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker-ondemand
