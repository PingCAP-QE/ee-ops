---
# Webhook secret used to verify the HMAC-SHA256 signature that tibuild-v2 puts
# on every CloudEvent it delivers to http://el-tibuild.ee-cd.svc:8080.
#
# Deliberately a SECRET OF ITS OWN, not the GitHub App webhook secret
# (el-github-webhook): tibuild-v2 has to hold this value in order to sign, and
# it must not be able to forge GitHub deliveries to the `github` EventListener.
#
# Secret Manager coordinate, to be created by platform/security before the
# listener change is deployed (both clusters read the same GCP project through
# their `ee-gcp-sm` ClusterSecretStore):
#   project: pingcap-testing-account
#   secret:  gcp_tibuild_cloudevent_hmac
#   version: latest — any strong random value, e.g. `openssl rand -hex 32`
# The value is never committed here.
#
# tibuild-v2 has to sign with this same value; its copy comes from its own
# `v2-config` Secret (apps/<cluster>/tibuild/v2/external-secret-config.yaml),
# which the ee-apps signing change must wire to the same Secret Manager key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: el-tibuild-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: el-tibuild-webhook
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: gcp_tibuild_cloudevent_hmac
