# Webhook secret used to verify the GitHub signature on events delivered to the
# github EventListener. GitHub signs every App (214286) webhook delivery with
# its webhook secret; Prow's hook receives those deliveries and its
# `prow-tekton` external plugin forwards the payload with the original headers,
# including X-Hub-Signature-256, to http://el-github.ee-cd.svc:8080.
#
# The value is the same Secret Manager secret Prow uses for the GitHub App
# webhook, so no second copy of the credential exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: el-github-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: el-github-webhook
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: gcp_prow_github_app_webhook_hmac
