# The dashboard is served through Envoy Gateway (eg-internal) instead of the GKE
# gateway so that the route-level OIDC SecurityPolicy can protect it. The GKE
# gateway forwards prow.tidb.net to eg-internal (see
# infrastructure/gcp/gateways/config/route-gke-to-envoy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton
  namespace: tekton-pipelines
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tekton
      backendRefs:
        - name: tekton-dashboard
          port: 9097
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
