# Google OIDC login for the Tekton Dashboard (https://prow.tidb.net/tekton).
#
# The pingcap.com domain restriction is enforced by the Google OAuth client:
# it is an "Internal" Web application, so only PingCAP Workspace accounts can
# complete the authorization. The client credentials are shared through the
# GCP Secret Manager secret google-oauth2-client-ee-apps.
#
# The redirectURL is prefixed with the protected route's path (/tekton),
# otherwise the OAuth2 callback would not match this HTTPRoute.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tekton-dashboard-oidc
  namespace: tekton-pipelines
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tekton
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: tekton-dashboard-oidc
    clientSecret:
      name: tekton-dashboard-oidc
    redirectURL: https://prow.tidb.net/tekton/oauth2/callback
    logoutPath: /tekton/logout
    scopes:
      - openid
      - email
      - profile
