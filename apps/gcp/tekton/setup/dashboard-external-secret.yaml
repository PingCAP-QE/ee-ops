# Google OAuth Web client credentials for the Tekton Dashboard OIDC login.
# The client must allow the redirect URI
# https://prow.tidb.net/tekton/oauth2/callback.
# Store client-id and client-secret fields in the GCP Secret Manager secret named
# google-oauth2-client-ee-apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-dashboard-oidc
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: tekton-dashboard-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: google-oauth2-client-ee-apps
