# OIDC client credentials for the publisher OAuth2 flow (Google IdP).
# To create/update the secret in GCP Secret Manager:
#
#   echo '{"client-id": "<google-oauth-client-id>", "client-secret": "<google-oauth-client-secret>"}' | \
#     gcloud secrets create google-oauth2-client-ee-apps --data-file=-
#
# The Google OAuth 2.0 Client must be a Web application with redirect URI:
#   https://publisher.pingcap.net/oauth2/callback
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: publisher-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: publisher-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: google-oauth2-client-ee-apps
