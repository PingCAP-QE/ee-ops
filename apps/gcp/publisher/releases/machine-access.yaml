# Keep authenticated machine clients independent of browser CSRF headers.
# The Authorization header only selects this route; required JWT validation
# (not ambient OIDC cookies) authenticates every request on it.
# Keep path/backend/port in sync with publisher.yaml and chart publisher.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: publisher-machine
  namespace: publisher
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - publisher.pingcap.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: Authorization
              type: RegularExpression
              value: "^Bearer .+$"
      backendRefs:
        - name: publisher
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: publisher-machine-jwt
  namespace: publisher
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: publisher-machine
  jwt:
    optional: false
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - publisher.pingcap.net
