# Authentication for publisher.pingcap.net:
# - OIDC (Google): browser users via redirect-based login (session cookies)
# - JWT: machine clients presenting a Google-issued ID token in the
#   Authorization: Bearer header skip the OIDC redirect (passThroughAuthHeader)
#   and are validated against Google's JWKS.
#
# Machine clients obtain an ID token, e.g.:
#   gcloud auth print-identity-token \
#     --impersonate-service-account=publisher-api-client@<project>.iam.gserviceaccount.com \
#     --audiences=publisher.pingcap.net
# or via Workload Identity Federation in CI (google-github-actions/auth,
# token_format: id_token, target_audience: publisher.pingcap.net).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: publisher-oidc-jwt
  namespace: publisher
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: publisher
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: publisher-oidc
    clientSecret:
      name: publisher-oidc
    redirectURL: https://publisher.pingcap.net/oauth2/callback
    passThroughAuthHeader: true
    scopes:
      - openid
      - email
      - profile
  jwt:
    # optional: browser users authenticated via OIDC have no JWT and must pass;
    # invalid JWTs are still rejected regardless of this setting.
    optional: true
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - publisher.pingcap.net
