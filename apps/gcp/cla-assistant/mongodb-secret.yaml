apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
    secret-generator.v1.mittwald.de/encoding: hex
    # 32 hex characters = 128 bits. The generator only fills the key when the
    # Secret is created, so this affects new installs; the running password has
    # to be rotated deliberately (docs/credential-rotation/README.md,
    # "In-cluster generated secrets").
    secret-generator.v1.mittwald.de/length: 32
type: Opaque
stringData:
  username: cla
  database: cla
