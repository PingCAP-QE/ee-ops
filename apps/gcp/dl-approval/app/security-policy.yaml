# Google OIDC for the approval pages. The Gateway owns interactive login and
# forwards the ID token; the service verifies the token and enforces all
# authorization (domain, approver, ownership, state) in code.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dl-approval-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dl-approval-grants
  # No Envoy CSRF filter. It compares the request Origin with the destination
  # origin derived from this plain-HTTP listener (port 80), while the browser
  # posts from https://prow.tidb.net (443), so every form submit is rejected
  # with `Invalid origin` / `csrf_origin_mismatch`. `additionalOrigins` does not
  # help: the policy renders them as a host-only matcher, which never matches
  # the full origin string Envoy compares.
  # The service enforces its own `approval_csrf` double-submit token instead
  # (cookie + hidden form field, constant-time compare), so mutating requests
  # are still protected against cross-site submission.
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: dl-approval-oidc
    clientSecret:
      name: dl-approval-oidc
    cookieNames:
      accessToken: ee-apps-access-token
      idToken: ee-apps-id-token
    forwardIDToken:
      header: X-Approval-Id-Token
    redirectURL: https://prow.tidb.net/dl/grants/oauth2/callback
    logoutPath: /dl/grants/logout
    scopes:
      - openid
      - email
      - profile
