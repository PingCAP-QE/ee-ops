# Browser route for the approval form. It attaches to Envoy Gateway
# (eg-internal) so the route-level OIDC SecurityPolicy applies. The GKE gateway
# forwards prow.tidb.net to eg-internal (see
# infrastructure/gcp/gateways/config/route-gke-to-envoy.yaml), and Envoy picks
# this more specific /dl/grants route over dl's /dl route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dl-approval-grants
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dl/grants
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: dl-approval
          port: 80
