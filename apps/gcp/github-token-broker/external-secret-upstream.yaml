# Publish the external-reader ServiceAccount token to GCP Secret Manager and
# read it back with the "Bearer " prefix required by credential injection.
#
# The gateway validates the caller's Google ID token, then overwrites the
# Authorization header with this value before forwarding to the broker. The
# broker therefore sees a normal ServiceAccount token and performs TokenReview
# as before.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-external-reader-token
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - name: ee-gcp-sm
      kind: ClusterSecretStore
  selector:
    secret:
      name: external-reader-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: github_token_broker_external_reader_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-broker-upstream
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: github-token-broker-upstream
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Envoy credential injection expects the value in the "credential" key.
        credential: "Bearer {{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: github_token_broker_external_reader_token
