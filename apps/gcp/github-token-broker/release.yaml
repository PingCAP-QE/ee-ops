apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-token-broker
spec:
  releaseName: github-token-broker
  chart:
    spec:
      chart: github-token-broker
      version: 0.2.3
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
    ignoreFailures: false
  values:
    replicaCount: 2
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/github-token-broker
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/github-token-broker versioning=semver
      tag: v2026.11.22-39-g53753c8
    server:
      tls:
        # Native HTTPS listener. It serves the leaf cert-manager issues in
        # tls.yaml from the cluster-internal CA, and only the `arc-runners`
        # namespace may reach it (networkpolicy-arc-https.yaml). The legacy
        # HTTP 8080 listener and its probes stay as they are for the consumers
        # that have not migrated yet.
        enabled: true
        port: 8443
        existingSecret: github-token-broker-tls
        certKey: tls.crt
        keyKey: tls.key
    service:
      # Service 443 fronts the native TLS listener (targetPort: https).
      httpsPort: 443
    github:
      appId: 214286
      credentialsSecret:
        name: github-app-credentials
        key: privateKey.pem
    policy:
      existingSecret: github-token-broker-policy
      key: policy.yaml
    cache:
      # Never hand a caller a cached installation token with less than this
      # left. Entries are shared by everyone asking for the same repository set
      # and permissions, so the token a slow job receives can be the one another
      # caller minted minutes ago; the broker re-mints instead of serving one
      # that would expire mid-job.
      minRemaining: 15m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    networkPolicy:
      # Plaintext consumers of the HTTP listener (port 8080). The native TLS
      # port is never added here: `tlsIngressNamespaces` stays empty, so the
      # chart's own policy grants 8443 to nobody and the only TLS grant is the
      # dedicated `github-token-broker-arc-https` policy (arc-runners).
      tlsIngressNamespaces: []
      ingressNamespaces:
        # Active on THIS cluster: the GCP Tekton instance mints here what the
        # retired TencentCloud/prod2 ones used to (50 mints in 24h, caller
        # `ee-cd/github-bot`). It is the last plaintext consumer and moves only
        # once Tekton's own broker configuration is pointed at the gateway.
        - ee-cd
        # Migrated to the gateway in ee-ops#2947 (ci-dashboard `apps`, `tibuild`,
        # `chatops-lark`); the grants stay until the rollout is verified, then go
        # together with the plaintext Service port.
        - tibuild
        - chatops-lark
        - apps
        # Not here, on purpose:
        #   `infra`                  -- the Envoy data plane reaches the TLS
        #                               listener (networkpolicy-gateway-https.yaml)
        #   `jenkins-tidb`,
        #   `jenkins-tiflow`         -- they call the broker through the gateway
        #                               now (`github-token-broker-gcp.pingcap.net`,
        #                               ee-ops#2941), so nothing should reach the
        #                               plaintext port from those namespaces.
      egress:
        # DNS.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        # Kubernetes API (TokenReview/readiness) and GitHub API.
        - to:
            - ipBlock:
                # Cluster service CIDR.
                cidr: 10.116.0.0/20
            - ipBlock:
                # Private endpoint behind kubernetes.default (after Service DNAT).
                cidr: 10.128.0.37/32
            - ipBlock:
                # GitHub API ranges from https://api.github.com/meta.
                cidr: 140.82.112.0/20
            - ipBlock:
                cidr: 192.30.252.0/22
            - ipBlock:
                cidr: 185.199.108.0/22
            - ipBlock:
                cidr: 143.55.64.0/20
            - ipBlock:
                cidr: 2a0a:a440::/29
            - ipBlock:
                cidr: 2606:50c0::/32
          ports:
            - protocol: TCP
              port: 443
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    serviceMonitor:
      enabled: false
