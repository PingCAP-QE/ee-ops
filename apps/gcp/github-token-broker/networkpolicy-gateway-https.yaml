---
# Grants the Envoy data plane of the `infra/eg-internal` Gateway access to the
# broker's TLS listener. The chart's own policy covers the plaintext listener
# only; `networkpolicy-arc-https.yaml` does the same for the runners.
#
# Declarative only on this cluster: GKE here runs with
# `networkPolicyConfig.disabled: true`, so the control that keeps callers out is
# still the ServiceAccount token plus TokenReview.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-token-broker-gateway-https
spec:
  podSelector:
    # Pinned to release.yaml's releaseName and the chart's default name.
    # Do not set nameOverride/fullnameOverride there without updating this selector.
    matchLabels:
      app.kubernetes.io/name: github-token-broker
      app.kubernetes.io/instance: github-token-broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        # Service 443 targets the broker's native TLS listener.
        - protocol: TCP
          port: 8443
