apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-broker-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: github-token-broker-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        # Approved issuer's PEM chain (tls.crt) and leaf private key (tls.key).
        # The certificate must cover the broker's .svc.cluster.local DNS name.
        # Never place the CA private key in this object or on ARC runners.
        key: github_token_broker_tls_json
