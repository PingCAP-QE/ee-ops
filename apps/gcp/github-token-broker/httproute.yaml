# Public entry for the token broker. Only the exact token path is routed; the
# broker's /metrics and health endpoints stay cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-token-broker-external
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.pingcap.net
  rules:
    - matches:
        - path:
            type: Exact
            value: /gh-broker/v1/token
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/token
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-token-broker-upstream-credential
      backendRefs:
        - name: github-token-broker
          port: 80
