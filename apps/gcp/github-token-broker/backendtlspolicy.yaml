---
# Re-encrypt the gateway's upstream to the public `/gh-broker` route.
#
# TLS used to terminate at the GKE gateway and the last hop stayed plaintext on
# Service port 80, so the minted GitHub App installation token crossed the pod
# network in the clear (the request's Authorization header is an Envoy-injected
# read-only ServiceAccount token, so that direction is a fixed, low-value
# credential — the response is not).
#
# The certificate is the same leaf GitInsight verifies; Envoy validates it
# against the internal CA that trust-manager publishes as
# `github-token-broker/github-token-broker-ca`.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: github-token-broker-external
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: github-token-broker
      sectionName: https
  validation:
    hostname: github-token-broker.github-token-broker.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: github-token-broker-ca
