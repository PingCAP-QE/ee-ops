# Publish the external-reader ServiceAccount token to GCP Secret Manager, then
# read it back into a Secret that contains exactly one key. The Gateway
# authenticates API keys from this Secret; every key in it is accepted, so it
# must never point at external-reader-token directly (that Secret also contains
# ca.crt and namespace, which would become valid API keys).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-external-reader-token
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - name: ee-gcp-sm
      kind: ClusterSecretStore
  selector:
    secret:
      name: external-reader-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: github_token_broker_external_reader_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-broker-apikey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: github-token-broker-apikey
    creationPolicy: Owner
  data:
    - secretKey: external-client
      remoteRef:
        key: github_token_broker_external_reader_token
