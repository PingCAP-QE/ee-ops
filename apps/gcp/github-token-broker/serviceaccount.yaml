# Dedicated identity for the public token endpoint. It has no RBAC bindings:
# the token is only used to authenticate to the broker's TokenReview, so a
# leaked token cannot read cluster resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-reader
---
# Long-lived token for the same ServiceAccount. The ESO PushSecret copies it to
# GCP Secret Manager, and the ExternalSecret in external-secret-apikey.yaml
# copies it back into the single-key Secret used by the Gateway.
apiVersion: v1
kind: Secret
metadata:
  name: external-reader-token
  annotations:
    kubernetes.io/service-account.name: external-reader
type: kubernetes.io/service-account-token
