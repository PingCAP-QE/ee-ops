apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: github-app-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        # JSON object with the GitHub App private key under `privateKey.pem`.
        key: gha__system__github_app_private_key
