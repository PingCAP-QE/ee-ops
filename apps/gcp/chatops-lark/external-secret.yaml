apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatops-lark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: chatops-lark
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Keep app-id/app-secret in the resulting Secret so a rollback to a
      # chart that still reads them as environment variables keeps working.
      mergePolicy: Merge
      data:
        # The application reads bot credentials only from this file. The
        # dedicated Secret Manager keys are the source of truth and override
        # any stale values in the stored config.yaml.
        config.yaml: |
          {{ $cfg := index . "config.yaml" | fromYaml }}{{ mergeOverwrite $cfg (dict "app_id" (index . "app-id") "app_secret" (index . "app-secret")) | toYaml }}
  dataFrom:
    - extract:
        # json object contains keys:
        # - app-id
        # - app-secret
        # - config.yaml
        key: gcp_chatops_lark_json
