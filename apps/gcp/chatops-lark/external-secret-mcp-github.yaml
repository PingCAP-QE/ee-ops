# A dedicated GitHub token for the MCP tool, separate from the organisation bot
# PAT the Prow controllers use.
#
# Why a separate Secret: the MCP server runs with the token in its environment
# and has no inbound authentication of its own, so this credential should be the
# narrowest one that still works — read-only, scoped to the repositories the
# Lark chatops actually reads. It must not be the org-wide bot PAT.
#
# Issuance is a manual, org-admin step (a fine-grained token cannot be minted by
# automation). Requirements, all of them load-bearing:
#
#   1. Fine-grained PAT, **read-only** repository permissions the tool needs
#      (contents, issues, pull requests, metadata). No administration, no
#      organization-wide write scope.
#   2. **Selected repositories only** — not "all repositories in the org".
#   3. An **expiry date**, recorded in
#      conductor/projects/PingCAP-QE/ee-ops/tracks/ee_ops_security_20261113
#      under the token's GSM key. A token without an expiry is the same problem
#      in a smaller box.
#   4. Store it in GCP Secret Manager as `chatops-lark-mcp-github-token`.
#
# Rollout order matters: create the GSM key **before** merging this, otherwise
# the ExternalSecret cannot sync and the MCP pod has no token.
#
# Tracking: Helix `47d5208c`. The remaining step — trading this long-lived token
# for broker-issued short-lived installation tokens — is deliberately parked
# with the cross-cloud key work rather than solved twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-github-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: mcp-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: chatops-lark-mcp-github-token
