apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chatops-lark
spec:
  releaseName: chatops-lark
  chart:
    spec:
      chart: chatops-lark
      version: 0.1.4
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    # The chart's test pod is not reliable across node pools: it can time out
    # before the Service endpoints converge. The Deployment's readiness and
    # liveness probes already exercise /healthz, so skip the Helm test.
    enable: false
    ignoreFailures: false
  values:
    replicaCount: 1
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/chatops-lark
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/chatops-lark versioning=semver
      tag: v2026.11.1-2-g0416999
    server:
      secretName: chatops-lark
      configFileSecretKey: config.yaml
