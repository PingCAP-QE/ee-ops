apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chatops-lark-mcp-tool-github
spec:
  chart:
    spec:
      chart: mcp-tool
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: ee-ops
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: false
    ignoreFailures: true
  values:
    replicaCount: 1
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    image:
      repository: golang
      tag: "1.23"
    livenessProbe: false
    readinessProbe: false
    # The MCP server is compiled at pod start, so the module reference decides
    # what code runs with the bot token in the environment. Pinning a release tag
    # (v1.14.0, which provides `http --port/--read-only`) keeps it immutable; the
    # previous `@http-sse` branch reference re-resolved to whatever the branch
    # head was at every restart.
    command:
      - go
      - run
      - github.com/github/github-mcp-server/cmd/github-mcp-server@v1.14.0
    args: [http, --port=80, --read-only, --enable-command-logging]
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            name: github
            key: bot-token
