apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chatops-lark-mcp-tool-github
spec:
  chart:
    spec:
      chart: mcp-tool
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: ee-ops
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: false
    ignoreFailures: true
  values:
    replicaCount: 1
    # The MCP server runs with the organisation bot PAT in its environment and has
    # no inbound authentication of its own, so reachability is the boundary. Only
    # the consumers below were verified against the cluster; everything else is
    # denied.
    networkPolicy:
      enabled: true
      # `kube-system` for DNS, `gmp-system` for the GMP collector that scrapes this
      # target (`gmp-public` kept as the companion namespace).
      allowedNamespaces:
        - kube-system
        - gmp-system
        - gmp-public
      # kubelet probes come from the node address. These are the ranges the prow
      # nodes were observed in (`kubectl get nodes -o wide`).
      nodeCIDRs:
        - 10.128.0.0/24
        - 172.16.0.0/24
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    image:
      repository: golang
      # github-mcp-server v1.14.0 requires go >= 1.26.8 and the image sets
      # GOTOOLCHAIN=local, so the toolchain tag has to satisfy it.
      tag: "1.26"
    livenessProbe: false
    readinessProbe: false
    # The MCP server is compiled at pod start, so the module reference decides
    # what code runs with the bot token in the environment. Pinning a release tag
    # (v1.14.0, which provides `http --port/--read-only`) keeps it immutable; the
    # previous `@http-sse` branch reference re-resolved to whatever the branch
    # head was at every restart.
    command:
      - go
      - run
      - github.com/github/github-mcp-server/cmd/github-mcp-server@v1.14.0
    args: [http, --port=80, --read-only, --enable-command-logging]
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            name: github
            key: bot-token
