apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-sync-aws-warehouse-summary
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-sync-aws-warehouse-summary
    app.kubernetes.io/part-of: cost-insight
  annotations:
    repair.pingcap.com/source: warehouse-f80fbbe8e8.raw_aws_billing.cur_line_items
    repair.pingcap.com/source-commit: 22d4063cf63c274740947a57e226c559d9ba2466
    repair.pingcap.com/scope: four-ordinary-aws-accounts-only
spec:
  # Warehouse snapshots arrive after the legacy noon pipeline. Keep this
  # ordinary-CUR route separate from the held split/F04 source routes.
  schedule: "10 15 * * *"
  timeZone: Asia/Shanghai
  # Read-only and normal-command canaries verified all four accounts on 2026-10-30.
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # An uncertain write must be inspected, never automatically replayed.
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-sync-aws-warehouse-summary
            app.kubernetes.io/part-of: cost-insight
        spec:
          serviceAccountName: cost-insight-gcp-billing
          nodeSelector:
            cloud.google.com/compute-class: ee-application
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          containers:
            - name: sync-aws-warehouse-summary
              # Shared application worker; pinned multi-platform release digest.
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs@sha256:48ed49f38d58be3c0ac6b40d15ad96424e88d79c9cdc0a0ecb76f8c8dde40cee
              imagePullPolicy: IfNotPresent
              command: [cost-insight]
              args:
                - sync-warehouse-billing-summary
                - --vendor
                - aws
                - --account-id
                - "131464424160"
                - --account-id
                - "296171618728"
                - --account-id
                - "676546228356"
                - --account-id
                - "986330900858"
              envFrom:
                - secretRef:
                    name: ci-dashboard-eq-prd-insight-db
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: COST_INSIGHT_LOG_LEVEL
                  value: INFO
                - name: GOOGLE_CLOUD_PROJECT
                  value: warehouse-f80fbbe8e8
                - name: COST_INSIGHT_BILLING_BQ_PROJECT
                  value: warehouse-f80fbbe8e8
                - name: COST_INSIGHT_BILLING_BQ_LOCATION
                  value: us-west1
                - name: COST_INSIGHT_BILLING_BQ_IMPERSONATE_SERVICE_ACCOUNT
                  value: ""
                - name: COST_INSIGHT_TCMS_ALLOCATION_TABLE
                  value: tcms_cost.resource_allocation
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 4Gi
