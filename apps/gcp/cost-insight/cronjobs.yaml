apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-materialize-cost-allocations
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-materialize-cost-allocations
    app.kubernetes.io/part-of: cost-insight
spec:
  # Begins after the Beijing work window. Its preflight waits for every active
  # billing source and attribution refresh from this UTC day before publishing.
  schedule: "0 14 * * *"
  timeZone: Asia/Shanghai
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # A delayed start plus this deadline still finishes before 08:00 Beijing time.
      activeDeadlineSeconds: 54000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-materialize-cost-allocations
            app.kubernetes.io/part-of: cost-insight
        spec:
          serviceAccountName: ci-dashboard
          restartPolicy: Never
          containers:
            - name: materialize-cost-allocations
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs:v2026.9.6-5-g6adefe9
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  python - <<'PY'
                  import time
                  from datetime import UTC, datetime

                  from sqlalchemy import text

                  from cost_insight.common.db import build_engine

                  # ponytail: poll the existing job-state table instead of adding a workflow controller.
                  statement = text(
                      """
                      SELECT source.vendor, source.account_id,
                             summary.last_status AS summary_status,
                             attribution.last_status AS attribution_status
                      FROM cost_sources AS source
                      LEFT JOIN cost_job_state AS summary
                        ON summary.job_name = CONCAT(
                             'sync_', source.vendor, '_billing_summary:',
                             source.vendor, ':', source.account_id
                           )
                       AND summary.last_succeeded_at >= :cutoff
                      LEFT JOIN cost_job_state AS attribution
                        ON attribution.job_name = CONCAT(
                             'refresh_cost_attribution_from_summary:',
                             source.vendor, ':', source.account_id
                           )
                       AND attribution.last_succeeded_at >= :cutoff
                      WHERE source.is_active = 1 AND source.vendor IN ('gcp', 'aws', 'azure')
                      """
                  )
                  cutoff = datetime.now(UTC).replace(hour=0, minute=0, second=0, microsecond=0)
                  deadline = time.monotonic() + 3.5 * 60 * 60
                  while True:
                      engine = build_engine()
                      try:
                          with engine.connect() as connection:
                              states = tuple(connection.execute(statement, {"cutoff": cutoff}).mappings())
                      finally:
                          engine.dispose()
                      incomplete = [
                          f"{row['vendor']}:{row['account_id']}"
                          for row in states
                          if row["summary_status"] != "succeeded"
                          or row["attribution_status"] != "succeeded"
                      ]
                      if states and not incomplete:
                          print("All active billing sources and attribution refreshes are current.")
                          break
                      if time.monotonic() >= deadline:
                          raise RuntimeError("Timed out waiting for: " + ", ".join(incomplete or ["sources"]))
                      print("Waiting for: " + ", ".join(incomplete or ["sources"]))
                      time.sleep(300)
                  PY
                  end_date="$(python - <<'PY'
                  from sqlalchemy import text

                  from cost_insight.common.db import build_engine

                  engine = build_engine()
                  try:
                      with engine.begin() as connection:
                          value = connection.execute(
                              text("SELECT MAX(usage_date) FROM cost_attribution_daily")
                          ).scalar_one()
                  finally:
                      engine.dispose()
                  if value is None:
                      raise RuntimeError("No native cost facts are available")
                  print(value if isinstance(value, str) else value.isoformat())
                  PY
                  )"
                  cost-insight materialize-cost-allocations \
                    --start-date "${COST_ALLOCATION_EARLIEST_DATE}" \
                    --end-date "${end_date}" \
                    --eq-root-lark-group-id "${COST_INSIGHT_EQ_ROOT_LARK_GROUP_ID}"
              envFrom:
                - secretRef:
                    name: ci-dashboard-eq-prd-insight-db
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: COST_INSIGHT_LOG_LEVEL
                  value: INFO
                - name: COST_ALLOCATION_EARLIEST_DATE
                  value: "2026-06-01"
                - name: COST_INSIGHT_EQ_ROOT_LARK_GROUP_ID
                  value: od-ea02471a17b4244a1244d7e37dfca8ee
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-sync-aws-unmatched-resources
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-sync-aws-unmatched-resources
    app.kubernetes.io/part-of: cost-insight
spec:
  # Interpreted with timeZone below: Monday 23:10 Asia/Shanghai, after the GCP unmatched job.
  schedule: "10 23 * * 1"
  timeZone: Asia/Shanghai
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-sync-aws-unmatched-resources
            app.kubernetes.io/part-of: cost-insight
        spec:
          serviceAccountName: ci-dashboard
          restartPolicy: Never
          containers:
            - name: sync-aws-unmatched-resources
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs:v2026.9.6-5-g6adefe9
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  dates="$(python - <<'PY'
                  from datetime import datetime, timedelta, timezone
                  import os

                  lag_days = int(os.environ.get("COST_INSIGHT_UNMATCHED_RESOURCE_LAG_DAYS", "5"))
                  stable_date = datetime.now(timezone.utc).date() - timedelta(days=lag_days)
                  end_date = stable_date - timedelta(days=stable_date.weekday() + 1)
                  start_date = end_date - timedelta(days=6)
                  print(start_date.isoformat(), end_date.isoformat())
                  PY
                  )"
                  set -- ${dates}
                  cost-insight sync-aws-unmatched-resources \
                    --usage-start-date "$1" \
                    --usage-end-date "$2"
              envFrom:
                - secretRef:
                    name: ci-dashboard-eq-prd-insight-db
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: COST_INSIGHT_LOG_LEVEL
                  value: INFO
                - name: GOOGLE_CLOUD_PROJECT
                  value: pingcap-testing-account
                - name: COST_INSIGHT_AWS_BILLING_TABLE
                  value: gcp-digital-bi.stg_cloud_billing.stg_aws_billing
                - name: COST_INSIGHT_UNMATCHED_RESOURCE_LAG_DAYS
                  value: "5"
                - name: COST_INSIGHT_AWS_SYNC_PAGE_SIZE
                  value: "5000"
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
