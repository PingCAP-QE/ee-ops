apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-sync-gcp-billing-summary
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-sync-gcp-billing-summary
    app.kubernetes.io/part-of: cost-insight
spec:
  # Start the daily billing pipeline immediately after the 08:00–12:00 Beijing work window.
  schedule: "10 12 * * *"
  timeZone: Asia/Shanghai
  # Initial allocation backfill is complete; keep source facts current with daily syncs.
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-sync-gcp-billing-summary
            app.kubernetes.io/part-of: cost-insight
        spec:
          # Reuse the existing Workload Identity path; the bound GSA must have
          # BigQuery jobUser plus billing export dataset read access.
          serviceAccountName: ci-dashboard
          restartPolicy: Never
          containers:
            - name: sync-gcp-billing-summary
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs:v2026.9.6-5-g6adefe9
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  summary_json_path=/tmp/summary.json
                  cost-insight sync-gcp-billing-summary > "${summary_json_path}"
                  cat "${summary_json_path}"
                  allocation_args="$(python - <<'PY'
                  import json

                  with open("/tmp/summary.json", encoding="utf-8") as f:
                      payload = json.load(f)
                  if isinstance(payload, dict):
                      payloads = [payload]
                  else:
                      payloads = payload or []
                  dates = []
                  export_partition_starts = []
                  export_partition_ends = []
                  for item in payloads:
                      if not isinstance(item, dict):
                          continue
                      dates.extend(item.get("touched_usage_dates") or [])
                      export_partition_starts.append(item.get("export_partition_start"))
                      export_partition_ends.append(item.get("export_partition_end"))
                  if dates and all(export_partition_starts) and all(export_partition_ends):
                      print(
                          min(dates),
                          max(dates),
                          min(export_partition_starts),
                          max(export_partition_ends),
                      )
                  PY
                  )"
                  if [ -n "${allocation_args}" ]; then
                    # The command resolves every active GCP source, so use the
                    # union of the summary source windows for matching lineage.
                    set -- ${allocation_args}
                    cost-insight sync-gcp-kubernetes-workload-allocations \
                      --usage-start-date "$1" \
                      --usage-end-date "$2" \
                      --export-partition-start "$3" \
                      --export-partition-end "$4"
                    cost-insight refresh-cost-attribution-from-summary \
                      --start-date "$1" \
                      --end-date "$2" \
                      --split-by-day
                  else
                    echo "No touched usage dates returned; skip GKE allocation and attribution refresh."
                  fi
              envFrom:
                - secretRef:
                    name: ci-dashboard-eq-prd-insight-db
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: COST_INSIGHT_LOG_LEVEL
                  value: INFO
                - name: GOOGLE_CLOUD_PROJECT
                  value: pingcap-testing-account
                - name: COST_INSIGHT_GCP_ACCOUNT_ID
                  value: pingcap-testing-account
                - name: COST_INSIGHT_GCP_BILLING_TABLE
                  value: gcp-digital-bi.gcp_billing_detailed.gcp_billing_export_resource_v1_01D088_8F9CF2_8AF1C6
                - name: COST_INSIGHT_SYNC_LAG_DAYS
                  value: "3"
                - name: COST_INSIGHT_EXPORT_OVERLAP_DAYS
                  value: "3"
                - name: COST_INSIGHT_SYNC_PAGE_SIZE
                  value: "5000"
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-sync-azure-billing-summary
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-sync-azure-billing-summary
    app.kubernetes.io/part-of: cost-insight
spec:
  # Start after the Beijing work window; GCP starts first at 12:10.
  schedule: "30 12 * * *"
  timeZone: Asia/Shanghai
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-sync-azure-billing-summary
            app.kubernetes.io/part-of: cost-insight
        spec:
          # Reuse the existing Workload Identity path; the bound GSA must have
          # BigQuery jobUser plus Azure billing export dataset read access.
          serviceAccountName: ci-dashboard
          restartPolicy: Never
          containers:
            - name: sync-azure-billing-summary
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs:v2026.9.6-5-g6adefe9
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  summary_json_path=/tmp/summary.json
                  cost-insight sync-azure-billing-summary > "${summary_json_path}"
                  cat "${summary_json_path}"
                  python - <<'PY'
                  import json
                  from datetime import date

                  from cost_insight.common.config import get_settings
                  from cost_insight.common.db import build_engine
                  from cost_insight.jobs.refresh_attribution_daily import (
                      CostAttributionSource,
                      run_refresh_cost_attribution_from_summary,
                  )

                  with open("/tmp/summary.json", encoding="utf-8") as f:
                      payload = json.load(f)
                  if isinstance(payload, dict):
                      payload = [payload]

                  settings = get_settings()
                  engine = build_engine(settings)
                  try:
                      for item in payload or []:
                          if not isinstance(item, dict):
                              continue
                          dates = [
                              date.fromisoformat(value)
                              for value in item.get("touched_usage_dates") or []
                          ]
                          if not dates:
                              print(
                                  f"No touched usage dates for {item.get('account_id')}; "
                                  "skip attribution refresh."
                              )
                              continue
                          summary = run_refresh_cost_attribution_from_summary(
                              engine,
                              source=CostAttributionSource(
                                  vendor="azure",
                                  account_id=item["account_id"],
                              ),
                              start_date=min(dates),
                              end_date=max(dates),
                          )
                          print(summary)
                  finally:
                      engine.dispose()
                  PY
              envFrom:
                - secretRef:
                    name: ci-dashboard-eq-prd-insight-db
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: COST_INSIGHT_LOG_LEVEL
                  value: INFO
                - name: GOOGLE_CLOUD_PROJECT
                  value: pingcap-testing-account
                - name: COST_INSIGHT_AZURE_BILLING_TABLE
                  value: gcp-digital-bi.azure_billing.azure_billing_cost_*
                - name: COST_INSIGHT_AZURE_SYNC_LAG_DAYS
                  value: "3"
                - name: COST_INSIGHT_AZURE_EXPORT_OVERLAP_DAYS
                  value: "3"
                - name: COST_INSIGHT_AZURE_SYNC_PAGE_SIZE
                  value: "5000"
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
---
