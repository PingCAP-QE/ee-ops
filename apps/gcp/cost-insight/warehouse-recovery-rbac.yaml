# Warehouse resume checks the previous Pod before taking over its DB checkpoint.
# Only named Pod reads in apps are needed; no list/watch, mutations or secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cost-insight-warehouse-recovery
  namespace: apps
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cost-insight-warehouse-recovery
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: cost-insight-gcp-billing
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cost-insight-warehouse-recovery
