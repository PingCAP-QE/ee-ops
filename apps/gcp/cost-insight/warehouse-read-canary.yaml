apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-insight-warehouse-read-canary
  namespace: apps
  labels:
    app.kubernetes.io/name: cost-insight-warehouse-read-canary
    app.kubernetes.io/part-of: cost-insight
spec:
  # Manual-only access/shape check; never enable recurring execution for rollout.
  schedule: "0 4 * * *"
  timeZone: Asia/Shanghai
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-insight-warehouse-read-canary
            app.kubernetes.io/part-of: cost-insight
        spec:
          serviceAccountName: cost-insight-gcp-billing
          restartPolicy: Never
          containers:
            - name: warehouse-read-canary
              # Existing pinned image supplies the SDK; no new application release required.
              image: ghcr.io/pingcap-qe/ee-apps/cost-insight-jobs:v2026.9.20-1-gb8abd19
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -B
                - -u
                - -c
              args:
                - |
                  import json
                  import os

                  from google.cloud import bigquery

                  expected_principal = (
                      "hxprog-e5d756e67e8641f386ab0e9"
                      "@warehouse-f80fbbe8e8.iam.gserviceaccount.com"
                  )
                  maximum_bytes = 512 * 1024 * 1024
                  client = bigquery.Client(
                      project=os.environ["GOOGLE_CLOUD_PROJECT"],
                      location=os.environ["COST_INSIGHT_BILLING_BQ_LOCATION"],
                  )
                  print(json.dumps({"project": client.project, "location": client.location}))

                  def read_query(label, sql):
                      estimate = client.query(
                          sql,
                          job_config=bigquery.QueryJobConfig(
                              dry_run=True,
                              use_query_cache=False,
                              maximum_bytes_billed=maximum_bytes,
                          ),
                          retry=None,
                          job_retry=None,
                          timeout=60,
                      ).total_bytes_processed
                      print(f"{label}: dry_run_bytes={estimate} cap_bytes={maximum_bytes}")
                      if estimate is None or estimate > maximum_bytes:
                          raise RuntimeError(f"{label}: unknown or over-budget scan; not executed")
                      job = client.query(
                          sql,
                          job_config=bigquery.QueryJobConfig(
                              use_query_cache=False,
                              maximum_bytes_billed=maximum_bytes,
                          ),
                          retry=None,
                          job_retry=None,
                          timeout=60,
                      )
                      rows = [dict(row) for row in job.result(
                          timeout=60, retry=None, job_retry=None
                      )]
                      print(json.dumps({
                          "check": label,
                          "job_id": job.job_id,
                          "bytes_processed": job.total_bytes_processed,
                          "rows": rows,
                      }, default=str))
                      return rows

                  identity = read_query("identity", "SELECT SESSION_USER() AS principal")
                  if identity != [{"principal": expected_principal}]:
                      raise RuntimeError(f"unexpected warehouse identity: {identity!r}")

                  for table in ("aws_member_daily_cost", "alibaba_daily_cost", "azure_daily_cost"):
                      usage_filter = ""
                      if table == "aws_member_daily_cost":
                          # Fee/discount rows may be future-dated; they are not usage freshness.
                          usage_filter = """
                            AND charge_type IN ('Usage', 'SavingsPlanCoveredUsage')
                            AND usage_date <= CURRENT_DATE()
                          """
                      read_query(table, f"""
                          SELECT MAX(usage_date) AS max_usage_date
                          FROM `warehouse-f80fbbe8e8.mart_cloud_cost.{table}`
                          WHERE billing_period = DATE_TRUNC(CURRENT_DATE(), MONTH)
                          {usage_filter}
                      """)

                  read_query("gcp_raw_recent_export", """
                      SELECT MAX(export_time) AS max_export_time
                      FROM `warehouse-f80fbbe8e8.raw_gcp_billing.gcp_billing_export_resource_v1_01D088_8F9CF2_8AF1C6`
                      WHERE _PARTITIONDATE BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
                                               AND CURRENT_DATE()
                  """)
                  print("warehouse_read_canary=PASS access_and_shape_only=true; null dates are allowed")
              # Direct Workload Identity: no impersonation and no database secrets.
              env:
                - name: GOOGLE_CLOUD_PROJECT
                  value: warehouse-f80fbbe8e8
                - name: COST_INSIGHT_BILLING_BQ_LOCATION
                  value: us-west1
              resources:
                requests:
                  cpu: "100m"
                  memory: 256Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
