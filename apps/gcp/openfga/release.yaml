apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openfga
spec:
  interval: 1h
  url: https://openfga.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openfga
spec:
  interval: 10m
  releaseName: openfga
  chart:
    spec:
      chart: openfga
      version: "0.4.3"
      sourceRef:
        kind: HelmRepository
        name: openfga
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    serviceAccount:
      create: false
      name: openfga
    migrate:
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
    replicaCount: 2
    datastore:
      engine: mysql
      uriSecret: openfga-backend
      applyMigrations: true
      waitForMigrations: false
    authn:
      method: preshared
      preshared:
        keysSecret: openfga-backend
    playground:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openfga
              spec:
                template:
                  spec:
                    containers:
                      - name: openfga
                        env:
                          - name: OPENFGA_DATASTORE_URI
                            valueFrom:
                              secretKeyRef:
                                name: openfga-backend
                                key: runtime_uri
