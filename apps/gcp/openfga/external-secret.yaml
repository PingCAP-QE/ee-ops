apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: openfga-backend
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ee-openfga-backend
