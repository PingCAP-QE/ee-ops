apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudevents-server-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: cloudevents-server-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          test_case_run:
            store:
              driver: mysql
              dsn: {{ .TEST_CASE_RUN_DSN }}
          tekton:
            lark:
              app_id: cli_a040055148b85013
              app_secret: {{ .LARK_APP_SECRET }}
            dashboard_base_url: https://prow.tidb.net/tekton
            failed_step_tail_lines: 10
            receivers:
              "*": [oc_9dbe50e0aed1d31fd6d17dd1cb69385c]
              dev.tekton.event.pipelinerun.failed.v1: [oc_0f84f63871b7c1183e144545d65507ab, oc_1251d15beb3bb4ad3f1bfd672ea4c67c]
              dev.tekton.event.taskrun.failed.v1: [oc_0f84f63871b7c1183e144545d65507ab]
            notifications:
              - receivers: [oc_9dbe50e0aed1d31fd6d17dd1cb69385c]
              - event_type: dev.tekton.event.pipelinerun.failed.v1
                receivers: [oc_0f84f63871b7c1183e144545d65507ab, oc_1251d15beb3bb4ad3f1bfd672ea4c67c]
              - event_type: dev.tekton.event.taskrun.failed.v1
                receivers: [oc_0f84f63871b7c1183e144545d65507ab]
              # notify when tiup publish failed
              - event_type: dev.tekton.event.taskrun.failed.v1
                event_subject_reg: ^publish-tiup-from-oci-artifact
                receivers: [oc_1251d15beb3bb4ad3f1bfd672ea4c67c]
              # notify when image deliver external failed
              - event_type: dev.tekton.event.taskrun.failed.v1
                event_subject_reg: ^pingcap-deliver-image
                receivers: [oc_1251d15beb3bb4ad3f1bfd672ea4c67c]
          kafka:
            brokers:
              - cluster-cd-kafka-bootstrap.kafka.svc:9094
            client_id: cloudevents-server
            authentication:
              mechanism: SCRAM-SHA-512
              user: cloudevents-server
              password: {{ .KAFKA_PASSWORD }}
              ca_file: /etc/kafka/ca.crt
            producer:
              topic_mapping:
                dev.cdevents.pipelinerun.finished.0.1.0: jenkins-event
              default_topic: cloudevents-default-channel
            consumer:
              group_id: cloudevents-server-workers
              topic_mapping:
                "*": cloudevents-default-channel
              dead_letter_topic: cloudevents-dead-letter
  data:
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: gcp_cloudevents_kafka_password
    - secretKey: TEST_CASE_RUN_DSN
      remoteRef:
        key: gcp_cloudevents_test_case_run_dsn
    - secretKey: LARK_APP_SECRET
      remoteRef:
        key: gcp_cloudevents_lark_app_secret
