# The download proxy is served through Envoy Gateway (eg-internal) so the
# route-level OIDC SecurityPolicy can protect every /dl path. The GKE gateway
# forwards prow.tidb.net to eg-internal (see
# infrastructure/gcp/gateways/config/route-gke-to-envoy.yaml).
#
# Large artifacts are streamed for minutes, so the route disables the Envoy
# request timeout instead of relying on the former GKE GCPBackendPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dl
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dl
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: 0s
      backendRefs:
        - name: dl
          port: 80
