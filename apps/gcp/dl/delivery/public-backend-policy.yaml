# Backend behaviour for the anonymous redemption route.
#
# logging.enabled: false is a security requirement, not a preference: the token
# is part of the request path, and the GKE Gateway logs every HTTP request to
# Cloud Logging by default. With this policy attached, token paths never reach
# the load balancer log (application logging does not log them either).
#
# timeoutSec covers a full 24h transfer, matching
# --delivery-transfer-timeout. Do not lower it to the 30s default: large
# artifacts stream for minutes.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: dl-public
spec:
  default:
    timeoutSec: 86400
    logging:
      enabled: false
    # Edge rate limiting: Cloud Armor rate-based-ban policy `dl-public`, keyed
    # on the client IP and enforced on the whole backend, so it covers every
    # token under /d/. Keying on the path would be useless: each grant has its
    # own path, so an attacker would just rotate tokens.
    #   300 requests / 60s per IP, ban 300s, exceed -> 429
    # Tune with:
    #   gcloud compute security-policies rules update 1000 --security-policy dl-public \
    #     --project pingcap-testing-account --rate-limit-threshold-count 600
    securityPolicy: dl-public
  targetRef:
    group: ""
    kind: Service
    name: dl-public
