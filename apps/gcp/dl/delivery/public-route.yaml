# Public redemption surface for anonymous delivery links.
#
# Only `/d/{token}` is routed here: management, the legacy download paths and
# the private :8001 listener must never be reachable through this hostname.
# dl.pingcap.net is a separate origin, so the OIDC policy on prow.tidb.net/dl is
# unaffected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dl-public
spec:
  parentRefs:
    - kind: Gateway
      name: external-https
      namespace: infra
  hostnames:
    - dl.pingcap.net
  rules:
    - matches:
        # GKE rejects method matching (GWCER104), so the path is the only edge
        # filter; the handler answers 404 to anything that is not GET/HEAD.
        - path:
            type: PathPrefix
            value: /d/
      backendRefs:
        - name: dl-public
          port: 80
