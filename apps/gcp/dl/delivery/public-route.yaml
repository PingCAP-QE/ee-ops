# Public redemption surface for anonymous delivery links.
#
# Only `/d/{token}` is routed here: management, the legacy download paths and
# the private :8001 listener must never be reachable through this hostname.
# dl.pingcap.net is a separate origin, so the OIDC policy on prow.tidb.net/dl is
# unaffected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dl-public
spec:
  parentRefs:
    - kind: Gateway
      name: external-https
      namespace: infra
  hostnames:
    - dl.pingcap.net
  rules:
    - matches:
        # Redemption is read-only; refuse everything else at the edge even
        # though the handler would answer 404 as well.
        - method: GET
          path:
            type: PathPrefix
            value: /d/
        - method: HEAD
          path:
            type: PathPrefix
            value: /d/
      backendRefs:
        - name: dl-public
          port: 80
