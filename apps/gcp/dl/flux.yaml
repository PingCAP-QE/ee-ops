# App-specific Flux Kustomizations, applied by the cluster-level `apps`
# Kustomization (same pattern as apps/gcp/prow and apps/gcp/tekton).
#
#   dl-app               -> internal dl release, routes, ExternalSecrets
#   dl-delivery-migrate  -> one-shot delivery schema Job
#   dl-delivery          -> management/public HelmReleases
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dl-app
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/gcp/dl/app
  prune: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dl
      namespace: dl
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dl-delivery-migrate
spec:
  dependsOn:
    - name: dl-app
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/gcp/dl/migrate
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dl-delivery
spec:
  dependsOn:
    - name: dl-delivery-migrate
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/gcp/dl/delivery
  prune: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dl-management
      namespace: dl
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dl-public
      namespace: dl
