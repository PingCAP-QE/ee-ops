# Delivery schema migration, deliberately split into its own Flux Kustomization
# (see clusters/gcp/03-dl-delivery.yaml) so the Deployments in `dl-delivery` are
# only applied after the Job succeeds.
#
# Re-running a migration: bump the name suffix (`-v2`, `-v3`, ...) and point it at
# the image that carries the new schema. Flux prunes the previous Job and
# creates the new one. Do not edit an existing Job in place: its pod template,
# image tag included, is immutable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dl
resources:
  - job.yaml
