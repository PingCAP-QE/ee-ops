# Google OAuth Web client credentials for the /dl route OIDC login.
# The client must allow the redirect URI https://prow.tidb.net/dl/oauth2/callback.
# Store client-id and client-secret fields in the GCP Secret Manager secret
# named google-oauth2-client-ee-apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dl-oidc
  namespace: dl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: dl-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: google-oauth2-client-ee-apps
