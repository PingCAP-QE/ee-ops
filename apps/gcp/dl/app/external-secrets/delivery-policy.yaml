# Issuer policy for the delivery server modes: public origin, per-issuer
# repository/tag/TTL scopes and the SHA-256 of each issuer bearer secret.
#
# GSM key: gcp_dl_delivery_policy_json — a JSON object with a single `policy.yaml`
# key whose value is the YAML document. Start from
# https://github.com/PingCAP-QE/ee-apps/blob/main/dl/examples/delivery-policy.yaml
#
# The plaintext issuer secrets live with the issuing service, never here: the
# policy only carries their hashes. A short refresh interval keeps the mounted
# file fresh, and dl swaps the policy in place (no rollout).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dl-delivery-policy
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: dl-delivery-policy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gcp_dl_delivery_policy_json
