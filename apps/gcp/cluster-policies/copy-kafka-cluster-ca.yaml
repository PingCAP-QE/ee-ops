apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: copy-kafka-cluster-ca
spec:
  rules:
    # Strimzi's CA lives in the kafka namespace; pods in `cs` cannot mount a
    # Secret from another namespace, so keep a synchronised copy next to them.
    - name: clone-ca-into-cs
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: ["cs"]
      generate:
        apiVersion: v1
        kind: Secret
        name: kafka-cluster-ca
        namespace: cs
        synchronize: true
        clone:
          namespace: kafka
          name: cluster-cd-cluster-ca-cert
