#yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/refs/heads/main/config/crds/crds/policies.kyverno.io_mutatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: make-application-pods-run-on-low-cost-nodes
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  # kyverno/kyverno#16141 (regression, fixed in Kyverno 1.19): a mutating policy
  # without any matchConditions is folded into the shared
  # `mpol.validate.kyverno.svc-fail` webhook together with policies of the other
  # scope, the generated webhook names collide, and the controller can never
  # apply the webhook configuration again - mutations then silently stop.
  # Keep one trivially-true condition until this cluster runs Kyverno >= 1.19.
  matchConditions:
    - name: always-true
      expression: "true"
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - apps
            - arc-systems
            - jenkins
            - kafka
            - kafka-operator
            - tekton-operator
            - tekton-pipelines
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          has(object.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/nodeSelector/cloud.google.com~1compute-class", value: "ee-application"}] :
            [JSONPatch{op: "add", path: "/spec/nodeSelector", value: {"cloud.google.com/compute-class": "ee-application"}}]
