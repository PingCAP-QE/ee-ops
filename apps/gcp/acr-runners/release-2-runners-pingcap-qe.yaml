apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-pingcap-qe
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  interval: 15m
  timeout: 10m
  values:
    githubConfigUrl: https://github.com/PingCAP-QE
    githubConfigSecret: arc-runner-set-pingcap-qe-github-config
    runnerGroup: "EE-Group" # must be created first.
    maxRunners: 10
    template:
      spec:
        # Runner registration is delivered via JIT config; the pod does not
        # need to talk to the API server.
        automountServiceAccountToken: false
        containers:
          - name: runner
            # Pin the runner tag and digest so upgrades are reviewed through
            # Renovate PRs.
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: "6"
                memory: 12Gi
