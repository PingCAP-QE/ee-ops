apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-pingcap-qe
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  interval: 15m
  timeout: 10m
  values:
    githubConfigUrl: https://github.com/PingCAP-QE
    githubConfigSecret: arc-runner-set-pingcap-qe-github-config
    runnerGroup: "EE-Group" # must be created first.
    maxRunners: 10
    template:
      spec:
        # Runner registration is delivered via JIT config, so the runner itself
        # does not need the API server. The projected ServiceAccount token is
        # mounted for the workloads instead: in-cluster services that authenticate
        # callers with TokenReview (the github-token-broker) need to know which
        # workload is asking. The chart's ServiceAccount carries no RBAC
        # bindings, so the token cannot reach the API server.
        automountServiceAccountToken: true
        volumes:
          - name: github-token-broker-ca
            configMap:
              name: github-token-broker-ca
              # Keep existing HTTP consumers/runners working during staged rollout.
              # The HTTPS helper fails closed if this CA file is missing.
              # Mount all keys so a missing ca.crt cannot block runner startup.
              optional: true
        containers:
          - name: runner
            # Pin the runner tag and digest so upgrades are reviewed through
            # Renovate PRs.
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
            command: ["/home/runner/run.sh"]
            env:
              - name: GITINSIGHT_BROKER_CA_FILE
                value: /etc/github-token-broker/ca/ca.crt
            volumeMounts:
              - name: github-token-broker-ca
                mountPath: /etc/github-token-broker/ca
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: "6"
                memory: 12Gi
