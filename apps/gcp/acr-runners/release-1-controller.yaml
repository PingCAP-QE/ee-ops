apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  interval: 15m
  timeout: 10m
  # The controller chart ships CRDs under crds/. Helm never upgrades them on
  # `helm upgrade`, and Flux defaults `upgrade.crds` to Skip, so new fields
  # added since 0.11.0 (e.g. actionableRevision) would be pruned by the
  # existing (0.11.0) CRDs and break the revision-aware runner lifecycle.
  upgrade:
    crds: CreateReplace
  values:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
