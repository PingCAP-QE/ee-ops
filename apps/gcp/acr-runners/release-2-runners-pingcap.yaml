apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set-docker-pingcap
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  interval: 15m
  timeout: 10m
  values:
    githubConfigUrl: https://github.com/pingcap
    githubConfigSecret: arc-runner-set-docker-pingcap-github-config
    runnerGroup: "Docker-Group" # must be created first.
    maxRunners: 2
    template:
      spec:
        # Runner registration is delivered via JIT config; the pod does not
        # need to talk to the API server.
        automountServiceAccountToken: false
        containers:
          - name: runner
            # Pin instead of :latest so upstream cannot swap the runner image
            # under us (2.338.2 is what :latest resolves to at the time).
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2375
          - name: docker
            image: docker:28.3.0-dind
            # dind needs privileged; keep it untouched here. Splitting this
            # scale set into its own namespace/node pool is tracked separately.
            securityContext:
              privileged: true
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            volumeMounts:
              - name: docker-graph-storage
                mountPath: /var/lib/docker
            ports:
              - containerPort: 2375
                name: docker
        volumes:
          - name: docker-graph-storage
            emptyDir: {}
