apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ci-dashboard
  namespace: apps
spec:
  releaseName: ci-dashboard
  chart:
    spec:
      chart: ci-dashboard
      version: 0.3.3
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
    ignoreFailures: false
  values:
    replicaCount: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: ci-dashboard
            app.kubernetes.io/name: ci-dashboard
      - maxSkew: 1
        minDomains: 2
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: ci-dashboard
            app.kubernetes.io/name: ci-dashboard
    nodeSelector:
      kubernetes.io/arch: amd64
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/ci-dashboard
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/ci-dashboard versioning=semver
      tag: v2026.8.30-4-g9e7639d
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
    env:
      - name: CI_DASHBOARD_LOG_LEVEL
        value: INFO
      - name: CI_DASHBOARD_ENABLE_RUNTIME_INSIGHTS
        value: "true"
      - name: CI_DASHBOARD_ENABLE_COST_DASHBOARD
        value: "true"
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: ci-dashboard@pingcap-testing-account.iam.gserviceaccount.com
    httpRoute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: eg-internal
          namespace: infra
      hostnames:
        - prow.tidb.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /dashboard/
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
    secretEnvFrom:
      - ci-dashboard-eq-prd-insight-db
