apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-dashboard-jenkins-worker
  namespace: apps
  labels:
    app.kubernetes.io/name: ci-dashboard-jenkins-worker
    app.kubernetes.io/part-of: ci-dashboard
    ci-dashboard.pingcap.com/instance: jenkins-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-dashboard-jenkins-worker
      app.kubernetes.io/part-of: ci-dashboard
      ci-dashboard.pingcap.com/instance: jenkins-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-dashboard-jenkins-worker
        app.kubernetes.io/part-of: ci-dashboard
        ci-dashboard.pingcap.com/instance: jenkins-worker
    spec:
      serviceAccountName: ci-dashboard
      restartPolicy: Always
      containers:
        - name: jenkins-worker
          image: ghcr.io/pingcap-qe/ee-apps/ci-dashboard-jobs:replaced-by-kustomize
          imagePullPolicy: IfNotPresent
          args:
            - consume-jenkins-events
          envFrom:
            - secretRef:
                name: ci-dashboard-eq-prd-insight-db
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CI_DASHBOARD_LOG_LEVEL
              value: INFO
            - name: CI_DASHBOARD_KAFKA_BOOTSTRAP_SERVERS
              value: cluster-cd-kafka-bootstrap.kafka.svc:9094
            - name: CI_DASHBOARD_KAFKA_JENKINS_EVENTS_TOPIC
              value: jenkins-event
            - name: CI_DASHBOARD_KAFKA_JENKINS_GROUP_ID
              value: ci-dashboard-v3-jenkins-worker
            - name: CI_DASHBOARD_KAFKA_POLL_TIMEOUT_MS
              value: "1000"
            - name: CI_DASHBOARD_JENKINS_FINISHED_EVENT_TYPE
              value: dev.cdevents.pipelinerun.finished.0.1.0
            # Authenticated listener (TLS + SCRAM). The password lives in the
            # Secret Strimzi creates for the KafkaUser; the CA is the cluster's
            # own, which is not in the image's trust store.
            - name: CI_DASHBOARD_KAFKA_SASL_USERNAME
              value: ci-dashboard-jenkins-worker
            - name: CI_DASHBOARD_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ci-dashboard-jenkins-worker
                  key: password
            - name: CI_DASHBOARD_KAFKA_SSL_CAFILE
              value: /etc/kafka/ca.crt
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-ca
            items:
              - key: ca.crt
                path: ca.crt
