# Explicit GET + Bearer matches outrank the browser GET route: Envoy Gateway
# counts the method as an exact header match when ordering routes.
# This is not an authentication bypass: the matching route requires a valid
# JWT and never accepts the browser's OIDC cookies as authentication.
# Keep path/rewrite/backend/port in sync with release.yaml and chart tibuild-v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tibuild-v2-machine
  namespace: tibuild
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    # The browser route matches GET too. Matching both the method and Bearer
    # header gives machine reads priority without changing browser OIDC access.
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          method: GET
          headers:
            - name: Authorization
              type: RegularExpression
              value: "^Bearer .+$"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          headers:
            - name: Authorization
              type: RegularExpression
              value: "^Bearer .+$"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tibuild-v2-machine-jwt
  namespace: tibuild
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tibuild-v2-machine
    # Privileged paths on the browser route (publish / hotfix / artifact):
    # same JWT requirement and the same service-account allowlist.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tibuild-v2-privileged
  jwt:
    optional: false
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - prow.tidb.net
        # Publish the verified claims as request headers so the service can
        # authorize the caller without parsing tokens itself. Envoy writes these
        # from the claims it validated, and because `optional: false` rejects a
        # request without a valid token, a client cannot smuggle its own value
        # through on this route.
        claimToHeaders:
          - claim: sub
            header: X-User-Id
          - claim: email
            header: X-User-Email
          - claim: name
            header: X-User-Name
  # External authorization, observation only. authzd verifies the same Bearer
  # token independently and records what enforcement would decide; it returns
  # allow for every request while AUTHZD_DECISION_MODE is observe, so nothing a
  # client sees changes. The identity mode and route id are context extensions:
  # authzd never infers either from client headers.
  #
  # This policy also targets tibuild-v2-privileged, deliberately: a POST with a
  # Bearer token matches both that route's method rule and this route's header
  # rule, and the tie breaks on creation time. Giving each route its own policy
  # (and therefore its own route id) would turn that tie-break into an
  # authorization difference. One policy, one route id, both routes.
  extAuth:
    failOpen: false
    timeout: 1s
    statusOnError: 503
    contextExtensions:
      - name: identity_mode
        value: machine
      - name: route_id
        value: tibuild-v2-machine
    grpc:
      backendRefs:
        - name: authzd
          namespace: ee-authz
          port: 9002
  # A valid Google ID token for the audience is not an authorization: any
  # Google identity (any project's service account, any Workspace user) can
  # mint one, because the audience value is not a secret. Only the callers
  # below may use the machine route, everything else gets a 403.
  authorization:
    defaultAction: Deny
    rules:
      - name: tibuild-clients
        action: Allow
        principal:
          jwt:
            provider: google
            claims:
              - name: email
                values:
                  - devops-server@gcp-resilience-dev.iam.gserviceaccount.com # DevOps platform prod env
                  - devops-server-dev@gcp-resilience-dev.iam.gserviceaccount.com # DevOps platform dev env
                  - devops-server-staging@gcp-resilience-dev.iam.gserviceaccount.com # DevOps platform staging env
                  # tibuild-v2 API clients created for tirelease and TCMS
                  # (see PingCAP-QE/ee-infra service-accounts module).
                  - tirelease-tibuild-client@pingcap-testing-account.iam.gserviceaccount.com
                  - tcms-tibuild-client@pingcap-testing-account.iam.gserviceaccount.com
      # No domain-wide fallback: `hd == pingcap.com` would let any employee ID
      # token call the machine API, which has no CSRF protection. Staff calls
      # are expected to use one of the service accounts above.
