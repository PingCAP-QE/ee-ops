# Authentication for prow.tidb.net/tibuild:
# - Browser route: OIDC (Google) only. Browser users authenticate through a
#   redirect-based login and carry the OIDC session cookies.
# - Machine route: Bearer clients select the more-specific route in
#   machine-access.yaml, where a Google-issued ID token is required and
#   allowlisted by service-account / domain claims. OIDC cookies cannot
#   authenticate that route.
#
# This browser policy deliberately has no JWT provider and no
# passThroughAuthHeader: a request carrying a non-canonical Authorization
# header must not be able to skip the OIDC login. Bearer clients use the
# machine route instead.
#
# Machine clients obtain an ID token, e.g.:
#   gcloud auth print-identity-token \
#     --impersonate-service-account=tibuild-v2-api-client@<project>.iam.gserviceaccount.com \
#     --audiences=prow.tidb.net
# or via Workload Identity Federation in CI (google-github-actions/auth,
# token_format: id_token, target_audience: prow.tidb.net).
# Browser writes require same-host Origin/Referer; verified JWT clients do not.
# See docs/gcp-route-csrf.md for the request contract and rollout checks.
#
# The redirectURL must be prefixed with the protected route's path (/tibuild),
# otherwise the OAuth2 callback never matches the route and the flow fails.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tibuild-v2-oidc
  namespace: tibuild
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: v2-tibuild-v2
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: tibuild-v2-oidc
    clientSecret:
      name: tibuild-v2-oidc
    # Use the same OIDC cookie names as the Portal route so browser API calls
    # do not start a second redirect-based login flow. Envoy Gateway v1.9
    # supports explicit names, but not the cookie name suffix form.
    cookieNames:
      accessToken: ee-apps-access-token
      idToken: ee-apps-id-token
    redirectURL: https://prow.tidb.net/tibuild/oauth2/callback
    scopes:
      - openid
      - email
      - profile
