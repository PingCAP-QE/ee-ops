# OIDC client credentials for the tibuild v2 OAuth2 flow (Google IdP).
# To create/update the secret in GCP Secret Manager:
#
#   echo '{"client-id": "<google-oauth-client-id>", "client-secret": "<google-oauth-client-secret>"}' | \
#     gcloud secrets create tibuild-v2-oidc --data-file=-
#
# The Google OAuth 2.0 Client must be a Web application with redirect URI:
#   https://prow.tidb.net/tibuild/oauth2/callback
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tibuild-v2-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: tibuild-v2-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tibuild-v2-oidc
