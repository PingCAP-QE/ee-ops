apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.9
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.10.25-44-g69ced1a
    server:
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for image sync (crane), mounted as Docker config.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        # delivery.yaml from the artifacts packages ConfigMap, synced into this
        # namespace by the tibuild-packages-config Kustomization.
        - name: packages-config
          configMap:
            name: packages-config
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
        - name: packages-config
          subPath: delivery.yaml
          mountPath: /etc/delivery/delivery.yaml
          readOnly: true
    serviceAccount:
      create: false
    worker:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
    httpRoute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: eg-internal
          namespace: infra
      hostnames:
        - prow.tidb.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
