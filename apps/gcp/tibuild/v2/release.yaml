apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.9
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
  values:
    replicaCount: 2
    # The API records TiDB-X image tags in the TCMS portal
    # (tcms-portal.pingcap.net), whose network ACL only accepts the fixed egress
    # IP of the `whitelist-nat` pool (Cloud NAT `whitelist-nat` ->
    # `nat-whitelist-ip`). Calls from other node pools are reset at the TCP
    # level. Keep the same scheduling contract the publisher had before it was
    # replaced by tibuild-v2.
    nodeSelector:
      cloud.google.com/gke-nodepool: whitelist-nat
    tolerations:
      - key: network
        operator: Equal
        value: whitelist
        effect: NoSchedule
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.11.8-29-ge73bb8f
    server:
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for image sync (crane), mounted as Docker config.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        # delivery.yaml from the artifacts packages ConfigMap, synced into this
        # namespace by the tibuild-packages-config Kustomization.
        - name: packages-config
          configMap:
            name: packages-config
        - name: tidbcloud-config
          secret:
            secretName: tibuild-v2-tidbcloud-config
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
        - name: packages-config
          subPath: delivery.yaml
          mountPath: /etc/delivery/delivery.yaml
          readOnly: true
        - name: tidbcloud-config
          subPath: service-tidbcloud-ops.yaml
          mountPath: /etc/tidbcloud/ops.yaml
          readOnly: true
        - name: tidbcloud-config
          subPath: service-tidbcloud-testplatforms.yaml
          mountPath: /etc/tidbcloud/testplatforms.yaml
          readOnly: true
    serviceAccount:
      create: false
    worker:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
    httpRoute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: eg-internal
          namespace: infra
      hostnames:
        - prow.tidb.net
      rules:
        # Reads only. Every mutating method under /tibuild is served by the
        # machine-only route in privileged-access.yaml; keeping the two method
        # sets disjoint is what makes the split deterministic, because Envoy
        # Gateway orders same-path routes without considering the method.
        #
        # One rule per method: the Gateway API only allows a ReplacePrefixMatch
        # URLRewrite when the rule carries exactly one path match, so a single
        # rule with GET/HEAD/OPTIONS matches is rejected by admission.
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild
              method: GET
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild
              method: HEAD
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild
              method: OPTIONS
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
