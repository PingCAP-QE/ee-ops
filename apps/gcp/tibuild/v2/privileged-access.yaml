# Privileged TiBuild endpoints (publish / hotfix / artifact / tidbcloud) are
# machine-only.
#
# The browser route (`/tibuild`, OIDC + CSRF) deliberately has no principal
# allowlist: its whole point is that any staff member can read the UI. Those
# four prefixes, however, plan and publish releases, create hotfix tags, trigger
# artifact syncs and roll TiDB Cloud component versions / kernel images — the same capabilities the machine route exposes to a
# service-account allowlist. Until this file existed they were reachable with a
# browser session alone.
#
# Gateway API precedence selects the longest matching path prefix, so these
# rules win over the `/tibuild` browser rule. They attach the machine route's
# SecurityPolicy (`tibuild-v2-machine-jwt`): JWT required (`optional: false`)
# and the service-account allowlist, which rejects OIDC cookies outright.
#
# `ReplacePrefixMatch` has to name the matched prefix itself, not `/`: in the
# rules below the matched prefix is longer than the browser rule's `/tibuild`,
# so rewriting to `/` would drop the `api/v2/<kind>` part of the path. The
# method rule at the end matches exactly `/tibuild`, so `/` is correct there.
#
# The method rule is the invariant that survives new endpoints: whatever the
# path, a mutating request under `/tibuild` is machine-only. It works because
# the browser rule in release.yaml matches only GET/HEAD/OPTIONS — the two
# method sets are disjoint, so ordering does not matter (Envoy Gateway sorts
# same-path routes by path length and header count, not by method).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tibuild-v2-privileged
  namespace: tibuild
spec:
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild/api/v2/publish
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/publish
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild/api/v2/hotfix
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/hotfix
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild/api/v2/artifact
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/artifact
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
    # TiDB Cloud ops: component-version rollout, TCMS image-tag records and
    # kernel-image sync. These drive the production ops platform with the
    # service's own credential, so they belong on the machine route for the
    # same reason as publish/hotfix. CI reaches them over the in-cluster
    # Service (`v2-tibuild-v2.tibuild.svc`), not through this route.
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild/api/v2/tidbcloud
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/tidbcloud
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
    # Every mutating request under /tibuild, whatever its path. Endpoints that
    # do not exist yet are covered the day they ship; the prefix rules above
    # stay because they also pin the URL rewrite for the privileged paths.
    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          method: PUT
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          method: PATCH
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /tibuild
          method: DELETE
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: v2-tibuild-v2
          port: 80
