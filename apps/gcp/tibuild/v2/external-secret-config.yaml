apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: v2-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: v2-config
    template:
      type: Opaque
      data:
        config.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}

          tekton:
            cloudevent_endpoint: http://el-tibuild.ee-cd.svc:8080
            api_url: http://tekton-dashboard.tekton-pipelines.svc:9097
            view_url: https://prow.tidb.net/tekton
            oci_file_download_url: "https://prow.tidb.net/dl/oci-file"
            reconciler_interval: 15s
            reconciler_since: 4h
          lark:
            image_sync_url: "https://tcms.pingcap.net/dashboard/image-sync-tasks"
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}

          github:
            token: {{ .github_token }}
            broker_url: "http://github-token-broker.github-token-broker.svc"

          product_repo_map:
            tidb-cse: tidbcloud/tidb-cse
            pd-cse: tidbcloud/pd-cse
            tidb-operator-cse: tidbcloud/tidb-operator-cse
            cassandra-on-mysql: tidbcloud/cassandra-on-mysql
            qdrant-on-tidb: tidbcloud/qdrant-on-tidb
            pd: tikv/pd
            tikv: tikv/tikv
            tiflash: pingcap/tiflash
            tidb: pingcap/tidb
            ticdc: pingcap/ticdc
            dm: pingcap/tiflow
            # extra products required by tirelease hotfix builds
            br: pingcap/tidb
            dumpling: pingcap/tidb
            tidb-lightning: pingcap/tidb
            ticdc-newarch: pingcap/ticdc
            tici: pingcap-inc/tici
            enterprise-plugin: pingcap-inc/enterprise-plugin
            ng-monitoring: pingcap/ng-monitoring
            tidb-binlog: pingcap/tidb-binlog
            drainer: pingcap/tidb-binlog
            pump: pingcap/tidb-binlog
            tidb-dashboard: pingcap/tidb-dashboard
            tidb-operator: pingcap/tidb-operator
            tidb-tools: pingcap/tidb-tools
            tiproxy: pingcap/tiproxy

          worker:
            targets: ["*"]
            concurrency: 4
            poll_interval: "10s"
            lease: "90s"
            heartbeat: "30s"
            max_attempts: 3
            kinds: ["image_copy"]

          image_sync:
            source_regx: '^(hub\.pingcap\.net|us-docker.pkg.dev/pingcap-testing-account/(hotfix|hub))/(pingcap|tikv)/[\w-/]+:v\d+\.\d+\.\d+-\d{8,}.*$'
            target_regx: '^((docker\.io/)?pingcap/[\w-]+|gcr\.io/pingcap-public/dbaas/[\w-]+):v\d+\.\d+\.\d+-\d{8,}.*$'
            polling_rate: "10s"

  data:
    - secretKey: github_token
      remoteRef:
        key: github-bot-token
    - secretKey: dsn
      remoteRef:
        key: tibuild_v2_dsn
    - secretKey: lark_app_id
      remoteRef:
        key: tibuild_v2_lark_app_id
    - secretKey: lark_app_secret
      remoteRef:
        key: tibuild_v2_lark_app_secret
