# Sync PingCAP-QE/artifacts/packages into the tibuild namespace so tibuild-v2 can
# read the delivery rules (packages/delivery.yaml) as a mounted file.
#
# The Kustomization lives next to the app instead of inside it because Flux
# cannot order resources inside one Kustomization; the ConfigMap only has to
# exist before the tibuild-v2 pods that mount it start, and pods stay pending
# until it does.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: artifacts-delivery
spec:
  interval: 5m0s
  ref:
    branch: main
  url: https://github.com/PingCAP-QE/artifacts.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tibuild-packages-config
spec:
  targetNamespace: tibuild
  interval: 10m0s
  # No namespace: the source lives next to this Kustomization, in the app
  # namespace the parent kustomization assigns.
  sourceRef:
    kind: GitRepository
    name: artifacts-delivery
  path: ./packages
  prune: true
