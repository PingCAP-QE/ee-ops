apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - release.yaml
  - http-route.yaml
  - security-policy.yaml
  - external-secret.yaml
configMapGenerator:
  - name: ee-portal-registry
    namespace: ee-portal
    files:
      - registry.json=generated/registry.json
configurations:
  - kustomizeconfig.yaml
