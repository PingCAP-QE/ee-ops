apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  chart:
    spec:
      chart: ee-portal
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  test:
    enable: true
  values:
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-ee-portal
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-ee-portal versioning=semver
      tag: v0.1.0
    registry:
      configMapName: ee-portal-registry
      key: registry.json
