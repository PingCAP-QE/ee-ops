apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Reuse the shared infra Gateway; this module does not create a Gateway.
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    # Keep module API calls on the same route-level OIDC policy as the Portal
    # shell. This avoids starting a second OIDC session in the TiBuild route.
    - matches:
        - path:
            type: PathPrefix
            value: /ee/api/tibuild
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: v2-tibuild-v2
          namespace: tibuild
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ee
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ee-portal
          port: 8080
