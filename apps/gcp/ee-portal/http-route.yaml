apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Reuse the shared infra Gateway; this module does not create a Gateway.
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    # The `/ee/api/tibuild` proxy rule was removed: it handed the whole TiBuild
    # API (`/api/v2/publish|hotfix|artifact|tidbcloud`) to any OIDC-authenticated
    # employee, with no principal allowlist. The Portal's tibuild module is
    # therefore unavailable until that call path is reimplemented with its own
    # authorization (machine identity or an explicit principal allowlist).
    # Restoring it without that authorization reopens the finding.
    - matches:
        - path:
            type: PathPrefix
            value: /ee
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ee-portal
          port: 8080
