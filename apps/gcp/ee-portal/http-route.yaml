apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Reuse the shared infra Gateway; this module does not create a Gateway.
  parentRefs:
    - kind: Gateway
      name: eg-internal
      namespace: infra
  hostnames:
    - prow.tidb.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ee
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ee-portal
          port: 8080
