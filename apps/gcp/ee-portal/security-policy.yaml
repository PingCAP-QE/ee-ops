apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Authentication is scoped to this HTTPRoute on the shared Gateway.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ee-portal
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: ee-portal-oidc
    clientSecret:
      name: ee-portal-oidc
    # The JWT claim-to-header filter consumes this cookie. It remains
    # Secure/HttpOnly and is only sent over the TLS Gateway connection.
    disableTokenEncryption: true
    cookieNames:
      idToken: ee-portal-id-token
    redirectURL: https://prow.tidb.net/ee/oauth2/callback
    logoutPath: /ee/logout
    scopes:
      - openid
      - email
      - profile
  # OIDC establishes the browser session. The JWT filter reads the ID token
  # cookie issued by OIDC, verifies it at the edge, and emits the identity
  # claims as application headers.
  jwt:
    optional: true
    providers:
      - name: google-oidc
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        extractFrom:
          cookies:
            - ee-portal-id-token
        claimToHeaders:
          - claim: sub
            header: X-User-Id
          - claim: email
            header: X-User-Email
          - claim: name
            header: X-User-Name
