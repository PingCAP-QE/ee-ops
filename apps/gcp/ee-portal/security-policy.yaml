apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Authentication is scoped to this HTTPRoute on the shared Gateway.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ee-portal
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
      # Do not silently select the browser's existing Google session after a
      # Portal logout. Google will show the account chooser on the next OIDC
      # authorization request.
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
    clientIDRef:
      name: ee-portal-oidc
    clientSecret:
      name: ee-portal-oidc
    # Share the OIDC session with the protected TiBuild API route. Envoy
    # Gateway v1.9 does not support the cookie name suffix form; use explicit
    # names so both route-level policies address the same browser session.
    cookieNames:
      accessToken: ee-apps-access-token
      idToken: ee-apps-id-token
    # Keep the cookie format compatible with the TiBuild API policy, which
    # validates the shared ID-token cookie when serving module API requests.
    # This does not enable JWT authentication on the Portal route.
    disableTokenEncryption: true
    redirectURL: https://prow.tidb.net/ee/oauth2/callback
    logoutPath: /ee/logout
    scopes:
      - openid
      - email
      - profile
