apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ee-portal
  namespace: ee-portal
spec:
  # Authentication is scoped to this HTTPRoute on the shared Gateway.
  #
  # The route itself is currently removed (see apps/gcp/ee-portal/): the Portal
  # was exposed to every OIDC employee with no principal allowlist, including a
  # proxy to the whole TiBuild API. The policy and the OIDC client stay here so
  # that re-enabling the Portal is a revert, but until `HTTPRoute/ee-portal`
  # exists this policy has no target and reports Accepted=False.
  # Do not recreate the route without deciding its authorization model.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ee-portal
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: ee-portal-oidc
    clientSecret:
      name: ee-portal-oidc
    # Share the OIDC session with the protected TiBuild API route. Envoy
    # Gateway v1.9 does not support the cookie name suffix form; use explicit
    # names so both route-level policies address the same browser session.
    cookieNames:
      accessToken: ee-apps-access-token
      idToken: ee-apps-id-token
    redirectURL: https://prow.tidb.net/ee/oauth2/callback
    logoutPath: /ee/logout
    scopes:
      - openid
      - email
      - profile
