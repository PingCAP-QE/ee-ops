# Google OAuth Web client credentials. The client must allow the redirect URI
# https://prow.tidb.net/ee/oauth2/callback. Store client-id and client-secret
# fields in the GCP Secret Manager secret named ee-portal-oidc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ee-portal-oidc
  namespace: ee-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: ee-portal-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ee-portal-oidc
