---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jenkins-pre
spec:
  targetNamespace: jenkins
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/gcp/jenkins/beta/pre
  prune: true
  postBuild:
    substitute:
      GOOGLE_OAUTH_JSON: google-oauth2-client-jenkins
      JENKINS_CACHE_S3_JSON: gcp_jenkins_cache_s3_json
      JENKINS_ARTIFACT_S3_JSON: gcp_jenkins_cache_s3_json
      CODECOV_TOKENS_JSON: prod2_jenkins_beta_codecov_tokens_json
      KS3UTIL_CONFIG: prod2_jenkins_beta_ks3util_config
