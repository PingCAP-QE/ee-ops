apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-artifact-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: jenkins-artifact-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          jenkins.io/credentials-type: aws
        annotations:
          jenkins.io/credentials-description: AWS credentials for bucket to store Jenkins artifacts
      data:
        # Retained for GCP main, which still resolves this shared Secret as an
        # AWS Jenkins credential during the staged migration.
        accessKey: "{{ .accessKey }}"
        secretKey: "{{ .accessSecret }}"
        # Staging Artifact Manager reads these configuration fields. They can
        # coexist with the AWS credential fields above.
        region: "{{ .region }}"
        bucket: "{{ .bucket }}"
        # artifact-manager-s3 customEndpoint only accepts host[:port], without scheme.
        endpoint-host: '{{ trimPrefix "http://" (trimPrefix "https://" .endpoint) }}'
  dataFrom:
    - extract:
        key: "${JENKINS_ARTIFACT_S3_JSON}"
