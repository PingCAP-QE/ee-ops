# please see: https://github.com/jenkinsci/helm-charts/blob/main/charts/jenkins/VALUES_SUMMARY.md
controller:
  # Download plugins directly from a mainland mirror instead of following the
  # updates.jenkins.io redirect to overseas mirrors (mirror.dst.ca,
  # mirror.globo, ...), which time out from this cluster. Same setting as the
  # tencentcloud instances, where the plugin install finishes in ~5 minutes;
  # without it the init container here took ~53 minutes for 130 plugins
  # (installLatestPlugins resolves every plugin against the update center),
  # which exceeds the HelmRelease's 15m `spec.timeout` and made every upgrade
  # fail with `timeout waiting for StatefulSet/jenkins status: InProgress`.
  initContainerEnv:
    - name: JENKINS_UC_DOWNLOAD_URL
      value: https://mirrors.tuna.tsinghua.edu.cn/jenkins/plugins
  containerEnv:
    - name: JENKINS_UC_DOWNLOAD_URL
      value: https://mirrors.tuna.tsinghua.edu.cn/jenkins/plugins

  overwritePlugins: true
  installLatestPlugins: true

  # Override the default list to use our own custom plugin
  # Ref: https://artifacthub.io/packages/helm/jenkinsci/jenkins?modal=values&path=controller.installPlugins
  installPlugins:
    - kubernetes:4437.vd64141124d8f:https://github.com/wuhuizuo/jenkins-kubernetes-plugin/releases/download/4437.vd64141124d8f/kubernetes-4437.vd64141124d8f.hpi
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    # Keep this at least at the chart's default (5.10.9 ships 2143) and never
    # older than the requirement of the plugins resolved by `--latest`. With
    # core 2.580.2, the latest `credentials` (1514) becomes eligible and needs
    # configuration-as-code >= 2117; an older pin here fails the plugin
    # resolution in the init container and CrashLoopBackOffs the controller.
    # Ref: https://plugins.jenkins.io/credentials/
    - configuration-as-code:2143.vc78d4eb_d4174

  # List of plugins to install in addition to those listed in controller.installPlugins
  additionalPlugins:
    # Administrative action logging (who configured/deleted a job, ran a Groovy
    # script, used a credential). Console logger writes to the controller's stdout,
    # so the existing pod log pipeline collects it without extra infrastructure.
    # Requires Jenkins core >= 2.555.3; this controller runs 2.580.2.
    - audit-trail:472.vb_51e5934ec50
    # Access Control for Builds: lets builds run as the user who triggered them
    # (QueueItemAuthenticator + TriggeringUsersAuthorizationStrategy), the
    # precondition for the Job DSL Groovy sandbox. The mapping itself is
    # declarative in values-JCasC.yaml (`security.queueItemAuthenticator`).
    # Already validated on tencent staging (#2649): seed #42/#43 ran as the
    # triggering user instead of SYSTEM.
    # requiredCore 2.479.3 <= this controller's 2.580.2; the only advisory for
    # this plugin (SECURITY-3010) applies to versions <= 1.7.2.
    - authorize-project:534.v2f208c45e11c
    # Ref: https://github.com/jenkinsci/plugin-installation-manager-tool#plugin-input-format
    # but without outer `plugin` key.
    - artifact-manager-s3:973.v6a_51253e896b_
    - build-failure-analyzer::https://github.com/PingCAP-QE/build-failure-analyzer-plugin/releases/download/v2.4.2-jobname/build-failure-analyzer.hpi
    - cdevents::https://github.com/dillon-zheng/cdevents-plugin/releases/download/cdevents-1-40-pingcap-1/cdevents-1-40-pingcap-1.hpi
    # PingCAP fork: skip withCredentials cleanup when the agent is offline, so a lost agent
    # (e.g. preempted Kubernetes pod) under `retry` no longer fails the build on cleanup.
    # Ref: jenkinsci/credentials-binding-plugin#530 (fixes #531)
    - credentials-binding:725.ve52b_2328a_fde-fork.2:https://github.com/wuhuizuo/credentials-binding-plugin/releases/download/725.ve52b_2328a_fde-fork.2/credentials-binding-725.ve52b_2328a_fde-fork.2.hpi
    - generic-webhook-trigger:2.4.1
    - google-login:109.v022b_cf87b_e5b_
    - http_request:1.25
    - jenkins-pipeline-cache:0.2.0:https://github.com/j3t/jenkins-pipeline-cache-plugin/releases/download/0.2.0/jenkins-pipeline-cache-0.2.0.hpi
    - job-dsl:3654.vdf58f53e2d15
    - kubernetes-credentials-provider:1.303.vdfcf47fb_b_fef
    - lockable-resources:1469.v52dff5a_80e32
    - pipeline-graph-view:836.v68ef091500dd
    - pipeline-utility-steps:3.810.va_7672d206740
    - prometheus:852.v317db_5d17a_b_0
    - role-strategy:840.v206ff7f7312e
    - ssh-agent:396.vcc7d84e622ec

  initializeOnce: false

  # for plugin build-failure-analyzer
  #   Exporting to prometheus
  #   Ref: https://github.com/jenkinsci/build-failure-analyzer-plugin/blob/master/docs/metrics.md
  prometheus:
    metricRelabelings:
      # add label: category
      - sourceLabels: [__name__]
        regex: jenkins_bfa_category_(.*)
        targetLabel: category
      - sourceLabels: [__name__]
        regex: jenkins_bfa_job_category:_:.*:_:(.*)
        targetLabel: category

      # add label: cause
      - sourceLabels: [__name__]
        regex: jenkins_bfa_cause_(.*)
        targetLabel: cause
      - sourceLabels: [__name__]
        regex: jenkins_bfa_job_cause:_:.*:_:(.*)
        targetLabel: cause

      # add label: jobname
      - sourceLabels: [__name__]
        regex: jenkins_bfa_job_category:_:(.*):_:.*
        targetLabel: jobname
      - sourceLabels: [__name__]
        regex: jenkins_bfa_job_cause:_:(.*):_:.*
        targetLabel: jobname

      # aggerate to uniq metric: jenkins_bfa
      - sourceLabels: [__name__]
        regex: jenkins_bfa_(.*)_(.*)
        replacement: jenkins_bfa
        targetLabel: __name__
