#yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/refs/heads/main/config/crds/crds/policies.kyverno.io_namespacedmutatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: set-pod-compute-class
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  failurePolicy: Ignore
  # Jenkins agent pods default to the spot CI worker class. Hotfix release
  # branches, one special job and retried pods move to on-demand capacity, and
  # every pod is pinned as not safe to evict.
  #
  # The kyverno.io/v1 Policy expressed this as four ordered rules where a later
  # rule overrode the compute class picked by an earlier one. CEL derives the
  # value in a single expression, so the outcome no longer depends on rule
  # ordering (which admission webhooks do not guarantee across policies).
  #
  # The namespace comes from the per-component overlay
  # (`apps/gcp/jenkins/beta/post/<component>/kustomization.yaml`), same as
  # before, so it is intentionally not set here.
  # kyverno/kyverno#16141 (regression, fixed in Kyverno 1.19): a mutating policy
  # without any matchConditions is folded into the shared
  # `mpol.validate.kyverno.svc-fail` webhook together with policies of the other
  # scope, the generated webhook names collide, and the controller can never
  # apply the webhook configuration again - mutations then silently stop.
  # Keep one trivially-true condition until this cluster runs Kyverno >= 1.19.
  matchConditions:
    - name: always-true
      expression: "true"
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: kubernetes.jenkins.io/controller
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: refs
      expression: |
        has(object.metadata.annotations) && 'ci_refs' in object.metadata.annotations && object.metadata.annotations['ci_refs'] != ''
          ? json.unmarshal(object.metadata.annotations['ci_refs'])
          : {}
    - name: isHotfixBranch
      expression: |
        string(variables.refs.?base_ref.orValue('')).matches('^release-[0-9]+\\.[0-9]+-[0-9]{8}-v[0-9]+\\.[0-9]+\\.[0-9]+$')
    - name: isSpecialJob
      expression: |
        string(object.metadata.?annotations.orValue({})[?'ci_job'].orValue('')).matches('^pingcap/tidb/pull_unit_test')
    - name: isRetried
      expression: |
        object.metadata.?labels[?'kubernetes.jenkins.io/retry'].orValue('') == 'true'
    - name: computeClass
      expression: |
        (variables.isHotfixBranch || variables.isSpecialJob || variables.isRetried) ? 'ci-worker-ondemand' : 'ci-worker'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          [
            (has(object.metadata.annotations) ?
              JSONPatch{op: "add", path: "/metadata/annotations/cluster-autoscaler.kubernetes.io~1safe-to-evict", value: "false"} :
              JSONPatch{op: "add", path: "/metadata/annotations", value: {"cluster-autoscaler.kubernetes.io/safe-to-evict": "false"}}),
            (has(object.spec.nodeSelector) ?
              JSONPatch{op: "add", path: "/spec/nodeSelector/cloud.google.com~1compute-class", value: variables.computeClass} :
              JSONPatch{op: "add", path: "/spec/nodeSelector", value: {"cloud.google.com/compute-class": variables.computeClass}})
          ]
