apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: set-pod-compute-class
policies:
  - ../../set-pod-compute-class.yaml
resources:
  - resource-no-ci-refs.yaml
  - resource-empty-ci-refs.yaml
  - resource-non-release.yaml
  - resource-release.yaml
  - resource-retry.yaml
  - resource-special-job.yaml
results:
  - policy: set-pod-compute-class
    resources:
      - pod-no-ci-refs
    kind: Pod
    result: pass
    patchedResources: patched-default.yaml

  - policy: set-pod-compute-class
    resources:
      - pod-empty-ci-refs
    kind: Pod
    result: pass
    patchedResources: patched-default-empty-ci-refs.yaml

  - policy: set-pod-compute-class
    resources:
      - pod-non-release
    kind: Pod
    result: pass
    patchedResources: patched-default-non-release.yaml

  - policy: set-pod-compute-class
    resources:
      - pod-release
    kind: Pod
    result: pass
    patchedResources: patched-release.yaml

  - policy: set-pod-compute-class
    resources:
      - pod-retry
    kind: Pod
    result: pass
    patchedResources: patched-retry.yaml

  - policy: set-pod-compute-class
    resources:
      - pod-special-job
    kind: Pod
    result: pass
    patchedResources: patched-special-job.yaml
