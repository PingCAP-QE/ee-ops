apiVersion: v1
kind: Pod
metadata:
  annotations:
    ci_refs: ""
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  labels:
    kubernetes.jenkins.io/controller: ""
  name: pod-empty-ci-refs
  namespace: jenkins-pd
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 3600
    image: busybox:1.36
    name: main
  nodeSelector:
    cloud.google.com/compute-class: ci-worker
