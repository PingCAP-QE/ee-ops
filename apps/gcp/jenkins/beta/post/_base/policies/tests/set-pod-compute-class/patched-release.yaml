apiVersion: v1
kind: Pod
metadata:
  annotations:
    ci_refs: '{"org":"pingcap","repo":"tidb","base_ref":"release-8.5-20260301-v8.5.6"}'
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  labels:
    kubernetes.jenkins.io/controller: ""
  name: pod-release
  namespace: jenkins-pd
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 3600
