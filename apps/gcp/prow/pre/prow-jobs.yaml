---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-jobs
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: ci
    namespace: flux-system
  path: prow-jobs
  prune: true
  # The job-config ConfigMap is consumed by the prow components, so it lives in
  # their namespace. The manifests carry no namespace of their own.
  targetNamespace: prow
