# RBAC for `.ci/verify-prow-jobs-run.sh` in PingCAP-QE/ci: the presubmit
# `pull-verify-prow-jobs-run` actually creates a ProwJob (prowjobs.prow.k8s.io)
# on the prow cluster to validate that changed kubernetes-agent prow jobs start
# (image pulls + command boots), then deletes it.
#
# The presubmit runs with the dedicated ServiceAccount `prow-job-validation`
# (set via spec.serviceAccountName), so we grant only that SA the needed
# cluster-scoped permissions (least privilege).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prow-job-validation
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prow-job-validation
rules:
  # create/watch/delete the validation ProwJob
  - apiGroups: ["prow.k8s.io"]
    resources: ["prowjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # observe the pod plank spawns for the ProwJob
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prow-job-validation
subjects:
  - kind: ServiceAccount
    name: prow-job-validation
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prow-job-validation
