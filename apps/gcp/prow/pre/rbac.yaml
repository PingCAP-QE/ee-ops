# RBAC for `.ci/verify-prow-jobs-run.sh` in PingCAP-QE/ci: the presubmit
# `pull-verify-prow-jobs-run` actually creates a ProwJob (prowjobs.prow.k8s.io)
# on the prow cluster to validate that changed kubernetes-agent prow jobs start
# (image pulls + command boots), then deletes it. Its pod runs with the default
# ServiceAccount of the prow job namespace, so we bind the ClusterRole to it.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prow-job-validation
rules:
  # create/watch/delete the validation ProwJob
  - apiGroups: ["prow.k8s.io"]
    resources: ["prowjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # observe the pod plank spawns for the ProwJob
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prow-job-validation
subjects:
  - kind: ServiceAccount
    name: default
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prow-job-validation
