---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prow-openai-config
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: prow-openai-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        # JSON object with the two config files the chatgpt plugin mounts:
        # `config.yaml` and `config4.yaml`. Rotation is a new Secret Manager
        # version; the plugin re-reads the file on restart.
        key: gcp_prow_openai_json
