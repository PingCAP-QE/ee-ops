---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-configs
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: ti-community-infra-configs
    namespace: flux-system
  path: prow
  prune: true
  targetNamespace: prow
  postBuild:
    substitute:
      # ProwJob CRs live in the control-plane namespace, next to the components
      # that own them. The test pods keep their own namespace (TEST_PODS_NAMESPACE).
      PROWJOB_NAMESPACE: prow
      TEST_PODS_NAMESPACE: prow-test-pods
      BUCKET_NAME: prow-tidb-logs
      DOMAIN_NAME: prow.tidb.net
