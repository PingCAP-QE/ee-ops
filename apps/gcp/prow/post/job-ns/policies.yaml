apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: set-ci-worker-pod-defaults
  # The test pods namespace. The owning Kustomization sets the effective namespace
  # (`namespace: ${TEST_PODS_NAMESPACE}`, substituted by Flux) and overrides this
  # value; it is kept here so `kyverno test` evaluates the rules instead of
  # excluding every resource (a Policy without a namespace matches nothing).
  namespace: prow-test-pods
spec:
  rules:
    # Arm64 workloads go through their own compute class: on-demand Arm64 capacity is
    # scarce in us-central1, so that class tries spot Arm64 first. This rule must be
    # evaluated before the generic rule below, and matches whenever the pod pins
    # kubernetes.io/arch to arm64 (node affinity or node selector).
    - name: set-ci-worker-arm64-compute-class
      match:
        resources:
          kinds:
            - Pod
      preconditions:
        any:
          - key: >-
              {{ request.object.spec.nodeSelector."kubernetes.io/arch" || '' }}
            operator: Equals
            value: arm64
          - key: >-
              {{ request.object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[?key=='kubernetes.io/arch'][].values[] || `[]` }}
            operator: AnyIn
            value:
              - arm64
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker-arm64

    - name: set-ci-worker-compute-class
      match:
        resources:
          kinds:
            - Pod
      preconditions:
        all:
          - key: >-
              {{ request.object.spec.nodeSelector."kubernetes.io/arch" || '' }}
            operator: NotEquals
            value: arm64
          - key: >-
              {{ request.object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[?key=='kubernetes.io/arch'][].values[] || `[]` }}
            operator: AllNotIn
            value:
              - arm64
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker-ondemand

---
# FLA-326. The two secret rules are split by blast radius so the org-admin tier
# can be enforced before the presubmits that still need the project tier are
# migrated; each rule carries its own `failureAction`. All three are Audit here.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-prow-job-pod-credentials
  # The owning Kustomization sets `${TEST_PODS_NAMESPACE}`; `kyverno test` needs
  # a value written here or the rules would match nothing.
  namespace: prow-test-pods
spec:
  # Rule-level `failureAction` wins; this is the default for any rule without one.
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not run as a privileged
          ServiceAccount: this namespace binds Workload-Identity and
          cluster-scoped RBAC to these identities.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: AnyIn
                value:
                  - prow-job-validation
                  - terraform-plan-reader
                  - tidbx-puller
                  - gar-reader

    - name: deny-org-admin-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference org-wide credentials
          (github-token, github-ssh-secret); read a short-lived token from
          github-token-broker instead.
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - github-token
                  - github-ssh-secret

    - name: deny-project-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference project-scoped Secrets
          (ci-job-params-mono, ci-smtp, tencentcloud-terraform-creds,
          codecov-tokens, docs-cn).
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - ci-job-params-mono
                  - ci-smtp
                  - tencentcloud-terraform-creds
                  - codecov-tokens
                  - docs-cn
