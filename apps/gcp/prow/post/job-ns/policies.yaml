apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: set-ci-worker-pod-defaults
  # The test pods namespace. The owning Kustomization sets the effective namespace
  # (`namespace: ${TEST_PODS_NAMESPACE}`, substituted by Flux) and overrides this
  # value; it is kept here so `kyverno test` evaluates the rules instead of
  # excluding every resource (a Policy without a namespace matches nothing).
  namespace: prow-test-pods
spec:
  rules:
    # Arm64 workloads go through their own compute class: on-demand Arm64 capacity is
    # scarce in us-central1, so that class tries spot Arm64 first. This rule must be
    # evaluated before the generic rule below, and matches whenever the pod pins
    # kubernetes.io/arch to arm64 (node affinity or node selector).
    - name: set-ci-worker-arm64-compute-class
      match:
        resources:
          kinds:
            - Pod
      preconditions:
        any:
          - key: >-
              {{ request.object.spec.nodeSelector."kubernetes.io/arch" || '' }}
            operator: Equals
            value: arm64
          - key: >-
              {{ request.object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[?key=='kubernetes.io/arch'][].values[] || `[]` }}
            operator: AnyIn
            value:
              - arm64
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker-arm64

    - name: set-ci-worker-compute-class
      match:
        resources:
          kinds:
            - Pod
      preconditions:
        all:
          - key: >-
              {{ request.object.spec.nodeSelector."kubernetes.io/arch" || '' }}
            operator: NotEquals
            value: arm64
          - key: >-
              {{ request.object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[?key=='kubernetes.io/arch'][].values[] || `[]` }}
            operator: AllNotIn
            value:
              - arm64
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            nodeSelector:
              cloud.google.com/compute-class: ci-worker-ondemand

---
# FLA-326 #6: Prow job Pods share this namespace with org-wide credentials, so a
# PR-authored job config can name a Workload-Identity ServiceAccount or mount a
# bot Secret. This policy only *reports* that exposure
# (`validationFailureAction: Audit`) so the blast radius can be measured before
# anything is enforced; flipping it to Enforce depends on moving these
# credentials out of this namespace (T1, see FLA-326).
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-prow-job-pod-credentials
  # Kept in sync with the namespace above: the owning Kustomization overrides
  # both with `${TEST_PODS_NAMESPACE}`, and `kyverno test` needs the value to
  # evaluate the rules instead of excluding every resource.
  namespace: prow-test-pods
spec:
  validationFailureAction: Audit
  background: true
  rules:
    # Workload-Identity / cluster-RBAC ServiceAccounts. A presubmit that names
    # one of them can mint GCP access tokens or read cluster state.
    - name: deny-privileged-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not run as a privileged
          ServiceAccount; this namespace binds Workload-Identity and
          cluster-scoped RBAC to these identities.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: AnyIn
                value:
                  - tidbx-puller
                  - terraform-plan-reader
                  - gar-reader
                  - prow-job-validation

    # Org-wide credentials: `github-token` is the org bot PAT, `github-ssh-secret`
    # the bot SSH key, and the rest are per-org tokens/params. `gcs-credentials`
    # is deliberately absent: the decorator injects it into every decorated Pod
    # (ti-community-infra/configs `prow/config/config.yaml`), so flagging it here
    # would hit 100% of presubmits and make Enforce unusable; it is a separate
    # T1 item.
    - name: deny-org-wide-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference org-wide Secrets
          (github-token, github-ssh-secret, ci-job-params-mono, ci-smtp,
          tencentcloud-terraform-creds, codecov-tokens, docs-cn).
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - github-token
                  - github-ssh-secret
                  - ci-job-params-mono
                  - ci-smtp
                  - tencentcloud-terraform-creds
                  - codecov-tokens
                  - docs-cn
