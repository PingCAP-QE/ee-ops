apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ssh-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    # Prow's clonerefs loads every file in the mounted secret directory with
    # `ssh-add`, so this secret must contain private keys only.
    name: github-ssh-secret
    creationPolicy: Merge
  data:
    - secretKey: ssh-key
      remoteRef:
        key: github-bot-ssh-rsa-json
        property: ssh-privatekey
