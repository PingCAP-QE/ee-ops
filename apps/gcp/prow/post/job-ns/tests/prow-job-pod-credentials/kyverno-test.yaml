# FLA-326 regression suite for the gcp `prow-test-pods` policy.
#
# The policy is a CEL `NamespacedValidatingPolicy` with three validations, all
# Audit, so a result is reported per Pod:
#   fail = at least one check would deny (the message names which one),
#   pass = evaluated and allowed,
#   skip = out of scope (not a PR-authored presubmit/batch Pod).
# The comment above each case records which validation fires; flipping a
# validation to Enforce does not change these expectations.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-prow-job-pod-credentials
policies:
  - ../../restrict-prow-job-pod-credentials.yaml
resources:
  - resource-presubmit-privileged-sa.yaml
  - resource-presubmit-pod-yaml-reader.yaml
  - resource-batch-org-secret-volume.yaml
  - resource-presubmit-org-secret-env.yaml
  - resource-presubmit-projected-ssh-key.yaml
  - resource-presubmit-decorator-gcs.yaml
  - resource-out-of-scope.yaml
results:

  # 1. PR-authored presubmit that names a Workload-Identity ServiceAccount
  #    -> privileged-service-account check.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-presubmit-privileged-sa
    kind: Pod
    result: fail

  # 2. Batch job that mounts the org bot PAT as a volume -> org-admin secret check.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-batch-org-secret-volume
    kind: Pod
    result: fail

  # 3. Presubmit that reads project-scoped Secrets through env/envFrom
  #    -> project secret check.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-presubmit-org-secret-env
    kind: Pod
    result: fail

  # 4. The bot SSH key arrives through a projected volume source, a different
  #    field than a plain secret volume -> org-admin secret check.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-presubmit-projected-ssh-key
    kind: Pod
    result: fail

  # 5. `gcs-credentials` is injected by the decorator into every Pod, so an
  #    ordinary decorated presubmit must not be reported.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-presubmit-decorator-gcs
    kind: Pod
    result: pass

  # 6. Same exposure, but a periodic Job is not PR-authored, and a hand-made Pod
  #    has no `created-by-prow` label: both out of scope.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-periodic-privileged
      - plain-pod-privileged
    kind: Pod
    result: skip

  # 7. The pod-YAML gate's own ServiceAccount is a registered Workload-Identity
  #    grant, so a PR-authored Pod naming it is reported like any other
  #    privileged identity. Losing this case means the identity left the list.
  - policy: restrict-prow-job-pod-credentials
    resources:
      - prow-presubmit-pod-yaml-reader
    kind: Pod
    result: fail
