# FLA-326 #6 regression suite for `restrict-prow-job-pod-credentials`.
#
# The policy is Audit-only, so every case asserts which rule *would* deny:
# `fail` = the rule matched (reported), `pass` = evaluated and allowed,
# `skip` = out of the rule's scope (not a PR-authored presubmit/batch Pod).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-prow-job-pod-credentials
policies:
  - ../../policies.yaml
resources:
  - resource-presubmit-privileged-sa.yaml
  - resource-batch-org-secret-volume.yaml
  - resource-presubmit-org-secret-env.yaml
  - resource-presubmit-decorator-gcs.yaml
  - resource-out-of-scope.yaml
results:
  # 1. PR-authored presubmit that names a Workload-Identity ServiceAccount.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - prow-presubmit-privileged-sa
    kind: Pod
    result: fail
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - prow-presubmit-privileged-sa
    kind: Pod
    result: pass

  # 2. Batch job that mounts the org bot PAT as a volume.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - prow-batch-org-secret-volume
    kind: Pod
    result: pass
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - prow-batch-org-secret-volume
    kind: Pod
    result: fail

  # 3. Presubmit that reads org-wide Secrets through env/envFrom.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - prow-presubmit-org-secret-env
    kind: Pod
    result: pass
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - prow-presubmit-org-secret-env
    kind: Pod
    result: fail

  # 4. `gcs-credentials` is injected by the decorator into every Pod, so it is
  #    excluded on purpose: a normal decorated presubmit must not be reported.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - prow-presubmit-decorator-gcs
    kind: Pod
    result: pass
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - prow-presubmit-decorator-gcs
    kind: Pod
    result: pass

  # 5a. Same exposure, but a periodic Job is not PR-authored: out of scope.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - prow-periodic-privileged
    kind: Pod
    result: skip
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - prow-periodic-privileged
    kind: Pod
    result: skip

  # 5b. Same exposure on a hand-made Pod (no `created-by-prow` label): out of scope.
  - policy: restrict-prow-job-pod-credentials
    rule: deny-privileged-service-account
    resources:
      - plain-pod-privileged
    kind: Pod
    result: skip
  - policy: restrict-prow-job-pod-credentials
    rule: deny-org-wide-secret-reference
    resources:
      - plain-pod-privileged
    kind: Pod
    result: skip
