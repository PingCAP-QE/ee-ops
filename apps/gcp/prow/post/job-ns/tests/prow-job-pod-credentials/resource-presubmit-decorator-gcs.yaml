# Every decorated Prow Pod gets `gcs-credentials` injected by the decorator
# (`ti-community-infra/configs` `prow/config/config.yaml`). It is excluded from
# the policy on purpose, so this otherwise ordinary presubmit must not be
# reported. Turning Enforce on requires moving that credential out of the
# namespace first (T1).
apiVersion: v1
kind: Pod
metadata:
  name: prow-presubmit-decorator-gcs
  namespace: prow-test-pods
  labels:
    created-by-prow: "true"
    prow.k8s.io/type: presubmit
    prow.k8s.io/job: pull-verify-k8s-pod-yaml
    prow.k8s.io/refs.org: PingCAP-QE
    prow.k8s.io/refs.repo: ci
    prow.k8s.io/refs.pull: "4321"
spec:
  containers:
    - name: test
      image: ghcr.io/pingcap-qe/ci/test:latest
      volumeMounts:
        - name: gcs-credentials
          mountPath: /etc/gcs
          readOnly: true
  volumes:
    - name: gcs-credentials
      secret:
        secretName: gcs-credentials
