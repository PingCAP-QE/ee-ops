apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${TEST_PODS_NAMESPACE}
resources:
  - rbac.yaml
  - secrets
  - policies.yaml
  # Shared with the tencentcloud build cluster: Prow job Pods on both clusters
  # live in a namespace that holds org-wide credentials.
  - ../../../../prow/policies
# The shared policy reports by default. Flip a rule to Enforce here once the
# presubmits that still need it are migrated (see the header of
# apps/prow/policies/restrict-prow-job-pod-credentials.yaml):
#
# patches:
#   - target:
#       kind: Policy
#       name: restrict-prow-job-pod-credentials
#     patch: |-
#       - op: replace
#         path: /spec/rules/1/validate/failureAction
#         value: Enforce
