apiVersion: v1
kind: ServiceAccount
metadata:
  name: tidbx-puller
  annotations:
    iam.gke.io/gcp-service-account: tidbx-gar-reader@pingcap-testing-account.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-plan-reader
  annotations:
    iam.gke.io/gcp-service-account: terraform-plan-reader@pingcap-testing-account.iam.gserviceaccount.com
---
# `pull-verify-k8s-pod-yaml` in PingCAP-QE/ci resolves every image a changed
# Pod template references with `crane`, and images in the private `internal`
# Artifact Registry repository need a Google identity to read.
#
# That presubmit now runs as `pod-yaml-reader`, whose GCP identity reads exactly
# the four repositories those templates use (`internal`, `dockerhub-remote`,
# `hub`, `ghcr-remote`; bound in PingCAP-QE/ee-infra). It replaced the
# `gar-reader` identity here, which also reads every other repository in the
# project because the Azure ACR pull-through cache consumes it with a
# `us-docker.pkg.dev/pingcap-testing-account/*` source rule.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-yaml-reader
  annotations:
    iam.gke.io/gcp-service-account: pod-yaml-reader@pingcap-testing-account.iam.gserviceaccount.com
---
# Kept until the `pull-verify-k8s-pod-yaml` presubmit switches to
# `pod-yaml-reader`; its Workload Identity binding is removed right after that
# switch lands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gar-reader
  annotations:
    iam.gke.io/gcp-service-account: gar-reader@pingcap-testing-account.iam.gserviceaccount.com
---
# `prow-job-validation` is referenced twice by the pod policies in this
# directory: it is on the deny list for privileged ServiceAccounts, and it is
# used by a policy test to prove that PR-authored job pods cannot pick it.
#
# It used to carry a cluster-scoped ClusterRole that let the
# `pull-verify-prow-jobs-run` presubmit create a real ProwJob. That presubmit is
# now validate-only (`.ci/verify-prow-jobs-run.sh` parses and lints the job
# definitions and never applies a PR-supplied pod spec), and nothing else
# selected the ServiceAccount, so the role and its binding are gone and only the
# name remains.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prow-job-validation
