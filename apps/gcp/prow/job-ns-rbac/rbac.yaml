# Transitional RBAC: lets the Prow components (still running in `apps`) read and
# write ProwJob custom resources that are now created in the `prow` namespace.
#
# Prow treats the ProwJob namespace and the components' namespace as separate
# settings, and the Helm chart only renders its Roles into the release
# namespace. Until the release itself moves to `prow`, the components need the
# same per-ServiceAccount rules there. Each Role mirrors the rules its
# `apps` counterpart already has, limited to prowjobs.
#
# Delete this directory together with the Flux Kustomization once the release
# runs in `prow` and the chart owns these objects.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prow-pcm
  namespace: prow
rules:
  - apiGroups: ["prow.k8s.io"]
    resources: ["prowjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # The controller manager takes its leader-election lease in the ProwJob
  # namespace (upstream: LeaderElectionNamespace = cfg().ProwJobNamespace).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["prow-controller-manager-leader-lock"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prow-pcm
  namespace: prow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prow-pcm
subjects:
  - kind: ServiceAccount
    name: prow-pcm
    namespace: apps
---
