#yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/refs/heads/main/config/crds/crds/policies.kyverno.io_namespacedvalidatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: restrict-prow-job-pod-credentials
  # The owning Kustomization sets ${TEST_PODS_NAMESPACE}; `kyverno test` needs
  # a value written here or the rules would match nothing.
  namespace: prow-test-pods
spec:
  evaluation:
    admission:
      enabled: true
    # The kyverno.io/v1 policy used `allowExistingViolations: false`, i.e. it did
    # not report Pods that already existed when the rule was introduced. CEL
    # policies have no equivalent switch, so background scanning is off: this
    # keeps admission-time reporting and avoids a one-off report storm over the
    # whole namespace on rollout.
    background:
      enabled: false
  failurePolicy: Ignore
  # Audit for all three checks. `validationActions` is policy-scoped in CEL, so
  # when the org-admin tier is flipped to Enforce before the project tier, split
  # this policy into two (`...-org-admin` with the SA + org-secret checks and
  # `...-project` with the project-secret check) and set the actions per policy.
  # The regression suite expectations do not change.
  validationActions:
    - Audit
  matchConstraints:
    objectSelector:
      matchLabels:
        created-by-prow: "true"
      matchExpressions:
        - key: prow.k8s.io/type
          operator: In
          values:
            - presubmit
            - batch
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: deniedServiceAccounts
      expression: |
        ['k8s-pod-full']
    - name: orgAdminSecrets
      expression: |
        ['github-token']
    - name: projectSecrets
      expression: |
        ['ci-job-params-mono', 'ci-smtp', 'codecov-tokens', 'docs-cn']
    - name: usesPrivilegedServiceAccount
      expression: |
        object.spec.?serviceAccountName.orValue('') in variables.deniedServiceAccounts
    # CEL has no parameterised helpers, so the "any Secret reference from this
    # Pod" walk is spelled out: plain secret volumes, projected volume sources,
    # and env / envFrom on both containers and initContainers.
    - name: referencesOrgAdminSecret
      expression: |
        object.spec.?volumes.orValue([]).exists(v, has(v.secret) && v.secret.?secretName.orValue('') in variables.orgAdminSecrets)
        || object.spec.?volumes.orValue([]).exists(v, v.?projected.?sources.orValue([]).exists(s, s.?secret.?name.orValue('') in variables.orgAdminSecrets))
        || object.spec.?containers.orValue([]).exists(c, c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue('') in variables.orgAdminSecrets))
        || object.spec.?containers.orValue([]).exists(c, c.?envFrom.orValue([]).exists(e, e.?secretRef.?name.orValue('') in variables.orgAdminSecrets))
        || object.spec.?initContainers.orValue([]).exists(c, c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue('') in variables.orgAdminSecrets))
        || object.spec.?initContainers.orValue([]).exists(c, c.?envFrom.orValue([]).exists(e, e.?secretRef.?name.orValue('') in variables.orgAdminSecrets))
    - name: referencesProjectSecret
      expression: |
        object.spec.?volumes.orValue([]).exists(v, has(v.secret) && v.secret.?secretName.orValue('') in variables.projectSecrets)
        || object.spec.?volumes.orValue([]).exists(v, v.?projected.?sources.orValue([]).exists(s, s.?secret.?name.orValue('') in variables.projectSecrets))
        || object.spec.?containers.orValue([]).exists(c, c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue('') in variables.projectSecrets))
        || object.spec.?containers.orValue([]).exists(c, c.?envFrom.orValue([]).exists(e, e.?secretRef.?name.orValue('') in variables.projectSecrets))
        || object.spec.?initContainers.orValue([]).exists(c, c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue('') in variables.projectSecrets))
        || object.spec.?initContainers.orValue([]).exists(c, c.?envFrom.orValue([]).exists(e, e.?secretRef.?name.orValue('') in variables.projectSecrets))
  validations:
    - expression: |
        !variables.usesPrivilegedServiceAccount
      message: >-
        PR-authored Prow job Pods must not run as the namespace-admin
        ServiceAccount; it can create Pods that mount any Secret here.
    - expression: |
        !variables.referencesOrgAdminSecret
      message: >-
        PR-authored Prow job Pods must not reference the org bot PAT; read a
        short-lived token from github-token-broker instead.
    - expression: |
        !variables.referencesProjectSecret
      message: >-
        PR-authored Prow job Pods must not reference project-scoped Secrets
        (ci-job-params-mono, ci-smtp, codecov-tokens, docs-cn).
        gcs-credentials (decorator) and ci-registry-auth (image pull, added by
        replace-tidbx-registry) are injected into every Prow Pod and are
        therefore absent: naming them would match 100% of Pods.
