# FLA-326 #6, tencentcloud side. Prow job Pods from the gcp control plane land
# here (`cluster: tke-pingcap-cicd`) and run pull-request code, while this
# namespace also holds the org-wide credentials Prow works with.
#
# Deliberately a per-cluster copy rather than one file shared with the gcp
# `prow-test-pods`: the two namespaces hold different identities. Here
# `k8s-pod-full` can create and delete Pods (so it can spawn one that mounts any
# Secret), `tidbx-puller` is a plain ServiceAccount - image pull credentials are
# injected by `replace-tidbx-registry` - and there is no `github-ssh-secret`,
# `terraform-plan-reader` or `gar-reader`.
#
# Reports only: enforce after the credentials leave the namespace, otherwise the
# presubmits that still mount them stop starting.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-prow-job-pod-credentials
  # Same value the overlay injects; `kyverno test` needs it written here or the
  # rules would match nothing.
  namespace: prow-test-pods
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not run as the namespace-admin
          ServiceAccount; it can create Pods that mount any Secret here.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: AnyIn
                value:
                  - k8s-pod-full

    # `gcs-credentials` is absent: the decorator injects it into every decorated
    # Pod. `ci-registry-auth` is absent too: `replace-tidbx-registry` adds it as
    # an imagePullSecret to every Prow Pod. Both would match 100% of Pods and
    # make Enforce unusable; they are separate T1 items (FLA-326).
    - name: deny-org-wide-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference org-wide Secrets
          (github-token, ci-job-params-mono, ci-smtp, codecov-tokens, docs-cn).
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - github-token
                  - ci-job-params-mono
                  - ci-smtp
                  - codecov-tokens
                  - docs-cn
