# FLA-326, tencentcloud side. Prow job Pods from the gcp control plane land
# here (`cluster: tke-pingcap-cicd`) and run pull-request code, while this
# namespace also holds the org-wide credentials Prow works with.
#
# Per-cluster on purpose, not one file shared with the gcp `prow-test-pods`: the
# identities differ. Here `k8s-pod-full` can create and delete Pods,
# `tidbx-puller` is a plain ServiceAccount (pull creds come from
# `replace-tidbx-registry`), and there is no `github-ssh-secret`,
# `terraform-plan-reader` or `gar-reader`.
#
# The secret rules are split by blast radius so the org-admin tier can be
# enforced before the presubmits that still need the project tier are migrated;
# each rule carries its own `failureAction`. All three are Audit here.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-prow-job-pod-credentials
  # Same value the overlay injects; `kyverno test` needs it written here or the
  # rules would match nothing.
  namespace: prow-test-pods
spec:
  # Rule-level `failureAction` wins; this is the default for any rule without one.
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not run as the namespace-admin
          ServiceAccount; it can create Pods that mount any Secret here.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: AnyIn
                value:
                  - k8s-pod-full

    - name: deny-org-admin-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference the org bot PAT; read a
          short-lived token from github-token-broker instead.
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - github-token

    - name: deny-project-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference project-scoped Secrets
          (ci-job-params-mono, ci-smtp, codecov-tokens, docs-cn).
          `gcs-credentials` (decorator) and `ci-registry-auth` (image pull, added
          by `replace-tidbx-registry`) are injected into every Prow Pod and are
          therefore absent: naming them would match 100% of Pods.
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - ci-job-params-mono
                  - ci-smtp
                  - codecov-tokens
                  - docs-cn
