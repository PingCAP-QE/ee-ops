# A PR-authored presubmit that runs as `k8s-pod-full`, the ServiceAccount with
# pod create/delete in this namespace: from there it can start a Pod that mounts
# any Secret here.
apiVersion: v1
kind: Pod
metadata:
  name: prow-presubmit-namespace-admin-sa
  namespace: prow-test-pods
  labels:
    created-by-prow: "true"
    prow.k8s.io/type: presubmit
    prow.k8s.io/job: pull-integration-test
    prow.k8s.io/refs.org: pingcap
    prow.k8s.io/refs.repo: tidb
    prow.k8s.io/refs.pull: "12345"
spec:
  serviceAccountName: k8s-pod-full
  containers:
    - name: test
      image: ghcr.io/pingcap-qe/ci/test:latest
      args:
        - make
        - integration-test
