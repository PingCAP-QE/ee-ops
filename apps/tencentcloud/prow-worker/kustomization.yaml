apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prow-test-pods
resources:
  - namespace.yaml
  - rbac.yaml
  - serviceaccount-tidbx-puller.yaml
  - secrets
  # reuse from jenkins agent namespaced policies
  - ../jenkins/post/_base/policies/set-pod-compute-class.yaml
  # TKE supernode organization-billing attribution for Prow Pods
  - policies/inject-prow-tencent-cost-tags.yaml
  # Use the local zot mirror for private Tidbx GAR images and inject pull auth
  - policies/replace-tidbx-registry.yaml
  # Report PR-authored Pods that name this namespace's credentials
  - policies/restrict-prow-job-pod-credentials.yaml

# `validationActions` is policy-scoped in the CEL policy API, so the old
# per-rule `failureAction` override is gone. To enforce the org-admin tier
# before the project tier, split the policy in two (ServiceAccount + org-admin
# secrets, then project secrets) and put `validationActions: [Audit, Deny]` on
# the one you want to block. The regression-suite expectations stay valid.
