apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prow-test-pods
resources:
  - namespace.yaml
  - rbac.yaml
  - secrets
  # reuse from jenkins agent namespaced policies
  - ../jenkins/post/_base/policies/set-pod-compute-class.yaml
  # TKE supernode organization-billing attribution for Prow Pods
  - policies/inject-prow-tencent-cost-tags.yaml
