---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codecov-token-tidb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: codecov-token-tidb
    creationPolicy: Owner
    template:
      metadata:
        labels:
          jenkins.io/credentials-type: secretText
          jenkins.io/credentials-scope: GLOBAL
  data:
    - secretKey: text
      remoteRef:
        key: tencentcloud_jenkins_codecov_tokens_json
        property: tidb
