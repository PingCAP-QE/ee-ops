apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-artifact-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: jenkins-artifact-s3
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        region: "{{ .region }}"
        bucket: "{{ .bucket }}"
        endpoint-host: "cos.{{ .region }}.myqcloud.com"
  dataFrom:
    - extract:
        key: "${JENKINS_ARTIFACT_S3_JSON}" # json object containing keys: `region`, `bucket`, and `endpoint`
