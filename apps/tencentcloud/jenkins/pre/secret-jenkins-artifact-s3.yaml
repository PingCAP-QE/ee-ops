apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-artifact-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: jenkins-artifact-s3
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        region: "{{ .region }}"
        bucket: "{{ .bucket }}"
        # strip scheme only, keep bucket name for COS virtual-hosted-style domain
        endpoint-host: '{{ trimPrefix "http://" (trimPrefix "https://" .endpoint) }}'
  dataFrom:
    - extract:
        key: "${JENKINS_ARTIFACT_S3_S3_JSON}" # json object
