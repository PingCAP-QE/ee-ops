# please see: https://github.com/jenkinsci/helm-charts/blob/main/charts/jenkins/VALUES.md
controller:
  # Protect the single controller pod from voluntary Karpenter disruption.
  podAnnotations:
    karpenter.sh/do-not-evict: "true"

  # Do not voluntarily evict the only controller replica.
  podDisruptionBudget:
    enabled: true
    apiVersion: policy/v1
    maxUnavailable: "0"

  terminationGracePeriodSeconds: 300

  podLabels:
    env: cicd
    team: eq
    author: wuhuizuo

  containerPort: 8080

  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    # LTS 2.580.2 (2026-10-28) is the current LTS line and is tested against
    # JDK 21 and 25; the core version is unchanged here, this only moves the
    # JVM from 21 to 25 (Java 21 EOS 2027-09, Java 25 EOS 2029-09).
    # The image was also built after Debian DSA-6582-1 and ships
    # libbrotli1 1.1.0-2+deb13u1 (fixes CVE-2026-111497).
    # Digest is the manifest list for tag `2.580.2-jdk25` on Docker Hub
    # (linux/amd64 858a3e9..., linux/arm64 2b3e3b9...). Pinning the digest keeps
    # the runtime reproducible if the tag is ever repushed.
    tag: "2.580.2-jdk25@sha256:415ab90d4e3b25148f7191bc04f455a20817d6c4c3b0a98f6c6b0da4877f7081"
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 16Gi

  # https://docs.cloudbees.com/docs/admin-resources/latest/jvm-troubleshooting/
  # Set min/max heap here if needed with:
  # CVE-2026-114938 (Java4Shell) workaround; drop it with the JDK 25.0.5.1 bump.
  javaOpts: >-
    -XX:+UseContainerSupport -XX:InitialRAMPercentage=20.0
    -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:+AlwaysPreTouch
    -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled
    -XX:+DisableExplicitGC -XX:+UnlockExperimentalVMOptions
    -XX:+UnlockDiagnosticVMOptions -XX:+HeapDumpOnOutOfMemoryError
    -Xlog:gc*=info,gc+heap=debug,gc+ref*=debug,gc+ergo*=trace,gc+age*=trace:file=/var/jenkins_home/logs/gc.log:utctime,pid,level,tags:filecount=2,filesize=100M
    -Dio.jenkins.plugins.artifact_manager_jclouds.s3.S3BlobStoreConfig.deleteArtifacts=true
    -Dio.jenkins.plugins.artifact_manager_jclouds.s3.S3BlobStoreConfig.deleteStashes=true
    -XX:-UseBASE64Intrinsics

  # Optionally specify additional init-containers
  customInitContainers:
    - name: init-create-logs-dir
      image: "alpine:3.23.3"
      imagePullPolicy: Always
      command: ["mkdir", "-p", "/var/jenkins_home/logs"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsUser: 1000
      volumeMounts:
        - mountPath: /var/jenkins_home
          name: jenkins-home
    # The timestamped filename above was used before the fixed gc.log name.
    # Remove only those legacy files while the controller is stopped.
    - name: remove-legacy-gc-logs
      image: "alpine:3.23.3"
      imagePullPolicy: Always
      command:
        - sh
        - -ec
        - |
          find /var/jenkins_home/logs -maxdepth 1 -type f -name 'gc-*.log*' -print -delete
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsUser: 1000
      volumeMounts:
        - mountPath: /var/jenkins_home
          name: jenkins-home

  # jenkinsOpts: ""
  # If you are using the ingress definitions provided by this chart via the `controller.ingress` block the configured hostname will be the ingress hostname starting with `https://` or `http://` depending on the `tls` configuration.
  # The Protocol can be overwritten by specifying `controller.jenkinsUrlProtocol`.
  # jenkinsUrlProtocol: "https"
  # If you are not using the provided ingress you can specify `controller.jenkinsUrl` to change the url definition.
  # jenkinsUrl: ""
  # If you set this prefix and use ingress controller then you might want to set the ingress path below

  ingress:
    enabled: false

  # Expose Prometheus metrics
  prometheus:
    # If enabled, add the prometheus plugin to the list of plugins to install
    # https://plugins.jenkins.io/prometheus
    enabled: false
