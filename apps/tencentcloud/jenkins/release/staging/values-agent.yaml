# please see: https://github.com/jenkinsci/helm-charts/blob/main/charts/jenkins/VALUES_SUMMARY.md
agent:
  maxRequestsPerHostStr: "200" # need to restart controller after updated it.
  containerCap: 200
  # Dynamic `agent { kubernetes { ... } }` pipelines otherwise use the
  # Kubernetes plugin's smaller built-in jnlp defaults (256Mi without a limit).
  # Inherit this chart-managed template so every staging agent gets the
  # resources and JVM settings below unless it explicitly overrides them.
  defaultsProviderTemplate: "default"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 512Mi
  envVars:
    - name: JAVA_OPTS
      value: "-Xms128m -Xmx224m -XX:MaxDirectMemorySize=32m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djenkins.agent.protocol=false"
  garbageCollection:
    enabled: true
    timeout: 300
    namespaces: |-
      jenkins-pd
      jenkins-tiflow
      jenkins-tidb
      jenkins-tiflash
      jenkins-tikv
