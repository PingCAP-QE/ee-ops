apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: controller-staging
  namespace: jenkins
spec:
  parentRefs:
    - kind: Gateway
      name: external-https
      namespace: infra
  hostnames:
    - "${INGRESS_HOST}"
  rules:
    - backendRefs:
        - name: jenkins-staging
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: "${INGRESS_PATH}-staging"
      # Do not strip Jenkins' browser protections here. Removing
      # X-Frame-Options / COOP / CSP turned any stored XSS in build output into
      # a script running with the operator's session, and made framing possible.
      # The controller sets these headers itself; the gateway must pass them through.
