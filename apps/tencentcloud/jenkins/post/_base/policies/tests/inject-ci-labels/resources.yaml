apiVersion: v1
kind: Pod
metadata:
  name: bot-author
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
    keep: unchanged
  annotations:
    ci_refs: '{"org":"tidbcloud","repo":"cloud-storage-engine","base_ref":"release-nextgen-202609","pulls":[{"author":"ti-chi-bot[bot]"}]}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: label-length-boundary
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    # The underscore is character 63 in each field.
    ci_refs: '{"org":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_tail","repo":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_tail","base_ref":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_tail","pulls":[{"author":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa_tail"}]}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: leading-trailing-punctuation
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    ci_refs: '{"org":"-_PingCAP_-","repo":"-_TiDB_-","base_ref":"-_feature/foo_-","pulls":[{"author":"-_Some-User_-"}]}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: punctuation-only
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    ci_refs: '{"org":"[]/-_","repo":"[]/-_","base_ref":"[]/-_","pulls":[{"author":"[]/-_"}]}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: trigger-user-fallback
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    ci_refs: '{"org":"PingCAP","repo":"TiDB","base_ref":"master","pulls":[]}'
    ci_trigger_user: Dillon Zheng@example.com
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-refs
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    ci_refs: '{}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: no-controller
  namespace: jenkins-tidb
  annotations:
    ci_refs: '{"org":"tidbcloud","repo":"cloud-storage-engine","pulls":[{"author":"ti-chi-bot[bot]"}]}'
spec:
  containers:
    - name: agent
      image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: no-ci-refs
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
spec:
  containers:
    - name: agent
      image: busybox:1.36
