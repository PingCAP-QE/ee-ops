apiVersion: v1
kind: Pod
metadata:
  name: pod-tidb-privileged
  namespace: jenkins-tidb
  labels:
    kubernetes.jenkins.io/controller: ""
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    ci_refs: '{"org":"pingcap","repo":"tidb","base_ref":"master"}'
spec:
  nodeSelector:
    compute-class: ci-worker
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
