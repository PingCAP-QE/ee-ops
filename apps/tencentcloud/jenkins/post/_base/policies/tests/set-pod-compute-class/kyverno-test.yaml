apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: set-pod-compute-class
policies:
  - ../../set-pod-compute-class.yaml
resources:
  - resource-no-ci-refs.yaml
  - resource-empty-ci-refs.yaml
  - resource-non-release.yaml
  - resource-release.yaml
  - resource-non-tidb.yaml
  - resource-tidb-hostpath.yaml
  - resource-tidb-privileged.yaml
  - resource-tidb-super-node.yaml
results:
  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-no-ci-refs
    kind: Pod
    result: pass

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-empty-ci-refs
    kind: Pod
    result: pass

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-non-tidb
    kind: Pod
    result: pass
    patchedResources: patched-ci-worker.yaml

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-tidb-hostpath
    kind: Pod
    result: pass
    patchedResources: patched-ci-worker-hostpath.yaml

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-tidb-privileged
    kind: Pod
    result: pass
    patchedResources: patched-ci-worker-privileged.yaml

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-tidb-super-node
    kind: Pod
    result: pass
    patchedResources: patched-super-node.yaml

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-non-release
    kind: Pod
    result: pass

  - policy: set-pod-compute-class
    rule: set-pod-compute-class
    resources:
      - pod-release
    kind: Pod
    result: pass
