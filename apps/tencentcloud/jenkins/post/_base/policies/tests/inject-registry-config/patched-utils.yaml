apiVersion: v1
kind: Pod
metadata:
  labels:
    kubernetes.jenkins.io/controller: ""
  name: pod-utils
  namespace: jenkins-tidb
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 3600
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/registry
    image: busybox:1.36
    name: utils
    volumeMounts:
    - mountPath: /var/run/ci/registry
      name: ci-registry-auth
      readOnly: true
  - image: busybox:1.36
    name: jnlp
  volumes:
  - name: ci-registry-auth
    secret:
      defaultMode: 292
      items:
      - key: .dockerconfigjson
        path: config.json
      secretName: ci-registry-auth

---
