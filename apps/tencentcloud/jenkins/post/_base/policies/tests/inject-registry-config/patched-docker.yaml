apiVersion: v1
kind: Pod
metadata:
  labels:
    kubernetes.jenkins.io/controller: ""
  name: pod-docker
  namespace: jenkins-tiflash
spec:
  containers:
  - image: docker:24.0.9-dind
    name: dockerd
  - env:
    - name: DOCKER_HOST
      value: tcp://localhost:2375
    - name: DOCKER_CONFIG
      value: /var/run/ci/registry
    image: ghcr.io/pingcap-qe/ci/base:v2026
    name: docker
    volumeMounts:
    - mountPath: /var/run/ci/registry
      name: ci-registry-auth
      readOnly: true
  - image: busybox:1.36
    name: jnlp
  volumes:
  - name: ci-registry-auth
    secret:
      defaultMode: 292
      items:
      - key: .dockerconfigjson
        path: config.json
      secretName: ci-registry-auth

---
