#yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/refs/heads/main/config/crds/crds/policies.kyverno.io_namespacedmutatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: inject-image-pull-secrets
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  matchConditions:
    - name: is-pod
      expression: object.kind == 'Pod'
    - name: has-target-image
      expression: >-
        object.spec.containers.exists(c,
          c.image.startsWith('cr-qcloud.pingcap.net/') ||
          c.image.startsWith('cr.pingcap.net/')) ||
        object.spec.?initContainers.orValue([]).exists(c,
          c.image.startsWith('cr-qcloud.pingcap.net/') ||
          c.image.startsWith('cr.pingcap.net/'))
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: kubernetes.jenkins.io/controller
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: hasSecret
      expression: >-
        object.spec.?imagePullSecrets.orValue([]).exists(s, s.?name.orValue('') == 'ci-registry-auth')
    - name: hasSecrets
      expression: object.spec.?imagePullSecrets.orValue([]).size() > 0
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          variables.hasSecrets && !variables.hasSecret ?
          [JSONPatch{op: "add", path: "/spec/imagePullSecrets/0", value: {"name": "ci-registry-auth"}}] :
          []
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          !variables.hasSecrets && !variables.hasSecret ?
          [JSONPatch{op: "add", path: "/spec/imagePullSecrets", value: [{"name": "ci-registry-auth"}]}] :
          []
