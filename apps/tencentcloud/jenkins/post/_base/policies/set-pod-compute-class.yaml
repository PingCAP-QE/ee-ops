#yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/kyverno/refs/heads/main/config/crds/crds/policies.kyverno.io_namespacedmutatingpolicies.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: set-pod-compute-class
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  matchConditions:
    - name: is-pod
      expression: object.kind == 'Pod'
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: kubernetes.jenkins.io/controller
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    # ci_refs annotation is set by the Jenkins Kubernetes plugin, same source
    # consumed by inject-ci-labels.
    - name: refs
      expression: >-
        has(object.metadata.annotations) &&
        'ci_refs' in object.metadata.annotations &&
        object.metadata.annotations['ci_refs'] != '' ?
        json.unmarshal(object.metadata.annotations['ci_refs']) : {}
    - name: fromPingcapTiDB
      expression: >-
        string(variables.refs.?org.orValue('')) == 'pingcap' &&
        string(variables.refs.?repo.orValue('')) == 'tidb'
    # TKE super nodes (serverless) reject privileged containers, hostPath
    # volumes, hostNetwork and hostPID/hostIPC; such pods stay on ci-worker.
    - name: serverlessSafe
      expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.?securityContext.?privileged.orValue(false) == false)) &&
        (!has(object.spec.containers) || object.spec.containers.all(c, c.?securityContext.?privileged.orValue(false) == false))
    - name: useSuperNode
      expression: variables.fromPingcapTiDB && variables.serverlessSafe
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          [
            has(object.metadata.annotations) ?
            JSONPatch{
              op: "add",
              path: "/metadata/annotations/cluster-autoscaler.kubernetes.io~1safe-to-evict",
              value: "false"
            } :
            JSONPatch{
              op: "add",
              path: "/metadata/annotations",
              value: {"cluster-autoscaler.kubernetes.io/safe-to-evict": "false"}
            }
          ] +
          (variables.useSuperNode ?
            [
              has(object.spec.nodeSelector) ?
              JSONPatch{
                op: "add",
                path: "/spec/nodeSelector/node.kubernetes.io~1instance-type",
                value: "eklet"
              } :
              JSONPatch{
                op: "add",
                path: "/spec/nodeSelector",
                value: {"node.kubernetes.io/instance-type": "eklet"}
              }
            ] :
            []) +
          (!variables.useSuperNode ?
            [
              has(object.spec.nodeSelector) ?
              JSONPatch{
                op: "add",
                path: "/spec/nodeSelector/compute-class",
                value: "ci-worker"
              } :
              JSONPatch{
                op: "add",
                path: "/spec/nodeSelector",
                value: {"compute-class": "ci-worker"}
              }
            ] :
            [])
