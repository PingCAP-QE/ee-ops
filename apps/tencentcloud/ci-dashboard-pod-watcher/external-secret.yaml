apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-dashboard-pod-watcher-db
  namespace: ee-cd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: ci-dashboard-pod-watcher-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        TIDB_HOST: "{{ .TIDB_HOST }}"
        TIDB_PORT: "{{ .TIDB_PORT }}"
        TIDB_USER: "{{ .TIDB_USER }}"
        TIDB_PASSWORD: "{{ .TIDB_PASSWORD }}"
        TIDB_DB: "{{ .TIDB_DB }}"
        TIDB_SSL_CA: /etc/ssl/certs/ca-certificates.crt
  dataFrom:
    - extract:
        # Seeded securely from the existing GCP Dashboard DB Secret; no values in Git.
        # Required fields: TIDB_HOST, TIDB_PORT, TIDB_USER, TIDB_PASSWORD, TIDB_DB.
        key: tencentcloud_ci_dashboard_db_json
