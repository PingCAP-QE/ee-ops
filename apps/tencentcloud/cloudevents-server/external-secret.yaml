apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudevents-server-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: cloudevents-server-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        config.yaml: |
          test_case_run:
            store:
              driver: mysql
              dsn: "{{ .test_case_run_dsn }}?tls=true&parseTime=true&loc=Asia%2FShanghai"
          # No `tekton:` section: Tekton is retired in this cluster
          # (docs/TEKTON_MIGRATION.md), so no Tekton run events reach Kafka and
          # there is no dashboard to build log links against. This instance
          # keeps handling the Jenkins/`cdevents` test-case-run events.
          kafka:
            brokers:
              - cluster-cd-kafka-bootstrap.kafka.svc:9094
            client_id: cloudevents-server
            authentication:
              mechanism: SCRAM-SHA-512
              user: cloudevents-server
              password: {{ .KAFKA_PASSWORD }}
              ca_file: /etc/kafka/ca.crt
            # authentication:
            #   mechanism: SCRAM-SHA-256
            #   user: username
            #   password: password
            producer:
              topic_mapping:
                dev.cdevents.pipelinerun.finished.0.1.0: jenkins-event
              default_topic: cloudevents-default-channel
            consumer:
              group_id: cloudevents-server-workers
              topic_mapping:
                "*": cloudevents-default-channel
              dead_letter_topic: cloudevents-dead-letter

  data:
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: tencentcloud_cloudevents_kafka_password
    - secretKey: test_case_run_dsn
      remoteRef:
        key: tencentcloud_test_case_run_dsn
