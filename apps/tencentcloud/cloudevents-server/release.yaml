apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudevents-server
spec:
  chart:
    spec:
      chart: cloudevents-server
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The chart's test-connection pod cannot reach the bus now that only the
  # authenticated listener exists; a failing test triggers `upgrade.remediation`
  # and rolls the release back, which is how the 9094 rollout reverted itself.
  # Liveness is covered by the consumer actually reading its partition.
  test:
    enable: false
    ignoreFailures: true
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/cloudevents-server
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/cloudevents-server versioning=semver
      tag: v2026.11.8-26-g8b4208f # if you want to downgrade, please change the config secret as well.
    server:
      args: [--config=/config/config.yaml]
      volumeMounts:
        - name: config
          mountPath: /config
        - name: kafka-ca
          mountPath: /etc/kafka/ca.crt
          subPath: ca.crt
          readOnly: true
      volumes:
        - name: config
          secret:
            secretName: cloudevents-server-config
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-ca
            items:
              - key: ca.crt
                path: ca.crt
