# Restrict who may deliver events to the tibuild EventListener on this cluster.
#
# tibuild-v2 sends unsigned CloudEvents to http://el-tibuild.ee-cd.svc:8080, so
# without a network restriction any pod in the cluster could forge one and drive
# a build with CI credentials. NetworkPolicy is default-allow; selecting the
# pod switches it to deny-by-default, so only namespace `tibuild` may reach it.
#
# Only `tibuild` is restricted here: the `github` listener on this cluster has no
# in-cluster sender identified yet (Prow runs on the GCP cluster), so it is left
# at default-allow until that is understood.
#
# Rollback: delete this NetworkPolicy; traffic returns to default-allow.
#
# VALIDATION REQUIRED BEFORE MERGE: confirm kubelet readiness probes still pass
# under this cluster's CNI, and that a devbuild still triggers, before relying
# on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: el-tibuild-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: EventListener
      eventlistener: tibuild
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tibuild
      ports:
        - protocol: TCP
          port: 8080
