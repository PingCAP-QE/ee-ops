---
# Every triggerGroup below starts with a `github` interceptor that verifies an
# HMAC-SHA256 signature over the raw CloudEvent body before any trigger is
# resolved. tibuild-v2 therefore has to send, on every devbuild/hotfix
# CloudEvent:
#
#   X-Hub-Signature-256: sha256=<hex(HMAC-SHA256(request_body, secret))>
#
# signed with the `el-tibuild-webhook` Secret (Secret Manager key
# `gcp_tibuild_cloudevent_hmac` in project `pingcap-testing-account`; the
# ExternalSecret in tibuild-webhook-secret.yaml materialises it here).
#
# `eventTypes` is deliberately NOT set on the interceptor: tibuild sends
# CloudEvents, not GitHub webhooks, so there is no X-GitHub-Event header to
# match. With eventTypes unset the github interceptor only verifies the
# signature (checked against tektoncd/triggers
# pkg/interceptors/github/github.go, v0.29.0 .. main: with a secretRef it
# requires X-Hub-Signature-256 — v0.29-v0.31 still accept the legacy sha1
# X-Hub-Signature fallback, current main accepts sha256 only — and runs
# gh.ValidateSignature(sig, raw body, secret), so the header must be
# `sha256=<hex digest>`).
#
# DEPLOY ORDER: tibuild-v2 must already be signing before this reaches the
# clusters (merge the ee-apps signing change first). This change rejects
# unsigned events, so shipping it first would silently drop every
# devbuild/hotfix (the listener still answers 202; no PipelineRun is created).
# Rollback: delete the `verify tibuild CloudEvent signature` interceptors.
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: tibuild
spec:
  serviceAccountName: tekton-trigger-eventlistener
  triggerGroups:
    - name: tibuild-fake-github-pr
      interceptors:
        - name: verify tibuild CloudEvent signature
          ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: el-tibuild-webhook
                secretKey: secret
        - name: filter on eventType and refs and extract cloud event context
          ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.canonical('ce-type') in ['net.pingcap.tibuild.devbuild.pull_request', 'net.pingcap.tibuild.hotfix.pull_request']
                &&
                body.action in ['opened', 'synchronize', 'reopened']
            - name: overlays
              value:
                - key: ce-context
                  expression: |
                    {
                      "type": header.canonical('ce-type'),
                      "source": header.canonical('ce-source'),
                      "subject": header.canonical('ce-subject'),
                      "user": header.canonical('ce-user'),
                    }.marshalJSON()
      triggerSelector:
        namespaceSelector:
          matchNames:
            - ee-cd
        labelSelector:
          matchLabels:
            type: fake-github-pr
    - name: tibuild-fake-github-branch-push
      interceptors:
        - name: verify tibuild CloudEvent signature
          ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: el-tibuild-webhook
                secretKey: secret
        - name: filter on event type and extract cloud event context
          ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.canonical('ce-type') in ['net.pingcap.tibuild.devbuild.push', 'net.pingcap.tibuild.hotfix.push']
            - name: overlays
              value:
                - key: short-ref
                  # "refs/heads/main" => "main"
                  expression: body.ref.replace('refs/heads/', '')
                - key: ce-context
                  expression: |
                    {
                      "type": header.canonical('ce-type'),
                      "source": header.canonical('ce-source'),
                      "subject": header.canonical('ce-subject'),
                      "user": header.canonical('ce-user'),
                    }.marshalJSON()
      triggerSelector:
        namespaceSelector:
          matchNames:
            - ee-cd
        labelSelector:
          matchLabels:
            type: fake-github-branch-push
    - name: tibuild-fake-github-tag-create
      interceptors:
        - name: verify tibuild CloudEvent signature
          ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: el-tibuild-webhook
                secretKey: secret
        - name: filter on eventType and refs and extract cloud event context
          ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.canonical('ce-type') in ['net.pingcap.tibuild.devbuild.create', 'net.pingcap.tibuild.hotfix.create']
                &&
                body.ref_type == 'tag'
            - name: overlays
              value:
                - key: ce-context
                  expression: |
                    {
                      "type": header.canonical('ce-type'),
                      "source": header.canonical('ce-source'),
                      "subject": header.canonical('ce-subject'),
                      "user": header.canonical('ce-user'),
                    }.marshalJSON()
      triggerSelector:
        namespaceSelector:
          matchNames:
            - ee-cd
        labelSelector:
          matchLabels:
            type: fake-github-tag-create
