# Authentication for https://do.pingcap.net/tekton (Tekton Dashboard).
#
# The route is published on the public external-https Gateway, so without a
# policy anyone who can reach the host can browse pipelines, task runs and
# their logs. OIDC moves the route behind the same Google login as the other
# EE routes; the client is an "Internal" Web application, so only PingCAP
# Workspace accounts can complete the flow.
#
# The OAuth client must allow https://do.pingcap.net/tekton/oauth2/callback as
# an authorized redirect URI. The redirect URL must stay under the route's path
# prefix (/tekton), otherwise the callback never matches this route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tekton-dashboard-oidc
  namespace: tekton-pipelines
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tekton
  csrf: {}
  oidc:
    provider:
      issuer: https://accounts.google.com
    clientIDRef:
      name: tekton-dashboard-oidc
    clientSecret:
      name: tekton-dashboard-oidc
    redirectURL: https://do.pingcap.net/tekton/oauth2/callback
    logoutPath: /tekton/logout
    scopes:
      - openid
      - email
      - profile
