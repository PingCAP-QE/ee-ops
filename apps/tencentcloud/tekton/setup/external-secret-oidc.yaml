# Google OAuth Web client credentials for the Tekton Dashboard route.
#
# The client is the shared EE "Internal" Web application stored in the GCP
# Secret Manager secret google-oauth2-client-ee-apps, so only PingCAP Workspace
# accounts can complete the authorization. That client must additionally allow
# https://do.pingcap.net/tekton/oauth2/callback as an authorized redirect URI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-dashboard-oidc
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: tekton-dashboard-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: google-oauth2-client-ee-apps
