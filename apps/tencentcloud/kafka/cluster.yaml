apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller-cd
  labels:
    strimzi.io/cluster: cluster-cd
spec:
  replicas: 3
  roles:
    - controller
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: cbs
        size: 10Gi
        kraftMetadata: shared
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker-cd
  labels:
    strimzi.io/cluster: cluster-cd
spec:
  replicas: 3
  roles:
    - broker
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: cbs
        size: 10Gi
        kraftMetadata: shared
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cluster-cd
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      # Listener for the SASL/SCRAM migration. It is additive: the existing
      # listeners keep working until every client has moved and
      # `spec.kafka.authorization` is enabled in a later step.
      - name: scram
        port: 9094
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      # SASL without TLS, for clients that cannot be given the cluster CA
      # (cloudevents-server builds its tls.Config from the system roots). SCRAM
      # never sends the password, and the payload is no more exposed than the
      # plain listener it replaces.
      - name: scram-plain
        port: 9095
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
