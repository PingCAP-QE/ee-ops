# SASL/SCRAM identity (authentication only for now) for cloudevents-server: it produces every event and
# consumes the default channel plus the dead-letter topic.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: cloudevents-server
  labels:
    strimzi.io/cluster: cluster-cd
spec:
  authentication:
    type: scram-sha-512
    # Password is seeded in Secret Manager so the same value can be rendered into
    # cloudevents-server's config; Strimzi reads it instead of generating one.
    password:
      valueFrom:
        secretKeyRef:
          name: cloudevents-kafka-cred
          key: password
