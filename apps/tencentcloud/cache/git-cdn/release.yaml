apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: git-cdn
spec:
  releaseName: git-cdn
  chart:
    spec:
      chart: git-cdn
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: ee-ops
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
    ignoreFailures: false
  values:
    image:
      # The zot on-demand mirror of registry.gitlab.com fails because the TKE
      # egress to cdn.registry.gitlab-static.net times out, so the image is
      # copied to cr.pingcap.net instead (same zot, internal route).
      repository: cr.pingcap.net/personal/wuhui.zuo/git_cdn
      tag: 1.13.0-oss
    imagePullSecrets:
      - name: ci-registry-auth
    kind: StatefulSet
    replicaCount: 2
    podManagementPolicy: Parallel
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "1"
        memory: 5Gi
      limits:
        cpu: "2"
        memory: 5Gi
    nodeSelector:
      kubernetes.io/arch: amd64
      compute-class: ee-application
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: git-cdn
                app.kubernetes.io/instance: git-cdn
            topologyKey: kubernetes.io/hostname
    service:
      type: ClusterIP
    ingress:
      enabled: false
    volumeMounts:
      - name: data
        mountPath: /data

    # volumeClaimTemplates is immutable and only affects newly created PVCs, so Flux
    # cannot apply a `storage` change here. To resize the existing PVCs, run:
    #   SIZE=300Gi
    #   for i in 0 1; do kubectl -n cache patch pvc data-git-cdn-$i --type merge -p "{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"$SIZE\"}}}}"; done
    #   kubectl -n cache delete pod git-cdn-0 git-cdn-1               # only if PVC stays FileSystemResizePending
    #   kubectl -n cache delete statefulset git-cdn --cascade=orphan  # keep pods/PVCs, allow new template
    #   flux reconcile helmrelease git-cdn -n cache --force
    # TODO(ops): alert on `git_cdn_workdir_filesystem_avail_bytes` (exported by
    # git-cdn on /metrics) so a full /data is caught before checkouts break again.
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ci-rwo
          resources:
            requests:
              storage: 300Gi
    configuration:
      GITSERVER_UPSTREAM: https://github.com/
      # Pack-cache limit (read once at process start; changing it restarts the pods).
      # NOTE: the pack cache and the repo mirrors under /data/git share the same PVC,
      # and the cleaner only evicts when the cache dir exceeds this value -- it does
      # NOT look at free space. Size it so that:
      #   PACK_CACHE_SIZE_GB + /data/git + headroom < usable PVC size
      # e.g. 250(GiB) + ~22GiB(/data/git) + ~22GiB(headroom) < ~294.7GiB(300Gi PVC).
      PACK_CACHE_SIZE_GB: 250
      # directory where to put cache files
      WORKING_DIRECTORY: /data
      PACK_CACHE_MULTI: true
      PACK_CACHE_DEPTH: true
