apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: git-cdn
spec:
  releaseName: git-cdn
  chart:
    spec:
      chart: git-cdn
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: ee-ops
        namespace: flux-system
  interval: 5m
  # The two replicas are forced onto different nodes and the PVCs pin them to
  # the node that owns each CBS volume, so a rollout waits for Karpenter to
  # provision a node. Five minutes was not enough on 2026-11-26: the upgrade
  # timed out and helm rolled it back, undoing the pod change while the
  # certificate, route and policy stayed behind.
  timeout: 15m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
    ignoreFailures: false
  values:
    image:
      # The zot on-demand mirror of registry.gitlab.com fails because the TKE
      # egress to cdn.registry.gitlab-static.net times out, so the image is
      # copied to cr.pingcap.net instead (same zot, internal route).
      repository: cr.pingcap.net/personal/wuhui.zuo/git_cdn
      tag: 1.13.0-oss
    imagePullSecrets:
      - name: ci-registry-auth
    kind: StatefulSet
    replicaCount: 2
    podManagementPolicy: Parallel
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "1"
        memory: 5Gi
      limits:
        cpu: "2"
        memory: 5Gi
    nodeSelector:
      kubernetes.io/arch: amd64
      compute-class: ee-application
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: git-cdn
                app.kubernetes.io/instance: git-cdn
            topologyKey: kubernetes.io/hostname
    service:
      type: ClusterIP
    ingress:
      enabled: false
    volumeMounts:
      - name: data
        mountPath: /data

    # volumeClaimTemplates is immutable and only affects newly created PVCs, so Flux
    # cannot apply a `storage` change here. To resize the existing PVCs, run:
    #   SIZE=300Gi
    #   for i in 0 1; do kubectl -n cache patch pvc data-git-cdn-$i --type merge -p "{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"$SIZE\"}}}}"; done
    #   kubectl -n cache delete pod git-cdn-0 git-cdn-1               # only if PVC stays FileSystemResizePending
    #   kubectl -n cache delete statefulset git-cdn --cascade=orphan  # keep pods/PVCs, allow new template
    #   flux reconcile helmrelease git-cdn -n cache --force
    # TODO(ops): alert on `git_cdn_workdir_filesystem_avail_bytes` (exported by
    # git-cdn on /metrics) so a full /data is caught before checkouts break again.
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ci-rwo
          resources:
            requests:
              storage: 300Gi
    configuration:
      GITSERVER_UPSTREAM: https://github.com/
      # Pack-cache limit (read once at process start; changing it restarts the pods).
      # NOTE: the pack cache and the repo mirrors under /data/git share the same PVC,
      # and the cleaner only evicts when the cache dir exceeds this value -- it does
      # NOT look at free space. Size it so that:
      #   PACK_CACHE_SIZE_GB + /data/git + headroom < usable PVC size
      # e.g. 250(GiB) + ~22GiB(/data/git) + ~22GiB(headroom) < ~294.7GiB(300Gi PVC).
      PACK_CACHE_SIZE_GB: 250
      # directory where to put cache files
      WORKING_DIRECTORY: /data
      PACK_CACHE_MULTI: true
      PACK_CACHE_DEPTH: true

  # Serve TLS from inside the pods. The chart has no TLS option and the app can
  # only listen on plain HTTP, so a sidecar terminates TLS and proxies to the
  # loopback listener; that keeps the plaintext hop inside the pod. The gateway
  # then re-encrypts to this port (see backendtlspolicy.yaml) instead of
  # downgrading the second hop to cleartext.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: git-cdn
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: git-cdn
              spec:
                template:
                  metadata:
                    annotations:
                      # Keep `kubectl logs/exec` pointing at git-cdn itself now
                      # that the pod has a second container.
                      kubectl.kubernetes.io/default-container: git-cdn
                  spec:
                    containers:
                      - name: tls
                        # renovate: datasource=docker depName=nginx
                        image: docker.io/library/nginx:1.27-alpine
                        command: ["/usr/sbin/nginx"]
                        args:
                          - -c
                          - /etc/nginx/nginx.conf
                          - -g
                          - daemon off;
                        ports:
                          - name: https
                            containerPort: 8443
                            protocol: TCP
                        volumeMounts:
                          - name: tls
                            mountPath: /etc/git-cdn-tls
                            readOnly: true
                          - name: tls-proxy-config
                            mountPath: /etc/nginx/nginx.conf
                            subPath: nginx.conf
                            readOnly: true
                        readinessProbe:
                          tcpSocket:
                            port: https
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        livenessProbe:
                          tcpSocket:
                            port: https
                          initialDelaySeconds: 30
                          periodSeconds: 20
                        resources:
                          requests:
                            cpu: 100m
                            memory: 64Mi
                          limits:
                            cpu: "1"
                            memory: 256Mi
                    volumes:
                      - name: tls
                        secret:
                          secretName: git-cdn-tls
                      - name: tls-proxy-config
                        configMap:
                          name: git-cdn-tls-proxy
          - target:
              kind: Service
              name: git-cdn
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: git-cdn
              spec:
                ports:
                  - name: https
                    port: 8443
                    targetPort: https
                    protocol: TCP
