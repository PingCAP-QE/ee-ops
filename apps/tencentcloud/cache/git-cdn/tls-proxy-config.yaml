---
# nginx front for the plaintext git-cdn listener: it terminates TLS on 8443 and
# proxies to git-cdn on the pod loopback. The plaintext hop never leaves the pod,
# so neither the Jenkins HTTP credential nor the fetched private repository data
# crosses the pod network unencrypted.
#
# The values below are tuned for git protocol traffic: upload-pack responses are
# streamed for minutes and must not be buffered or timed out by the proxy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-cdn-tls-proxy
  namespace: cache
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 4096;
    }

    http {
      access_log off;
      # Long-lived git fetches: never buffer, never time out early.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      client_body_timeout 3600s;
      client_max_body_size 0;

      server {
        listen 8443 ssl;
        server_name git-cdn.cache.svc git-cdn.cache.svc.cluster.local git-cdn;

        ssl_certificate     /etc/git-cdn-tls/tls.crt;
        ssl_certificate_key /etc/git-cdn-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:git_cdn_tls:10m;
        ssl_session_timeout 1h;

        location / {
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_pass http://127.0.0.1:8000;
        }
      }
    }
