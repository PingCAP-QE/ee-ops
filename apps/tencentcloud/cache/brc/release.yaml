apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brc
spec:
  chart:
    spec:
      chart: bazel-remote
      version: 0.0.4
      sourceRef:
        kind: HelmRepository
        name: ee-ops
        namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  values:
    fullnameOverride: brc
    kind: StatefulSet
    # bazel-remote drains in-flight HTTP/gRPC requests on SIGTERM; give it a long
    # enough window so large blob transfers complete before SIGKILL.
    terminationGracePeriodSeconds: 300
    image:
      repository: quay.io/bazel-remote/bazel-remote
      tag: v2.6.1
    podSecurityContext:
      fsGroup: 1000
    nodeSelector:
      kubernetes.io/arch: amd64
      compute-class: ee-application
    conf: |-
      # https://github.com/buchgr/bazel-remote#example-configuration-file
      dir: /data
      # Keep these two limits below the volumeClaimTemplates storage size (200Gi) below,
      # leaving headroom for filesystem overhead and eviction lag so the PVC never fills
      # up. If you change the PVC size or the storageClass (see volumeClaimTemplates
      # below), update max_size/max_size_hard_limit accordingly.
      max_size: 170 # The maximum size of bazel-remote's local disk cache in GiB (85% of PVC).
      max_size_hard_limit: 180 # Reject writes once this GiB limit is reached to avoid ENOSPC (~90% of PVC).
      experimental_remote_asset_api: true
      access_log_level: all
      http_address: ":8080"
      grpc_address: ":9092"
      log_timezone: UTC
      s3_proxy:
        # Tencent COS only supports virtual-hosted-style addressing:
        # https://<bucket>.cos.<region>.myqcloud.com
        endpoint: cos.${COS_REGION}.myqcloud.com
        bucket: ${COS_BUCKET}
        prefix: ${COS_PREFIX}
        region: ${COS_REGION}
        auth_method: aws_credentials_file
        aws_shared_credentials_file: /etc/bazel-remote/credentials
        aws_profile: brc
        bucket_lookup_type: dns
        max_idle_conns: 1024
    replicaCount: 2
    service:
      # A CI build runs many bazel steps; pin a client to a single replica so the
      # per-pod local disk cache (170Gi) keeps hitting instead of bouncing between
      # the two pods. timeoutSeconds covers the longest expected CI job.
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
      limits:
        cpu: "3"
        memory: 6Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: bazel-remote
            topologyKey: kubernetes.io/hostname
    volumeClaimTemplates:
      - metadata:
          name: bazel-remote-cache
        spec:
          accessModes:
            - ReadWriteOnce
          # ci-rwo maps to Tencent CBS CLOUD_HSSD (enhanced SSD); the built-in default
          # "cbs" class uses CLOUD_PREMIUM (HDD tier). Keep this an SSD class and keep
          # the size above conf's max_size_hard_limit (180 GiB); see conf above.
          storageClassName: ci-rwo
          resources:
            requests:
              storage: 200Gi # Must stay larger than conf's max_size_hard_limit (180 GiB); see conf above.
    volumeMounts:
      - mountPath: /data
        name: bazel-remote-cache
      - mountPath: /etc/bazel-remote/credentials
        name: bazel-remote-cos-credentials
        subPath: credentials
    volumes:
      - name: bazel-remote-cos-credentials
        secret:
          secretName: bazel-remote-cos-credentials
