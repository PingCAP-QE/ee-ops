apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kellnr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: kellnr-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        adminPwd: "{{ .adminPwd }}"
        adminToken: "{{ .adminToken }}"
  dataFrom:
    - extract:
        # JSON object containing `adminPwd` and `adminToken`.
        key: tencentcloud_kellnr_admin_json
