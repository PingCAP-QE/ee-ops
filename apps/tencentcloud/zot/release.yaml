apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
spec:
  chart:
    spec:
      chart: zot
      # renovate: datasource=helm depName=zot registryUrl=https://zotregistry.dev/helm-charts
      version: 0.1.122
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: project-zot
  dependsOn:
    - name: redis
  interval: 1h
  upgrade:
    remediation:
      strategy: uninstall
      retries: 1
      remediateLastFailure: true
  values:
    mountSecret: true
    secretFiles: false # We are in charge of managing it(the secret `zot-secret`)
    mountConfig: true
    configFiles: false # We are in charge of managing it(the config map `zot-config`)
    httproute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: external-https
          namespace: infra
      hostnames:
        - cr.pingcap.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          # Registry pulls and pushes can stream large layers for a long time.
          timeouts:
            request: 0s
    persistence: true
    pvc:
      accessMode: ReadWriteOnce
      create: true
      storage: 10Gi # CBS minimum is 10Gi
      storageClassName: cbs
    replicaCount: 1
    # Guaranteed QoS: requests must equal limits for both CPU and memory.
    # zot is network/CPU bound and was CFS-throttled under CI artifact bursts
    # with the previous 1-CPU limit, so give it 2 full CPUs.
    resources:
      requests:
        cpu: "2"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 1Gi
    service:
      type: ClusterIP
    nodeSelector:
      kubernetes.io/arch: amd64
      compute-class: ee-application
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                # A 2-CPU request does not fit on the 2-vCPU BF1.MEDIUMx nodes
                # (1930m allocatable), so require a >= 4 vCPU instance.
                - key: karpenter.k8s.tke/instance-cpu
                  operator: Gt
                  values: ["2"]
                # zot-pvc-zot-0 is bound to the CBS volume in ap-beijing-7
                # (zone ID 800007) and CBS volumes cannot be attached across
                # AZs. Pin the zone explicitly so Karpenter provisions the
                # replacement node in the right subnet instead of leaving the
                # single-replica StatefulSet Pending.
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: ["800007"]

    # Relax probes to avoid restart loops during zot cold start
    startupProbe:
      httpGet:
        path: /startupz
        port: 5000
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30

    readinessProbe:
      httpGet:
        path: /readyz
        port: 5000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

    livenessProbe:
      httpGet:
        path: /livez
        port: 5000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
