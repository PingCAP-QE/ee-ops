---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot-post
spec:
  dependsOn:
    - name: zot-pre
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: zot
  path: ./apps/tencentcloud/zot/post
  prune: true
