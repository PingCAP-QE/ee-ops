# secret-generator is not installed on the tencentcloud cluster, so the redis
# password is synced from GCP Secret Manager instead (see tencentcloud_zot_redis_password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: redis
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: tencentcloud_zot_redis_password
