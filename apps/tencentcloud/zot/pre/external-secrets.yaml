# generate for self-charge secret `zot-secret`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-secret
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        # you should add records to htpasswd file by command:
        # $ htpasswd -bBn <username> <password> >> <htpasswd/file/path>
        key: "${ZOT_HTPASSWD}"
    - secretKey: sessionKeys.json
      remoteRef:
        key: "${ZOT_SESSION_KEYS_JSON}"
    - secretKey: sync_auth.json
      remoteRef:
        # credentials for the upstream registry (us-docker.pkg.dev), copied from prod2_zot_sync_auth_credentials_json
        key: "${ZOT_SYNC_AUTH_CREDENTIALS_JSON}"
---
# some secret to provide to generate configmap `zot-config`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-config-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Keep the existing env-style keys consumed by zot-config. The source
        # Google OAuth secret uses the canonical client-id/client-secret keys.
        GOOGLE_CLIENT_ID: '{{ index . "client-id" }}'
        GOOGLE_CLIENT_SECRET: '{{ index . "client-secret" }}'
        # Tencent Cloud COS: regionendpoint is the virtual-hosted style COS endpoint.
        S3_REGION: "{{ .region }}"
        S3_BUCKET: "{{ .bucket }}"
        S3_REGION_ENDPOINT: "https://cos.{{ .region }}.myqcloud.com"
        S3_ACCESS_KEY: "{{ .accessKey }}"
        S3_SECRET_KEY: "{{ .accessSecret }}"
        PERSONAL_USERS: "{{ .personalUsers }}"
  data:
    - secretKey: personalUsers # used to provide personal namespaces
      remoteRef:
        # json array of users with a personal namespace, e.g. ["alice@pingcap.com"]
        key: tencentcloud_zot_personal_users
  dataFrom:
    - extract:
        # json object contains keys: `client-id`, `client-secret`
        key: "${ZOT_GOOGLE_OAUTH_JSON}"
    - extract:
        # json object contains keys: `region`, `bucket` of the Tencent Cloud COS bucket
        key: "${ZOT_S3_JSON}"
    - extract:
        # json object contains keys: `accessKey`, `accessSecret` of the Tencent Cloud COS API keys
        key: "${S3_CREDENTIALS_JSON}"

---
# zot's configuration, rendered by External Secrets into a Secret.
#
# It was a ConfigMap filled in by Flux `postBuild.substituteFrom`, which wrote the
# S3 keys, the Redis password and the OAuth client secret into plaintext. Every
# value now comes from GCP Secret Manager and the result is a Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "log": { "level": "info" },
            "storage": {
              "rootDirectory": "/var/lib/registry",
              "remoteCache": true,
              "commit": true,
              "dedupe": false,
              "gc": true,
              "gcDelay": "6h",
              "gcInterval": "24h",
              "storageDriver": {
                "name": "s3",
                "rootdirectory": "/",
                "secure": true,
                "skipverify": false,
                "forcepathstyle": false,
                "region": "{{ .region }}",
                "regionendpoint": "https://cos.{{ .region }}.myqcloud.com",
                "bucket": "{{ .bucket }}",
                "accesskey": "{{ .accessKey }}",
                "secretkey": "{{ .accessSecret }}"
              },
              "cacheDriver": {
                "name": "redis",
                "url": "redis://:{{ .REDIS_PASSWORD }}@redis-master:6379/0?dial_timeout=3&read_timeout=6s",
                "keyprefix": "zot"
              },
              "retention": {
                "policies": [
                  {
                    "repositories": ["ttl-1h/**"],
                    "keepTags": [{ "patterns": [".*"], "pushedWithin": "1h" }]
                  },
                  {
                    "repositories": ["ttl-1d/**"],
                    "keepTags": [{ "patterns": [".*"], "pushedWithin": "24h" }]
                  },
                  {
                    "repositories": ["ttl-1w/**"],
                    "keepTags": [{ "patterns": [".*"], "pushedWithin": "168h" }]
                  }
                ]
              }
            },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "compat": ["docker2s2"],
              "externalUrl": "https://cr.pingcap.net",
              "realm": "zot",
              "readTimeout": "600s",
              "writeTimeout": "1800s",
              "auth": {
                "failDelay": 5,
                "htpasswd": {
                  "path": "/secret/htpasswd"
                },
                "sessionKeysFile": "/secret/sessionKeys.json",
                "apikey": true,
                "openid": {
                  "providers": {
                    "google": {
                      "issuer": "https://accounts.google.com",
                      "clientid": "{{ index . "client-id" }}",
                      "clientsecret": "{{ index . "client-secret" }}",
                      "scopes": ["openid", "email"]
                    }
                  }
                }
              },
              "accessControl": {
                "groups": {
                  "pullers": {
                    "users": ["ci-bot"]
                  },
                  "pushers": {
                    "users": ["cd-bot"]
                  }
                },
                "repositories": {
                  "mirrors/registry.gitlab.com/**": {
                    "anonymousPolicy": ["read"],
                    "defaultPolicy": ["read"]
                  },
                  "personal/**": {
                    "policies": [
                      {
                        "users": {{ .personalUsers }},
                        "actions": ["read", "create", "update", "delete"],
                        "conditions": [
                          {
                            "expression": "req.repository.startsWith('personal/' + req.user.username.split('@')[0].lowerAscii() + '/')",
                            "message": "only your personal namespace"
                          }
                        ]
                      }
                    ],
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read"]
                  },
                  "ttl-1h/**": {
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read", "create", "update"]
                  },
                  "ttl-1d/**": {
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read", "create", "update"]
                  },
                  "ttl-1w/**": {
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read", "create", "update"]
                  },
                  "**": {
                    "policies": [
                      {
                        "groups": ["pullers"],
                        "actions": ["read"]
                      },
                      {
                        "groups": ["pushers"],
                        "actions": ["read", "create", "update"]
                      }
                    ],
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read"]
                  }
                },
                "adminPolicy": {
                  "users": ["admin", "wuhui.zuo@pingcap.com"],
                  "actions": ["read", "create", "update", "delete"]
                }
              },
              "ratelimit": {
                "rate": 100,
                "methods": [
                  {
                    "method": "GET",
                    "rate": 50
                  }
                ]
              }
            },
            "extensions": {
              "ui": {
                "enable": true
              },
              "search": {
                "enable": true
              },
              "sync": {
                "enable": true,
                "downloadDir": "/tmp/zot",
                "credentialsFile": "/secret/sync_auth.json",
                "registries": [
                  {
                    "urls": ["https://us-docker.pkg.dev"],
                    "preserveDigest": true,
                    "content": [
                      {
                        "prefix": "/pingcap-testing-account/dev/**",
                        "destination": "/mirrors/dev",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/tidbx/**",
                        "destination": "/mirrors/tidbx",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/hub/**",
                        "destination": "/mirrors/hub",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/internal/**",
                        "destination": "/mirrors/internal",
                        "stripPrefix": true
                      }
                    ],
                    "onDemand": true,
                    "tlsVerify": true
                  },
                  {
                    "urls": ["https://ghcr.io"],
                    "preserveDigest": true,
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/mirrors/ghcr"
                      }
                    ],
                    "onDemand": true,
                    "tlsVerify": true
                  },
                  {
                    "urls": ["https://registry.gitlab.com"],
                    "preserveDigest": true,
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/mirrors/registry.gitlab.com"
                      }
                    ],
                    "onDemand": true,
                    "tlsVerify": true
                  }
                ]
              },
              "scrub": {
                "enable": true,
                "interval": "120h"
              },
              "mgmt": {
                "enable": true
              }
            }
          }
  data:
    - secretKey: personalUsers
      remoteRef:
        key: tencentcloud_zot_personal_users
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: tencentcloud_zot_redis_password
  dataFrom:
    - extract:
        key: google-oauth2-client-zot
    - extract:
        key: tencentcloud_zot_s3_json
    - extract:
        key: tencentcloud_common_creds_json
