apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.9
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    # The chart's only test hook is a one-shot `wget` for /healthz, and busybox
    # wget does not retry a refused connection. A rollout that replaces the API
    # pods therefore turns the hook into "connection refused" and Flux rolls the
    # whole release back, even though the pods come up healthy seconds later.
    # The /healthz readiness probe (periodSeconds: 10) is the real gate; disable
    # the hook so an image bump is not reverted by a spurious test failure.
    enable: false
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.11.8-32-g4cc8f47
    server:
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for the image copies (image-release-cred carries
      # the same credential the Tekton delivery task uses) and the delivery
      # rules mounted from the artifacts packages ConfigMap.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: packages-config
          configMap:
            name: packages-config
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
        - name: packages-config
          subPath: delivery.yaml
          mountPath: /etc/delivery/delivery.yaml
          readOnly: true
    serviceAccount:
      create: false
    worker:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
    httpRoute:
      enabled: false
