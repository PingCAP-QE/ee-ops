apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.8
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.10.25-44-g69ced1a
    server:
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for the image copies (image-release-cred carries
      # the same credential the Tekton delivery task uses) and the delivery
      # rules mounted from the artifacts packages ConfigMap.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: packages-config
          configMap:
            name: packages-config
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
        - name: packages-config
          subPath: delivery.yaml
          mountPath: /etc/delivery/delivery.yaml
          readOnly: true
    serviceAccount:
      create: false
    # worker.extraDeployments and the TiUP worker binary ship with
    # tibuild-v2 chart 2.0.0-alpha.8 / image v2026.10.25-44-g69ced1a (PR #797).
    worker:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
      # One Deployment per TiUP mirror: each pod mounts only its own signing
      # key, and the serial lane is what keeps the two mirrors from publishing
      # at the same time.
      extraDeployments:
        - name: tiup-staging
          config:
            secretName: v2-config
            secretKey: config-tiup-staging.yaml
          volumes:
            - name: tiup-credentials
              secret:
                secretName: tiup-credentials-staging
            - name: docker-cred
              secret:
                secretName: image-release-cred
                items:
                  - key: .dockerconfigjson
                    path: config.json
          volumeMounts:
            - name: tiup-credentials
              subPath: private.json
              mountPath: /root/.tiup/keys/private.json
              readOnly: true
            - name: docker-cred
              mountPath: /root/.docker
              readOnly: true
        - name: tiup-prod
          config:
            secretName: v2-config
            secretKey: config-tiup-prod.yaml
          volumes:
            - name: tiup-credentials
              secret:
                secretName: tiup-credentials-prod
            - name: docker-cred
              secret:
                secretName: image-release-cred
                items:
                  - key: .dockerconfigjson
                    path: config.json
          volumeMounts:
            - name: tiup-credentials
              subPath: private.json
              mountPath: /root/.tiup/keys/private.json
              readOnly: true
            - name: docker-cred
              mountPath: /root/.docker
              readOnly: true
    httpRoute:
      enabled: false
