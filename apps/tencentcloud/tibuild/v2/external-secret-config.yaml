apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: v2-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: v2-config
    template:
      type: Opaque
      data:
        config.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}

          tekton:
            cloudevent_endpoint: http://el-tibuild.ee-cd.svc:8080
            api_url: http://tekton-dashboard.tekton-pipelines.svc:9097
            view_url: https://do.pingcap.net/tekton
            oci_file_download_url: "http://dl.dl.svc/oci-file"
            reconciler_interval: 15s
            reconciler_since: 4h
          lark:
            image_sync_url: "https://tcms.pingcap.net/dashboard/image-sync-tasks"
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}

          github:
            token: {{ .github_token }}
            broker_url: "http://github-token-broker.github-token-broker.svc"

          worker:
            targets: ["*"]
            concurrency: 4
            poll_interval: "10s"
            lease: "90s"
            heartbeat: "30s"
            max_attempts: 3
            kinds: ["image_copy"]

          # Delivery rules (mounted from the artifacts packages ConfigMap)
          # and the regions that execute them. publish.targets is separate
          # from worker.targets so concentrating publication does not
          # re-shard the image sync queue.
          publish:
            delivery_config_path: /etc/delivery/delivery.yaml
            targets: ["uhub.service.ucloud.cn"]
            tiup_mirrors:
              staging: {{ .tiup_staging_url }}
              prod: {{ .tiup_prod_url }}
            # Dependency seeding for TiUP: staging waits for prod. Remove an
            # entry (or set tiup_dependencies: {}) to run the mirrors in
            # parallel; the executor does not hardcode the direction.
            tiup_dependencies:
              tiup-prod: tiup-staging

          # TiUP publish workers get their own config files: one kind, one
          # mirror target, a longer lease and the 8m step hard timeout the
          # TiUP kind needs.
          config-tiup-staging.yaml: |
            store:
              driver: mysql
              dsn: {{ .dsn }}
            github:
              token: {{ .github_token }}
              broker_url: "http://github-token-broker.github-token-broker.svc"
            worker:
              kinds: ["tiup"]
              targets: ["tiup-staging"]
              concurrency: 1
              poll_interval: "10s"
              lease: "12m"
              heartbeat: "30s"
              hard_timeout: "8m"
              max_attempts: 3
            publish:
              delivery_config_path: /etc/delivery/delivery.yaml
              tiup_mirrors:
                staging: {{ .tiup_staging_url }}
          config-tiup-prod.yaml: |
            store:
              driver: mysql
              dsn: {{ .dsn }}
            github:
              token: {{ .github_token }}
              broker_url: "http://github-token-broker.github-token-broker.svc"
            worker:
              kinds: ["tiup"]
              targets: ["tiup-prod"]
              concurrency: 1
              poll_interval: "10s"
              lease: "12m"
              heartbeat: "30s"
              hard_timeout: "8m"
              max_attempts: 3
            publish:
              delivery_config_path: /etc/delivery/delivery.yaml
              tiup_mirrors:
                prod: {{ .tiup_prod_url }}

          product_repo_map:
            tidb-cse: tidbcloud/tidb-cse
            pd-cse: tidbcloud/pd-cse
            tidb-operator-cse: tidbcloud/tidb-operator-cse
            cassandra-on-mysql: tidbcloud/cassandra-on-mysql
            qdrant-on-tidb: tidbcloud/qdrant-on-tidb
            pd: tikv/pd
            tikv: tikv/tikv
            tiflash: pingcap/tiflash
            tidb: pingcap/tidb
            ticdc: pingcap/ticdc
            dm: pingcap/tiflow

  data:
    - secretKey: github_token
      remoteRef:
        key: github-bot-token
    - secretKey: dsn
      remoteRef:
        key: tibuild_v2_dsn
    - secretKey: lark_app_id
      remoteRef:
        key: tibuild_v2_lark_app_id
    - secretKey: lark_app_secret
      remoteRef:
        key: tibuild_v2_lark_app_secret
    - secretKey: tiup_staging_url
      remoteRef:
        key: tiup-staging-mirror-url
    - secretKey: tiup_prod_url
      remoteRef:
        key: tiup-prod-mirror-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-auth-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: ingress-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: tidbx-ops-client-tibuild-v2-basic-auth
