apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: v2-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: v2-config
    template:
      type: Opaque
      data:
        config.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}

          tekton:
            cloudevent_endpoint: http://el-tibuild.ee-cd.svc:8080
            # HMAC-SHA256 key tibuild-v2 signs every CloudEvent with; the
            # el-tibuild EventListener verifies it before triggering a build.
            cloudevent_hmac_secret: {{ .cloudevent_hmac }}
            api_url: http://tekton-dashboard.tekton-pipelines.svc:9097
            view_url: https://do.pingcap.net/tekton
            oci_file_download_url: "http://dl.dl.svc/oci-file"
            reconciler_interval: 15s
            reconciler_since: 4h
          lark:
            image_sync_url: "https://tcms.pingcap.net/dashboard/image-sync-tasks"
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}

          github:
            token: {{ .github_token }}
            broker_url: "http://github-token-broker.github-token-broker.svc"

          worker:
            targets: ["*"]
            concurrency: 4
            poll_interval: "10s"
            lease: "90s"
            heartbeat: "30s"
            max_attempts: 3
            kinds: ["image_copy"]

          # Delivery rules (mounted from the artifacts packages ConfigMap)
          # and the regions that execute them. publish.targets is separate
          # from worker.targets so concentrating publication does not
          # re-shard the image sync queue.
          publish:
            delivery_config_path: /etc/delivery/delivery.yaml
            targets: ["uhub.service.ucloud.cn"]
            # Nightly TiUP pushes to an enabled target only record the newest
            # artifact; the TiUP workers publish it once per window. The API and
            # the workers must agree on the schedule, because the API decides
            # whether a push is deferred and the workers run the reconciler.
            nightly:
              enabled: true
              targets:
                tiup-staging:
                  window: "1h"
                  anchor: "00:00"
                  timezone: UTC
                  on_failure: alert
                tiup-prod:
                  window: "12h"
                  anchor: "02:00"
                  timezone: UTC
                  on_failure: alert

          product_repo_map:
            tidb-cse: tidbcloud/tidb-cse
            pd-cse: tidbcloud/pd-cse
            tidb-operator-cse: tidbcloud/tidb-operator-cse
            cassandra-on-mysql: tidbcloud/cassandra-on-mysql
            qdrant-on-tidb: tidbcloud/qdrant-on-tidb
            pd: tikv/pd
            tikv: tikv/tikv
            tiflash: pingcap/tiflash
            tidb: pingcap/tidb
            ticdc: pingcap/ticdc
            dm: pingcap/tiflow

          # Devbuild request policy.
          devbuild:
            # A request's builderImg becomes the image of the Tekton build step,
            # which runs with CI credentials and pushes to the testing-account
            # registry, so a caller may only name repositories we pin as
            # builders. The list below is exactly the builder repositories of
            # PingCAP-QE/artifacts packages/packages.yaml.tmpl (cd/builders/*
            # and cd/utils/release), plus the serverless bases and the Rust
            # toolchain image that config pins. Matching is on the repository
            # namespace (repository == entry or under entry/); an empty list
            # would disable the check. Hot-reloadable: the API re-reads it.
            builder_image_allowed_repositories:
              - ghcr.io/pingcap-qe/cd/builders
              - ghcr.io/pingcap-qe/cd/utils/release
              - docker.io/library/golang
              - docker.io/rustlang/rust
              - public.ecr.aws/amazonlinux/amazonlinux

            # Explicit devbuild githubRepo values must match this list
            # (case-insensitive). Entries are "<owner>/<repo>" or "<owner>/*";
            # an empty list would accept only a value equal to the product default.
            #
            # The list must cover every value of product_repo_map above: adding
            # a product without adding its repository here rejects the whole
            # configuration revision, and the previous revision keeps serving.
            github_repo_allowlist:
              - tidbcloud/tidb-cse
              - tidbcloud/pd-cse
              - tidbcloud/tidb-operator-cse
              - tidbcloud/cassandra-on-mysql
              - tidbcloud/qdrant-on-tidb
              - tikv/pd
              - tikv/tikv
              - pingcap/tiflash
              - pingcap/tidb
              - pingcap/ticdc
              - pingcap/tiflow
              - tidbcloud/cloud-storage-engine
              - pingcap/ticse
              # Explicit overrides and historical first-party repositories with
              # production devbuild records (not forks).

  data:
    - secretKey: github_token
      remoteRef:
        key: github-bot-token
    - secretKey: dsn
      remoteRef:
        key: tibuild_v2_dsn
    - secretKey: lark_app_id
      remoteRef:
        key: tibuild_v2_lark_app_id
    - secretKey: lark_app_secret
      remoteRef:
        key: tibuild_v2_lark_app_secret
    # Shared with the el-tibuild-webhook ExternalSecret in
    # apps/tencentcloud/tekton/configs/triggers/event-listeners/: tibuild-v2
    # signs each CloudEvent with this value, the EventListener verifies it.
    - secretKey: cloudevent_hmac
      remoteRef:
        key: gcp_tibuild_cloudevent_hmac
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-auth-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: ingress-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: tidbx-ops-client-tibuild-v2-basic-auth
