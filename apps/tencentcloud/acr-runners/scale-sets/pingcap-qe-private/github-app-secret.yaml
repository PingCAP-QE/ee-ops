---
# GitHub App credentials for the `arc-runner-set-pingcap-qe-private` scale set.
#
# The installation ID is the PingCAP-QE installation of the `ti-chi-bot` app
# (the same app the prod2 tiup scale set uses), not a per-repository
# installation: GitHub installs an app per account, so this organization-level
# scale set shares it with every other PingCAP-QE runner set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-runner-set-pingcap-qe-private-github-config
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: arc-runner-set-pingcap-qe-private-github-config
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: gha__system__github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc__org__pingcap-qe__github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: gha__system__github_app_private_key
