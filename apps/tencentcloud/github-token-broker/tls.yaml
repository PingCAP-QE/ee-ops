---
# Native HTTPS listener certificate for the broker, issued by the
# cluster-internal CA. The Secret name is the one the chart mounts
# (`server.tls.existingSecret`), so a chart release that enables TLS picks the
# certificate up without any further provisioning.
#
# This cluster still runs Chart 0.1.0, which has no TLS listener at all: the
# material is staged here so the activation change only has to upgrade the chart
# and set `server.tls.enabled: true`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: github-token-broker-tls
spec:
  secretName: github-token-broker-tls
  commonName: github-token-broker.github-token-broker.svc.cluster.local
  dnsNames:
    - github-token-broker.github-token-broker.svc.cluster.local
    - github-token-broker.github-token-broker.svc
    - github-token-broker
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    # The Secret is projected into the pod; kubelet swaps the projected volume
    # atomically, so a renewed pair is always consistent when read.
    rotationPolicy: Always
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
