apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-token-broker
spec:
  releaseName: github-token-broker
  chart:
    spec:
      chart: github-token-broker
      version: 0.2.3
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
    ignoreFailures: false
  values:
    replicaCount: 2
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/github-token-broker
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/github-token-broker versioning=semver
      tag: v2026.11.22-39-g53753c8
    server:
      # Native HTTPS listener on the cluster-internal CA leaf. The Jenkins agents
      # are its first client: their namespace gets the CA from the trust-manager
      # Bundle and is the only entry in networkPolicy.tlsIngressNamespaces. HTTP
      # 8080 and its probes are unchanged for the namespaces still calling it.
      tls:
        enabled: true
        port: 8443
        existingSecret: github-token-broker-tls
        certKey: tls.crt
        keyKey: tls.key
    service:
      # Service 443 fronts the native TLS listener (targetPort: https).
      httpsPort: 443
    github:
      appId: 214286
      credentialsSecret:
        name: github-app-credentials
        key: privateKey.pem
    policy:
      existingSecret: github-token-broker-policy
      key: policy.yaml
    cache:
      # Never hand a caller a cached installation token with less than this
      # left. Entries are shared by everyone asking for the same repository set
      # and permissions, so the token a slow job receives can be the one another
      # caller minted minutes ago; the broker re-mints instead of serving one
      # that would expire mid-job.
      minRemaining: 15m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    networkPolicy:
      # Plaintext consumers of the HTTP listener (port 8080). The chart keeps the
      # TLS port out of this list; a namespace reaches 8443 only through
      # tlsIngressNamespaces, added together with the CA it needs.
      tlsIngressNamespaces:
        - jenkins-tidb
      ingressNamespaces:
        - ee-cd
        - tibuild
        # Jenkins agents run the SAML-organization jobs (jenkins-tidb).
        - jenkins-tidb
      egress:
        # DNS.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        # Kubernetes API (TokenReview/readiness) and GitHub API.
        - to:
            - ipBlock:
                # Cluster service CIDR.
                cidr: 10.32.0.0/16
            - ipBlock:
                # GitHub API ranges from https://api.github.com/meta.
                cidr: 140.82.112.0/20
            - ipBlock:
                cidr: 192.30.252.0/22
            - ipBlock:
                cidr: 185.199.108.0/22
            - ipBlock:
                cidr: 143.55.64.0/20
            - ipBlock:
                cidr: 2a0a:a440::/29
            - ipBlock:
                cidr: 2606:50c0::/32
          ports:
            - protocol: TCP
              port: 443
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    serviceMonitor:
      enabled: false
