apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-broker-policy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: github-token-broker-policy
    creationPolicy: Owner
  data:
    - secretKey: policy.yaml
      remoteRef:
        # Raw policy YAML; managed outside of GitOps.
        key: github-token-broker-policy
