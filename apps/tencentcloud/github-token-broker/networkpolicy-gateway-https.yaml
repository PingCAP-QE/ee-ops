---
# Grants the internal gateway access to the broker's TLS listener. The chart's
# own policy covers the plaintext listener only (`tlsIngressNamespaces` stays
# empty there on purpose), so the TLS grant lives next to the route it serves.
#
# This is a network gate, not an authorization gate: the broker still decides
# from the caller's SA token, and a caller without an allowlisted
# namespace/ServiceAccount gets 401.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-token-broker-gateway-https
spec:
  podSelector:
    # Pinned to release.yaml's releaseName and the chart's default name.
    # Do not set nameOverride/fullnameOverride there without updating this selector.
    matchLabels:
      app.kubernetes.io/name: github-token-broker
      app.kubernetes.io/instance: github-token-broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Envoy data plane of the infra/internal-https Gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        # Service 443 targets the broker's native TLS listener. Keep this port
        # equal to server.tls.port in release.yaml.
        - protocol: TCP
          port: 8443
