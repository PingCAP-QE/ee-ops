# Shared by every cluster that runs Prow job Pods out of the `prow-test-pods`
# namespace (gcp: apps/gcp/prow/post/job-ns, tencentcloud:
# apps/tencentcloud/prow-worker). One definition, so the two build clusters
# cannot drift apart again: the tencentcloud namespace holds the same
# org-wide credentials but used to load no validation policy at all.
#
# Threat model: `in_repo_config` is off (charts/prow/config/default-prow-config.yaml.tpl)
# and Prow job specs live in PingCAP-QE/ci, but a Pod that runs pull-request
# code still cannot be trusted with the credentials Prow itself uses. Every
# job that mounts one of these Secrets hands it to whatever the PR checks out,
# so the Pods must not be able to name them at all.
#
# This policy is the second line of defence, not the boundary: the real fix is
# to keep the credentials out of this namespace (a Secret cannot be mounted
# across namespaces), see the T1 items in FLA-326.
#
# Enforcement is staged per rule through `failureAction` so the cheap half can
# be enforced before the presubmits that still need the rest are migrated:
#
#   deny-privileged-service-account   -> Enforce once terraform-plan-reader /
#                                        prow-job-validation users are migrated
#                                        (tidbx-puller / gar-reader are image
#                                        pull identities and can move to
#                                        imagePullSecrets first)
#   deny-org-admin-secret-reference    -> Enforce once github-token /
#                                        github-ssh-secret consumers read
#                                        short-lived tokens from
#                                        github-token-broker
#   deny-project-secret-reference      -> Audit until the project-scoped tokens
#                                        (codecov-tokens, ci-job-params-mono,
#                                        ci-smtp, docs-cn,
#                                        tencentcloud-terraform-creds) are
#                                        brokered as well
#
# `gcs-credentials` is deliberately absent from every list: the decorator
# injects it into every decorated Pod, so a rule naming it would match 100% of
# presubmits and make Enforce unusable. PR Pods can still declare the same
# volume themselves, so it has to be closed on its own (decorator uploader on
# Workload Identity / the token broker) - also FLA-326.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: restrict-prow-job-pod-credentials
  # Overridden by the owning Kustomization (`${TEST_PODS_NAMESPACE}` on gcp,
  # `prow-test-pods` on tencentcloud); `kyverno test` needs a value here or
  # every resource would be excluded from a namespaced Policy.
  namespace: prow-test-pods
spec:
  background: true
  rules:
    # Workload-Identity / cluster-RBAC ServiceAccounts. A Pod that names one of
    # them can mint GCP access tokens or read cluster state.
    - name: deny-privileged-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not run as a privileged
          ServiceAccount; this namespace binds Workload-Identity and
          cluster-scoped RBAC to these identities.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: AnyIn
                value:
                  # cluster-scoped RBAC: can create/delete ProwJobs
                  - prow-job-validation
                  # project-wide GCP identities
                  - terraform-plan-reader
                  # image pull only - migrate to imagePullSecrets
                  - tidbx-puller
                  - gar-reader

    # Org-wide GitHub credentials. `github-token` is the ti-chi-bot classic PAT
    # (admin:org, repo, workflow), `github-ssh-secret` the bot SSH key: either
    # one is org takeover, so these two are the first to enforce.
    - name: deny-org-admin-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference org-wide credentials
          (github-token, github-ssh-secret); read a short-lived token from
          github-token-broker instead.
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - github-token
                  - github-ssh-secret

    # Project-scoped tokens: code hosting uploads, the Jenkins master token and
    # the per-org params. Damaging, but not org takeover, so they stay on
    # report-only until their consumers are migrated.
    - name: deny-project-secret-reference
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  created-by-prow: "true"
                matchExpressions:
                  - key: prow.k8s.io/type
                    operator: In
                    values:
                      - presubmit
                      - batch
      validate:
        failureAction: Audit
        allowExistingViolations: false
        message: >-
          PR-authored Prow job Pods must not reference project-scoped Secrets
          (ci-job-params-mono, ci-smtp, tencentcloud-terraform-creds,
          codecov-tokens, docs-cn).
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec | [volumes[].secret.secretName, volumes[].projected.sources[].secret.name, containers[].env[].valueFrom.secretKeyRef.name, containers[].envFrom[].secretRef.name, initContainers[].env[].valueFrom.secretKeyRef.name, initContainers[].envFrom[].secretRef.name] | [] }}
                operator: AnyIn
                value:
                  - ci-job-params-mono
                  - ci-smtp
                  - tencentcloud-terraform-creds
                  - codecov-tokens
                  - docs-cn
