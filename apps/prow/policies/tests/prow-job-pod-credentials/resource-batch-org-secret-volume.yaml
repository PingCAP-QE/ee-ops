# A batch job that mounts the org bot PAT: batch runs test several unmerged PRs
# at once, so the credential is still PR-controlled.
apiVersion: v1
kind: Pod
metadata:
  name: prow-batch-org-secret-volume
  namespace: prow-test-pods
  labels:
    created-by-prow: "true"
    prow.k8s.io/type: batch
    prow.k8s.io/job: batch-merge-check
    prow.k8s.io/refs.org: pingcap
    prow.k8s.io/refs.repo: tidb
spec:
  containers:
    - name: test
      image: ghcr.io/pingcap-qe/ci/test:latest
      volumeMounts:
        - name: github-token
          mountPath: /etc/github
          readOnly: true
  volumes:
    - name: github-token
      secret:
        secretName: github-token
