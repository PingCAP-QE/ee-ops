# A presubmit that reads org-wide Secrets through `env` and `envFrom` instead
# of a volume.
apiVersion: v1
kind: Pod
metadata:
  name: prow-presubmit-org-secret-env
  namespace: prow-test-pods
  labels:
    created-by-prow: "true"
    prow.k8s.io/type: presubmit
    prow.k8s.io/job: pull-build
    prow.k8s.io/refs.org: tikv
    prow.k8s.io/refs.repo: tikv
    prow.k8s.io/refs.pull: "6789"
spec:
  initContainers:
    - name: fetch
      image: ghcr.io/pingcap-qe/ci/test:latest
      env:
        - name: CODECOV_TOKEN
          valueFrom:
            secretKeyRef:
              name: codecov-tokens
              key: tikv-tikv
  containers:
    - name: test
      image: ghcr.io/pingcap-qe/ci/test:latest
      envFrom:
        - secretRef:
            name: docs-cn
