apiVersion: v1
kind: ConfigMap
metadata:
  name: tirelease-config
data:
  config.yaml: |
    enableApiGzip: true
    runAutoMigrate: true
    enableCron: true
    bigQueryProject: pingcap-dbaas-build
    bigQuerySaKey: /bigQuerySaKey
    authingOidcIssuer: https://tirelease.authing.pingcap.net/oidc
    testInfraAuthority: tcms.pingcap.net
    disableNotify: false
    tibuild:
      baseURL: https://prow.tidb.net/tibuild
      audience: prow.tidb.net
      ociFileserverURL: https://prow.tidb.net/dl/oci-file
      createdBy: xiaozhou.zhu@pingcap.com
      saKey: tibuild_sa_key
    jiraMetas:
      - base: https://tidb.atlassian.net/
        projects: [APID, TCID, JPID, NAID, EMID, TCOC, GTOC, ST, FD, FRM, CB]
        apiVer: v2
      - base: https://support.pingcap.cn/
        projects: [TICKET]
        apiVer: v1
      - base: https://internal.pingcap.net/jira/
        projects: [ONCALL, TIBUG]
        apiVer: v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tirelease-webhook-config
data:
  config.yaml: |
    enableApiGzip: true
    # Webhook handlers share production dependencies but do not run migrations
    # or the main service's cron/task executor.
    runAutoMigrate: false
    enableCron: false
    bigQueryProject: pingcap-dbaas-build
    bigQuerySaKey: /bigQuerySaKey
    authingOidcIssuer: https://tirelease.authing.pingcap.net/oidc
    testInfraAuthority: tcms.pingcap.net
    disableNotify: false
    tibuild:
      baseURL: https://prow.tidb.net/tibuild
      audience: prow.tidb.net
      ociFileserverURL: https://prow.tidb.net/dl/oci-file
      createdBy: xiaozhou.zhu@pingcap.com
      saKey: tibuild_sa_key
    jiraMetas:
      - base: https://tidb.atlassian.net/
        projects: [APID, TCID, JPID, NAID, EMID, TCOC, GTOC, ST, FD, FRM, CB]
        apiVer: v2
      - base: https://support.pingcap.cn/
        projects: [TICKET]
        apiVer: v1
      - base: https://internal.pingcap.net/jira/
        projects: [ONCALL, TIBUG]
        apiVer: v1
