apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tirelease-secret-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: tirelease-secret-config
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: tirelease_secret_json
  data:
    # Key of the GCP service account tirelease-tibuild-client (JSON),
    # used for minting Google ID tokens to authenticate against tibuild-v2
    # (https://prow.tidb.net/tibuild) on behalf of tirelease. Mounted at
    # /etc/secret-config/tibuild_sa_key, referenced by config tibuild.saKey.
    # The GCP secret id ends with _json to constrain the payload format.
    - secretKey: tibuild_sa_key
      remoteRef:
        key: tirelease-tibuild-sa-key_json
