apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tirelease-secret-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ee-gcp-sm
    kind: ClusterSecretStore
  target:
    name: tirelease-secret-config
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: tirelease_secret_json
  data:
    # Service account key (JSON) for minting Google ID tokens to authenticate
    # against tibuild-v2 (https://prow.tidb.net/tibuild) on behalf of
    # tirelease. Mounted at /etc/secret-config/tibuild_sa_key, referenced by
    # config tibuild.saKey.
    - secretKey: tibuild_sa_key
      remoteRef:
        key: tirelease-tibuild-sa-key
