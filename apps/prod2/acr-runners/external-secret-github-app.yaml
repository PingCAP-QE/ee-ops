---
# GitHub App credentials for the runner scale set.
#
# App 214286 (ti-chi-bot) is installed on the `pingcap` organization
# (installation 36729905, all repositories). The private key is the shared
# system key already used by the PingCAP-QE ARC scale set and the token broker;
# only this namespace may read it through the ee-gcp-sm ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-runner-set-tiup-release-github-config
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: arc-runner-set-tiup-release-github-config
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: gha__system__github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc__repo__pingcap__tiup__github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: gha__system__github_app_private_key
