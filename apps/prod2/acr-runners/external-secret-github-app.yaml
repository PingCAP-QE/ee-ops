---
# GitHub App credentials for the runner scale set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-runner-set-tiup-release-github-config
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: arc-runner-set-tiup-release-github-config
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: gha__system__github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc__repo__pingcap__tiup__github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: gha__system__github_app_private_key
