# TiUP mirror credentials for the prod2 publish workers.
#
# Each mirror worker mounts only its own key, so a compromised staging worker
# cannot write the production mirror. The values are the same GCP Secret Manager
# keys the pre-migration publisher workers used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tiup-credentials-staging
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: tiup-credentials-staging
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: tiup-staging-mirror-url
    - secretKey: private.json
      remoteRef:
        key: tiup-staging-private-key-json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tiup-credentials-prod
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: tiup-credentials-prod
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: tiup-prod-mirror-url
    - secretKey: private.json
      remoteRef:
        key: tiup-prod-private-key-json
