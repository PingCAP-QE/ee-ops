# TiDB Cloud ops and TCMS configuration for the tibuild-v2 API.
#
# The values are the same ones publisher reads today; publishing them into the
# tibuild namespace lets the API take over without a second copy of the keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tibuild-v2-tidbcloud-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: tibuild-v2-tidbcloud-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        service-tidbcloud-ops.yaml: |
          stages:
            prod:
              api_base_url: "{{ .ops_prod_api_base_url }}"
              api_key: "{{ .ops_prod_api_key }}"
              components: &tidbcloud_components
                ci: # for debugging.
                  cluster_type: SHARED_POOL
                  base_image: ghcr.io/pingcap-qe/ci/base
                  github_repo: PingCAP-QE/ci
                tikv:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                tikv_worker:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                schema_manager:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                pd:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/pd
                  github_repo: tikv/pd
                pd_tso:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/pd
                  github_repo: tikv/pd
                pd_scheduling:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/pd
                  github_repo: tikv/pd
                tiflash_write:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tiflash
                  github_repo: pingcap/tiflash
                tiflash_compute:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tiflash
                  github_repo: pingcap/tiflash
                tidb_worker:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tidb
                  github_repo: pingcap/tidb
                coprocessor_worker:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                tidb:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tidb
                  github_repo: pingcap/tidb
                tiproxy:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tiproxy
                  github_repo: pingcap/tiproxy
                ticdc:
                  cluster_type: TICDC_NG
                  base_image: us.gcr.io/pingcap-public/tidbx/ticdc
                  github_repo: pingcap/ticdc
                tibr_autobackup:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                tibr_restore:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                tibrgc_t2_dfsgc:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                tibrgc_t3_archive:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/tikv
                  github_repo: tidbcloud/cloud-storage-engine
                classic_restore:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/br
                  github_repo: pingcap/tidb
                data_migration:
                  cluster_type: SHARED_POOL
                  base_image: us.gcr.io/pingcap-public/tidbx/dm
                  github_repo: pingcap/tiflow
                dumpling:
                  cluster_type: LOGICAL_CLUSTER
                  base_image: us.gcr.io/pingcap-public/tidbx/dumpling
                  github_repo: pingcap/tidb

            dev:
              api_base_url: "{{ .ops_dev_api_base_url }}"
              api_key: "{{ .ops_dev_api_key }}"
              components: *tidbcloud_components

        service-tidbcloud-testplatforms.yaml: |
          tcms:
            api_base_url: "{{ .tcms_api_base_url }}"
            auth_token: "{{ .tcms_auth_token }}"


  dataFrom:
    - extract:
        # json object contains keys: api_base_url, api_key
        key: tidbcloud_ops_api_prod_json
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ops_prod_$1"
    - extract:
        # json object contains keys: api_base_url, api_key
        key: tidbcloud_ops_api_dev_json
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ops_dev_$1"
    - extract:
        # json object contains keys: api_base_url, api_key
        key: tcms_api_json
      rewrite:
        - regexp:
            source: "(.*)"
            target: "tcms_$1"
