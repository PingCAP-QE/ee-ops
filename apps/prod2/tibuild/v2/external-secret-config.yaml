apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: v2-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: v2-config
    template:
      type: Opaque
      data:
        config.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}

          tekton:
            # prod2 Tekton is retired (2026-10). Do not trigger local builds;
            # use the gcp/tencentcloud tibuild-v2 instances for devbuilds.
            # The client rejects an empty target, so use a valid but unreachable
            # loopback target: the service starts and devbuild requests fail closed.
            cloudevent_endpoint: "http://127.0.0.1:1"
            view_url: ""
            oci_file_download_url: "https://internal2-do.pingcap.net/dl/oci-file"
          lark:
            image_sync_url: "https://tcms.pingcap.net/dashboard/image-sync-tasks"
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}
            channels: {{ .lark_channels }}

          github:
            token: {{ .github_token }}

          worker:
            targets: ["*"]
            concurrency: 4
            poll_interval: "10s"
            lease: "90s"
            heartbeat: "30s"
            max_attempts: 3
            kinds: ["image_copy"]

          # Delivery rules (mounted from the artifacts packages ConfigMap) and
          # the TiUP mirrors this cluster publishes to. The prod2 deployment runs
          # no default worker; the two extra workers below do the publishing.
          publish:
            delivery_config_path: /etc/delivery/delivery.yaml
            targets: []
            tiup_mirrors:
              staging: {{ .tiup_staging_url }}
              prod: {{ .tiup_prod_url }}
            # Ordering is data: staging waits for prod. An empty map would let
            # the two mirrors publish in parallel (the lane still serializes).
            tiup_dependencies:
              tiup-prod: tiup-staging
            # The API decides whether delivery-by-rules defers a nightly push
            # into publish_desired. The workers run the reconciler; both sides
            # must agree on the target schedule.
            nightly:
              enabled: true
              targets:
                tiup-staging:
                  window: "1h"
                  anchor: "00:00"
                  timezone: UTC
                  on_failure: alert
                tiup-prod:
                  window: "12h"
                  anchor: "02:00"
                  timezone: UTC
                  on_failure: alert

          # TiDB Cloud ops and TCMS integrations.
          tidbcloud:
            ops_config_file: /etc/tidbcloud/ops.yaml
            testplatforms_config_file: /etc/tidbcloud/testplatforms.yaml
            # Same fail-closed kernel-image policy as gcp; the API is disabled
            # here today, but an unset list would reject every request the day
            # it is enabled.
            kernel_image_allowed_repositories:
              - us.gcr.io/pingcap-public/tidbx/*

          product_repo_map:
            pd: tikv/pd
            tikv: tikv/tikv
            tiflash: pingcap/tiflash
            tidb: pingcap/tidb
            ticdc: pingcap/ticdc
            dm: pingcap/tiflow

          # Worker-only deployment: the allowlist is validated at startup.
          # Explicit devbuild githubRepo values must match this list
          # (case-insensitive). Entries are "<owner>/<repo>" or "<owner>/*";
          # an empty list would accept only a value equal to the product default.
          #
          # The list must cover every value of product_repo_map: adding a product
          # above without adding its repository here rejects the whole
          # configuration revision, and the previous revision keeps serving.
          devbuild:
            github_repo_allowlist:
              - tikv/pd
              - tikv/tikv
              - pingcap/tiflash
              - pingcap/tidb
              - pingcap/ticdc
              - pingcap/tiflow

          image_sync:
            source_regx: '^(hub\.pingcap\.net|us-docker.pkg.dev/pingcap-testing-account/(hotfix|hub))/(pingcap|tikv)/[\w-/]+:v\d+\.\d+\.\d+-\d{8,}.*$'
            target_regx: '^((docker\.io/)?pingcap/[\w-]+|gcr\.io/pingcap-public/dbaas/[\w-]+):v\d+\.\d+\.\d+-\d{8,}.*$'
            polling_rate: "10s"

        config-tiup-staging.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}
          github:
            token: {{ .github_token }}
          lark:
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}
            channels: {{ .lark_channels }}
          worker:
            kinds: ["tiup"]
            targets: ["tiup-staging"]
            concurrency: 1
            poll_interval: "10s"
            lease: "9m"
            heartbeat: "30s"
            hard_timeout: "7m"
            max_attempts: 3
          publish:
            targets: ["tiup-staging"]
            delivery_config_path: /etc/delivery/delivery.yaml
            tiup_mirrors:
              staging: {{ .tiup_staging_url }}
            # Phase 4 canary: only staging converges. An hourly window keeps
            # latest-wins observable within one shift; prod stays on the
            # legacy publish-every-push path until Phase 5.
            nightly:
              enabled: true
              targets:
                tiup-staging:
                  window: "1h"
                  anchor: "00:00"
                  timezone: UTC
                  on_failure: alert
        config-tiup-prod.yaml: |
          store:
            driver: mysql
            dsn: {{ .dsn }}
          github:
            token: {{ .github_token }}
          lark:
            enabled: true
            app_id: {{ .lark_app_id }}
            app_secret: {{ .lark_app_secret }}
            channels: {{ .lark_channels }}
          worker:
            kinds: ["tiup"]
            targets: ["tiup-prod"]
            concurrency: 1
            poll_interval: "10s"
            lease: "9m"
            heartbeat: "30s"
            hard_timeout: "7m"
            max_attempts: 3
          publish:
            targets: ["tiup-prod"]
            delivery_config_path: /etc/delivery/delivery.yaml
            tiup_mirrors:
              prod: {{ .tiup_prod_url }}
            # Prod nightly convergence: pushes upsert the newest artifact and
            # the reconciler publishes it once per 12h window at 02:00 UTC.
            nightly:
              enabled: true
              targets:
                tiup-prod:
                  window: "12h"
                  anchor: "02:00"
                  timezone: UTC
                  on_failure: alert


  data:
    - secretKey: github_token
      remoteRef:
        key: github-bot-token
    - secretKey: dsn
      remoteRef:
        key: tibuild_v2_dsn
    - secretKey: lark_app_id
      remoteRef:
        key: tibuild_v2_lark_app_id
    - secretKey: lark_app_secret
      remoteRef:
        key: tibuild_v2_lark_app_secret
    - secretKey: lark_channels
      remoteRef:
        key: tibuild_v2_lark_channels
    - secretKey: tiup_staging_url
      remoteRef:
        key: tiup-staging-mirror-url
    - secretKey: tiup_prod_url
      remoteRef:
        key: tiup-prod-mirror-url
