apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.7
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  # A chart bump rolls both the API and the worker because the pod template
  # carries the helm.sh/chart label. With image pulls around a minute per pod
  # and three worker replicas, 5m is not enough and Helm aborts mid-rollout.
  timeout: 15m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    enable: true
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.10.25-29-ga572553
    server:
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for image sync (crane), mounted as Docker config.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
    serviceAccount:
      create: false
    worker:
      enabled: true
      replicaCount: 3
      image:
        # The worker code changed (configurable thresholds, global alert
        # election) but the API image did not, so pin it separately.
        # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-worker versioning=semver
        tag: v2026.10.25-37-g64e964c
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "500m"
          memory: 512Mi
    httpRoute:
      enabled: true
      parentRefs:
        - kind: Gateway
          name: internal-gateway
          namespace: infra
      hostnames:
        - internal2-do.pingcap.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild/api/v2
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /api/v2
