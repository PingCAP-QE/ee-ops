apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: v2
spec:
  chart:
    spec:
      chart: tibuild-v2
      version: 2.0.0-alpha.9
      sourceRef:
        kind: HelmRepository
        name: ee-apps
        namespace: flux-system
  interval: 5m
  # A chart bump rolls both the API and the worker because the pod template
  # carries the helm.sh/chart label. With image pulls around a minute per pod
  # and three worker replicas, 5m is not enough and Helm aborts mid-rollout.
  timeout: 15m
  install:
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  test:
    # The chart's only test hook is the API connection pod, which is not
    # rendered when server.enabled is false. Disable the Flux helm test so a
    # rollout does not fail on an empty test suite.
    enable: false
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: 512Mi
    image:
      repository: ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2
      # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-v2 versioning=semver
      tag: v2026.11.8-12-g5c5f902
    server:
      # prod2 only keeps the two TiUP publish workers. The API has no consumers:
      # both do2.pingcap.net/tibuild and internal2-do.pingcap.net/tibuild have
      # zero upstream requests, and all CI/ops clients use prow.tidb.net or the
      # in-cluster gcp service.
      enabled: false
      debug: false
      config:
        secretName: v2-config
        secretKey: config.yaml
      # Registry credentials for image sync (crane), mounted as Docker config.
      volumes:
        - name: docker-cred
          secret:
            secretName: image-release-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: packages-config
          configMap:
            name: packages-config
        - name: tidbcloud-config
          secret:
            secretName: tibuild-v2-tidbcloud-config
      volumeMounts:
        - name: docker-cred
          mountPath: /root/.docker
          readOnly: true
        - name: packages-config
          subPath: delivery.yaml
          mountPath: /etc/delivery/delivery.yaml
          readOnly: true
        - name: tidbcloud-config
          subPath: service-tidbcloud-ops.yaml
          mountPath: /etc/tidbcloud/ops.yaml
          readOnly: true
        - name: tidbcloud-config
          subPath: service-tidbcloud-testplatforms.yaml
          mountPath: /etc/tidbcloud/testplatforms.yaml
          readOnly: true
    serviceAccount:
      create: false
    # prod2 publishes TiUP and runs no image copies: the default worker is
    # disabled (worker.default.enabled) while the two per-mirror workers below
    # do the work. Each mounts only its own signing key.
    worker:
      enabled: true
      default:
        enabled: false
      replicaCount: 1
      image:
        # renovate: datasource=docker depName=ghcr.io/pingcap-qe/ee-apps/exp-tibuild-worker versioning=semver
        tag: v2026.11.8-12-g5c5f902
      resources:
        # TiUP packages can be several hundred MB (ctl is ~574 MB). The worker
        # streams the OCI layer to disk, but tiup still reads the whole
        # tarball; 4Gi leaves headroom for the download buffer and the publish
        # subprocess.
        requests:
          cpu: "200m"
          memory: 1Gi
        limits:
          cpu: "500m"
          memory: 4Gi
      extraDeployments:
        - name: tiup-staging
          config:
            secretName: v2-config
            secretKey: config-tiup-staging.yaml
          volumes:
            - name: tiup-credentials
              secret:
                secretName: tiup-credentials-staging
            - name: docker-cred
              secret:
                secretName: image-release-cred
                items:
                  - key: .dockerconfigjson
                    path: config.json
          volumeMounts:
            - name: tiup-credentials
              subPath: private.json
              mountPath: /root/.tiup/keys/private.json
              readOnly: true
            - name: docker-cred
              mountPath: /root/.docker
              readOnly: true
        - name: tiup-prod
          config:
            secretName: v2-config
            secretKey: config-tiup-prod.yaml
          volumes:
            - name: tiup-credentials
              secret:
                secretName: tiup-credentials-prod
            - name: docker-cred
              secret:
                secretName: image-release-cred
                items:
                  - key: .dockerconfigjson
                    path: config.json
          volumeMounts:
            - name: tiup-credentials
              subPath: private.json
              mountPath: /root/.tiup/keys/private.json
              readOnly: true
            - name: docker-cred
              mountPath: /root/.docker
              readOnly: true
    httpRoute:
      # The internal2-do route is part of the API surface; it is removed with
      # the server. The external do2 basicAuth route lives in its own manifests
      # and is removed in the same change.
      enabled: false
      parentRefs:
        - kind: Gateway
          name: internal-gateway
          namespace: infra
      hostnames:
        - internal2-do.pingcap.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /tibuild/api/v2
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /api/v2
