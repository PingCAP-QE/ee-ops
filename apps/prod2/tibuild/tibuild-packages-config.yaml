# Sync PingCAP-QE/artifacts/packages into the tibuild namespace so the prod2 API
# can read the delivery rules when it plans a publication.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: artifacts-delivery
spec:
  interval: 5m0s
  ref:
    branch: main
  url: https://github.com/PingCAP-QE/artifacts.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tibuild-packages-config
spec:
  targetNamespace: tibuild
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: artifacts-delivery
  path: ./packages
  prune: true
