# generate for self-charge secret `zot-secret`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-secret
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        # you should add records to htpasswd file by command:
        # $ htpasswd -bBn <username> <password> >> <htpasswd/file/path>
        key: prod2_zot_htpasswd
    - secretKey: sessionKeys.json
      remoteRef:
        key: prod2_zot_sessionKeys_json
    - secretKey: sync_auth.json
      remoteRef:
        key: prod2_zot_sync_auth_credentials_json
---
# some secret to provide to generage configmap `zot-config`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-config-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Keep the existing env-style keys consumed by zot-config. The source
        # Google OAuth secret uses the canonical client-id/client-secret keys.
        GOOGLE_CLIENT_ID: '{{ index . "client-id" }}'
        GOOGLE_CLIENT_SECRET: '{{ index . "client-secret" }}'
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        S3_REGION_ENDPOINT: "{{ .S3_REGION_ENDPOINT }}"
        S3_REGION: "{{ .S3_REGION }}"
  dataFrom:
    - extract:
        # json object contains keys: `client-id`, `client-secret`
        key: google-oauth2-client-zot
    - extract:
        # json object contains keys: `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_BUCKET`, `S3_REGION_ENDPOINT`, `S3_REGION`
        key: prod2_zot_s3
