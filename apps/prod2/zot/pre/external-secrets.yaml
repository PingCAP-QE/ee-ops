# generate for self-charge secret `zot-secret`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-secret
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        # you should add records to htpasswd file by command:
        # $ htpasswd -bBn <username> <password> >> <htpasswd/file/path>
        key: prod2_zot_htpasswd
    - secretKey: sessionKeys.json
      remoteRef:
        key: prod2_zot_sessionKeys_json
    - secretKey: sync_auth.json
      remoteRef:
        key: prod2_zot_sync_auth_credentials_json
---
# some secret to provide to generage configmap `zot-config`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-config-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Keep the existing env-style keys consumed by zot-config. The source
        # Google OAuth secret uses the canonical client-id/client-secret keys.
        GOOGLE_CLIENT_ID: '{{ index . "client-id" }}'
        GOOGLE_CLIENT_SECRET: '{{ index . "client-secret" }}'
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        S3_REGION_ENDPOINT: "{{ .S3_REGION_ENDPOINT }}"
        S3_REGION: "{{ .S3_REGION }}"
  dataFrom:
    - extract:
        # json object contains keys: `client-id`, `client-secret`
        key: google-oauth2-client-zot
    - extract:
        # json object contains keys: `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_BUCKET`, `S3_REGION_ENDPOINT`, `S3_REGION`
        key: prod2_zot_s3

---
# The zot configuration itself, rendered by External Secrets into a Secret.
#
# It used to be a ConfigMap produced by kustomize and filled in by Flux
# `postBuild.substituteFrom`, which wrote the S3 keys, the Redis password and the
# OAuth client secret into a plaintext ConfigMap. Now every value comes from GCP
# Secret Manager and the result is a Secret; Flux substitutes nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: zot-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "log": { "level": "debug" },
            "storage": {
              "rootDirectory": "/var/lib/registry",
              "remoteCache": true,
              "commit": true,
              "dedupe": true,
              "gc": true,
              "gcDelay": "1h",
              "gcInterval": "24h",
              "storageDriver": {
                "name": "s3",
                "rootdirectory": "/",
                "secure": true,
                "skipverify": false,
                "forcepathstyle": false,
                "region": "{{ .S3_REGION }}",
                "regionendpoint": "{{ .S3_REGION_ENDPOINT }}",
                "bucket": "{{ .S3_BUCKET }}",
                "accesskey": "{{ .S3_ACCESS_KEY }}",
                "secretkey": "{{ .S3_SECRET_KEY }}"
              },
              "cacheDriver": {
                "name": "redis",
                "url": "redis://:{{ .REDIS_PASSWORD }}@redis-master:6379/0?dial_timeout=3&read_timeout=6s",
                "keyprefix": "zot"
              }
            },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "compat": ["docker2s2"],
              "externalUrl": "https://hub-zot.pingcap.net",
              "realm": "zot",
              "auth": {
                "failDelay": 5,
                "htpasswd": {
                  "path": "/secret/htpasswd"
                },
                "sessionKeysFile": "/secret/sessionKeys.json",
                "apikey": true,
                "openid": {
                  "providers": {
                    "google": {
                      "issuer": "https://accounts.google.com",
                      "clientid": "{{ index . "client-id" }}",
                      "clientsecret": "{{ index . "client-secret" }}",
                      "scopes": ["openid", "email"]
                    }
                  }
                }
              },
              "accessControl": {
                "groups": {
                  "pushers": {
                    "users": ["cd-bot"]
                  }
                },
                "repositories": {
                  "mirrors/**": {
                    "policies": [
                      {
                        "groups": ["pushers"],
                        "actions": ["read", "create", "update"]
                      }
                    ],
                    "anonymousPolicy": ["read"],
                    "defaultPolicy": ["read"]
                  },
                  "**": {
                    "policies": [
                      {
                        "groups": ["pushers"],
                        "actions": ["read", "create", "update"]
                      }
                    ],
                    "anonymousPolicy": [],
                    "defaultPolicy": ["read"]
                  }
                },
                "adminPolicy": {
                  "users": ["admin", "wuhui.zuo@pingcap.com"],
                  "actions": ["read", "create", "update", "delete"]
                }
              },
              "ratelimit": {
                "rate": 100,
                "methods": [
                  {
                    "method": "GET",
                    "rate": 50
                  }
                ]
              }
            },
            "extensions": {
              "ui": {
                "enable": true
              },
              "search": {
                "enable": true
              },
              "sync": {
                "enable": true,
                "downloadDir": "/tmp/zot",
                "credentialsFile": "/secret/sync_auth.json",
                "registries": [
                  {
                    "urls": ["https://us-docker.pkg.dev"],
                    "preserveDigest": true,
                    "content": [
                      {
                        "prefix": "/pingcap-testing-account/dev/**",
                        "destination": "/mirrors/dev",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/tidbx/**",
                        "destination": "/mirrors/tidbx",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/hub/**",
                        "destination": "/mirrors/hub",
                        "stripPrefix": true
                      },
                      {
                        "prefix": "/pingcap-testing-account/internal/**",
                        "destination": "/mirrors/internal",
                        "stripPrefix": true
                      }
                    ],
                    "onDemand": true,
                    "tlsVerify": true
                  }
                ]
              },
              "scrub": {
                "enable": true,
                "interval": "120h"
              },
              "mgmt": {
                "enable": true
              },
              "events": {
                "enable": false
              }
            }
          }
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: prod2_zot_redis_password
  dataFrom:
    - extract:
        # json object contains keys: `client-id`, `client-secret`
        key: google-oauth2-client-zot
    - extract:
        # json object contains keys: `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_BUCKET`, `S3_REGION_ENDPOINT`, `S3_REGION`
        key: prod2_zot_s3
