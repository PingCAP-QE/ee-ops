# The redis password now lives in GCP Secret Manager (`prod2_zot_redis_password`,
# seeded with the value the in-cluster secret-generator had produced, so nothing
# rotates). Keeping it in the store lets External Secrets render zot's config
# without Flux substituting secrets into a ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: ee-gcp-sm
  target:
    name: redis
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: prod2_zot_redis_password
