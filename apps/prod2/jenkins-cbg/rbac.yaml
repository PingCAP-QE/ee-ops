apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-cbg-agent
  labels:
    app.kubernetes.io/name: jenkins-cbg
    app.kubernetes.io/part-of: jenkins-cbg-migrate
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - pods/attach
      - secrets
      - events
      - configmaps
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-cbg-agent
  labels:
    app.kubernetes.io/name: jenkins-cbg
    app.kubernetes.io/part-of: jenkins-cbg-migrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-cbg-agent
subjects:
  - kind: ServiceAccount
    name: jenkins-cbg
    namespace: jenkins-cbg
