# Ref: https://github.com/jenkinsci/helm-charts/blob/main/charts/jenkins/VALUES_SUMMARY.md
# Align with prod2 Flux (v2beta1 HelmRelease) and live jenkins-cbg migration stack.
controller:
  podLabels:
    app.kubernetes.io/part-of: jenkins-cbg-migrate

  nodeSelector:
    kubernetes.io/arch: amd64

  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: 2.504.1-lts-jdk21

  # targetPort/servicePort set in release.yaml HelmRelease values.
  jenkinsUriPrefix: /jenkins-pingkai
  # Chart injects --prefix from jenkinsUriPrefix and --webroot=/var/jenkins_cache/war.
  # Do not set jenkinsOpts --webroot here (would duplicate / conflict with chart).
  jenkinsUrl: https://cicd.pingcap.cn/jenkins-pingkai
  jenkinsAdminEmail: wuhui.zuo@pingcap.cn

  numExecutors: 0

  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 6Gi

  javaOpts: >-
    -Xms2048m -Xmx2048m -XX:+UseG1GC
    -Dhudson.model.DirectoryBrowserSupport.CSP=

  customInitContainers:
    - name: init-create-logs-dir
      # alpine:3.21.3 often fails via ksyun docker.io mirror; 3.24 is widely cached on prod2.
      image: alpine:3.24
      imagePullPolicy: IfNotPresent
      command: ["mkdir", "-p", "/var/jenkins_home/logs"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsUser: 1000
      volumeMounts:
        - mountPath: /var/jenkins_home
          name: jenkins-home

  ingress:
    enabled: false

  prometheus:
    enabled: false

  # Existing JENKINS_HOME (hot-copy) already has admin / security realm.
  # Do not let chart default admin secret become the securityRealm.
  admin:
    createSecret: false
