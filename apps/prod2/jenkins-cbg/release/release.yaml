apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jenkins-cbg
spec:
  releaseName: jenkins-cbg
  chart:
    spec:
      chart: jenkins
      version: 5.8.43
      sourceRef:
        kind: HelmRepository
        name: jenkins
        namespace: flux-system
  interval: 1h0m0s
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Skip chart tests on first adopt; jenkins chart tests assume a fresh install.
  test:
    enable: false
  valuesFrom:
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values1.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values2.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values3.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values4.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values5.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values6.yaml }
    - { kind: Secret, name: jenkins-cbg-values, valuesKey: values7.yaml }
  values:
    agent:
      namespace: jenkins-cbg
    controller:
      servicePort: 8080
      targetPort: 8080
    persistence:
      enabled: true
    serviceAccount:
      create: true
      name: jenkins-cbg
