# Protect jenkins-cbg only on the GWT webhook route.
# Thresholds are intentionally high so normal daily webhook volume is
# unaffected; limits engage only near overload / stampede.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jenkins-cbg-protect
  labels:
    app.kubernetes.io/name: jenkins-cbg
    app.kubernetes.io/part-of: jenkins-cbg-migrate
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jenkins-cbg-webhook
  circuitBreaker:
    # Near-capacity only. Envoy defaults are 1024; keep headroom for
    # legitimate bursts but stop unbounded pile-up onto Jenkins.
    maxConnections: 256
    maxParallelRequests: 128
    maxPendingRequests: 256
  rateLimit:
    local:
      rules:
        # Per Envoy replica. With 5 internal-gateway replicas, cluster
        # capacity is ~5x when traffic is balanced. 80 rps/replica is far
        # above normal GWT HTTP rate; only a stampede trips it.
        - limit:
            requests: 80
            unit: Second
