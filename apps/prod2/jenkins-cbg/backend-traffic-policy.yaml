# Webhook admit-queue (no rate-limit reject).
#
# GWT has no built-in intake queue: each HTTP call is handled in Jenkins,
# then triggered builds wait on the normal Jenkins build Queue.
# This policy only shapes how many webhook HTTP calls hit Jenkins at once:
# excess wait on Envoy (pending) and drain in, instead of 429/503.
# UI/API stay on jenkins-cbg HTTPRoute and are unaffected.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jenkins-cbg-protect
  labels:
    app.kubernetes.io/name: jenkins-cbg
    app.kubernetes.io/part-of: jenkins-cbg-migrate
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jenkins-cbg-webhook
  circuitBreaker:
    # Cap concurrent webhook handlers inside Jenkins; everything else waits.
    maxParallelRequests: 32
    maxParallelRetries: 32
    # Large pending = queue, do not reject under normal stampedes.
    maxPendingRequests: 4096
    maxConnections: 4096
