name: SA key inventory

# The register (docs/credential-rotation/sa-key-inventory.md) is Markdown, and
# the CD Test workflow ignores Markdown-only changes. This guard reads both the
# register and the manifests, so it needs its own unfiltered entry point:
# editing only the register must still be validated.
on:
  workflow_dispatch:
  pull_request:

jobs:
  Check-register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/flux2/tools
      - name: Self-test the register guard
        run: bash scripts/check-sa-key-inventory_test.sh
      - name: Verify the static service-account key register
        run: bash scripts/check-sa-key-inventory.sh
