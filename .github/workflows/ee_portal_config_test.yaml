name: EE Portal configuration

on:
  pull_request:
    branches: [main]
    paths:
      - apps/gcp/ee-portal/**
      - .github/workflows/ee_portal_config_test.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ee-ops
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Checkout portal compiler
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PingCAP-QE/ee-apps
          ref: main
          path: _ci/ee-apps
          persist-credentials: false
      - uses: actions/setup-go@3041bf56c941b36c617f3a0c5b5c1f0d16f6b6b4 # v6.0.0
        with:
          go-version: '1.24'
      - name: Compile registry
        working-directory: _ci/ee-apps/experiments/portal/cmd/portal-config
        run: |
          go run . \
            --input "$GITHUB_WORKSPACE/apps/gcp/ee-portal/modules" \
            --output "$GITHUB_WORKSPACE/apps/gcp/ee-portal/generated/registry.json"
      - name: Reject generated drift
        run: git diff --exit-code -- apps/gcp/ee-portal/generated/registry.json
      - name: Render deployment
        run: kubectl kustomize apps/gcp/ee-portal >/dev/null
