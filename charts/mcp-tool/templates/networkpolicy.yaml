{{- if .Values.networkPolicy.enabled }}
# The tool's handlers run with a platform token in the environment and the server
# itself has no inbound authentication, so "reachable from any pod" is the whole
# exposure. This policy narrows ingress to the consumers that were verified
# against the cluster.
{{- /*
Read the paragraph above with this one: the target clusters do not enforce
NetworkPolicy. #2650 (34f9fcad) probed this namespace from another one and got an
application-layer HTTP 400 instead of a timeout, so on gcp and TKE this object
does not enforce isolation - the allowed-namespace list is intent, not a boundary.
It is defence-in-depth only: never cite it as evidence that the tool is
unreachable, and close the exposure on the authentication and token-scope side.
(Kept as a template comment on purpose: a rendered manifest must stay
byte-identical to the previous release.)
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-tool.fullname" . }}
  labels:
    {{- include "mcp-tool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-tool.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The release's own namespace: the consumer that ships with this chart.
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- with .Values.networkPolicy.allowedNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
    {{- end }}
    # kubelet probes arrive from the node address, not from a pod. Dropping them
    # leaves the Pod running but never Ready.
    {{- with .Values.networkPolicy.nodeCIDRs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
    {{- end }}
{{- end }}
